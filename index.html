/* ============================================================
   MES RÉUNIONS (v0.22) — l'espace de l'animateur : ses réunions à venir (changer le jour, le lieu, confirmer),
   les comptes rendus à écrire, le rythme de chaque club (lieu, jour, heure habituels → « Planifier la suivante »).
   Le compte rendu (reunions.compte_rendu, jsonb) suit un canevas provisoire, à aligner sur le modèle national.
   ============================================================ */
const JOURS_LONG=["","lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const RANGS={0:"chaque",1:"1er",2:"2e",3:"3e",4:"4e","-1":"dernier"};
const CR_CHAMPS=[["deroule","Déroulé de la réunion","Ordre du jour, interventions, présentations de membres…"],["decisions","Décisions et recommandations","Mises en relation, affaires passées, décisions du groupe…"],["suivi","Points à suivre","Qui fait quoi d'ici la prochaine réunion"]];
function reuMesClubs(){return SESSION.animId?DB.clubs.filter(c=>c.animId===SESSION.animId):[]}
function reuPeutTout(){return ["superadmin","directeur_national","directeur"].includes(SESSION.role)}
function reuClubs(){const mine=reuMesClubs();if(window._reuTous||!mine.length)return DB.clubs.filter(c=>canEditClubId(c.id));return mine}
function reuACompteRendu(){const ids=new Set(reuClubs().map(c=>c.id));return DB.reunions.filter(r=>ids.has(r.clubId)&&isPast(r.date)&&r.statut!=="annulee"&&!r.crLe&&canEditReunion(r)).sort((a,b)=>b.date.localeCompare(a.date))}
function rythmeTexte(c){if(!c.rJour)return"";const r=c.rRang??0;return (r===0?"Chaque "+JOURS_LONG[c.rJour]:"Le "+RANGS[r]+" "+JOURS_LONG[c.rJour]+" du mois")+(c.heureHab?" à "+c.heureHab:"")}
function nthJour(y,m,jour,rang){ // jour 1=lundi..7 ; rang 1..4 ou -1
  const js=jour%7;
  if(rang===-1){const d=new Date(y,m+1,0);while(d.getDay()!==js)d.setDate(d.getDate()-1);return d}
  const d=new Date(y,m,1);while(d.getDay()!==js)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7*(rang-1));return d.getMonth()===m?d:null;
}
function prochaineDate(c){
  if(!c.rJour)return null;
  const der=DB.reunions.filter(r=>r.clubId===c.id&&r.statut!=="annulee").map(r=>r.date).sort().pop();
  const min=new Date(TODAY);if(der){const d=dObj(der);d.setDate(d.getDate()+1);if(d>min)min.setTime(d.getTime())}
  const r=c.rRang??0;
  if(r===0){const d=new Date(min);while(d.getDay()!==c.rJour%7)d.setDate(d.getDate()+1);return d}
  for(let k=0;k<14;k++){const d=nthJour(min.getFullYear(),min.getMonth()+k,c.rJour,r);if(d&&d>=min)return d}
  return null;
}
function dateLongue(d){return JOURS_LONG[d.getDay()||7]+" "+d.getDate()+" "+MOIS_LONG[d.getMonth()].toLowerCase()}

      ${passe?`<button class="btn mini ${r.crLe?"ghost":""}" onclick="openCR('${r.id}')">${r.crLe?"Compte rendu":"Écrire le compte rendu"}</button>`:""}</div></div>`;

  const rythmes=clubs.map((c,i)=>{const nd=prochaineDate(c),rt=rythmeTexte(c);

    ${bascule}
    ${acr.length?`<div class="month-label">Comptes rendus à écrire <span style="color:var(--crimson);font-weight:700">${acr.length}</span></div><div class="reu-l">${acr.map(reuCarte).join("")}</div>`:""}

function zoneNomForVille(ville){

}
const VILLE_COLORS={"Rabat":"#B0122E","Salé":"#B8862A","Kenitra":"#2E7D5B","Casablanca":"#3A5DA8","Dar Bouazza":"#5AA0C8","Bouskoura":"#7A4DA8","Marrakech":"#C8A24C","Tanger":"#1FA0A0"};
function villeColor(v){return VILLE_COLORS[v]||"#8C8085"}
function clubHealth(c){
  const membres=DB.membres.filter(m=>m.clubId===c.id);
  const upcoming=DB.reunions.some(r=>r.clubId===c.id&&!isPast(r.date)&&r.statut!=="annulee");
  let score=0,max=0;
  max+=25; if(c.animId)score+=25;
  max+=25; if(upcoming)score+=25;
  max+=25; if(membres.length){const avg=membres.reduce((a,m)=>a+[m.formulaire,m.contrat,m.facture,m.paiement].filter(Boolean).length,0)/(membres.length*4);score+=Math.round(avg*25);}
  if(c.objectif){max+=25;score+=Math.round(Math.min(1,membres.length/c.objectif)*25);}
  const pct=max?Math.round(score/max*100):0;
  const level=pct>=70?"ok":pct>=40?"warn":"bad";
  return{pct,level,nbM:membres.length,upcoming};
}
function clubNextAction(c){
  const membres=DB.membres.filter(m=>m.clubId===c.id);
  if(!c.animId)return{label:"Nommer un animateur",act:`clubForm('${c.id}')`};
  if(!DB.reunions.some(r=>r.clubId===c.id&&!isPast(r.date)&&r.statut!=="annulee"))return{label:"Planifier une réunion",act:`meetingForm('','${c.id}')`};
  const relanceM=membres.find(m=>!m.formulaire||!m.contrat||!m.facture||!m.paiement);
  const relance=membres.filter(m=>!m.formulaire||!m.contrat||!m.facture||!m.paiement).length;
  if(relance)return{label:relance+" membre"+(relance>1?"s":"")+" à relancer",act:`memberSheet('${c.id}','${relanceM.id}')`};
  const aInt=DB.reunions.filter(r=>r.clubId===c.id).flatMap(r=>r.guests||[]).filter(g=>g.statut==="À intégrer").length;
  if(aInt)return{label:aInt+" invité"+(aInt>1?"s":"")+" à intégrer",act:`closeSheet();go('agenda')`};
  if(c.objectif&&membres.length<c.objectif)return{label:"Recruter "+(c.objectif-membres.length)+" membre(s)",act:`memberSheet('${c.id}')`};
  return{label:"Rien à signaler ✓",act:""};
}

function viewTeam(){
  let anims=[...DB.animateurs];const wide=isWide();let k=0;
  const groups={};
  anims.forEach(a=>{const zn=zoneNomForVille(a.ville);(groups[zn]=groups[zn]||[]).push(a)});
  const zoneOrder=DB.zones.map(z=>z.nom).concat("Autres régions");
  const sections=Object.keys(groups)
    .sort((x,y)=>{const ix=zoneOrder.indexOf(x),iy=zoneOrder.indexOf(y);return (ix<0?99:ix)-(iy<0?99:iy)||x.localeCompare(y)})
    .map(zn=>{
      const list=groups[zn].sort((a,b)=>a.ville.localeCompare(b.ville)||a.nom.localeCompare(b.nom));
      return `<div class="month-label">${esc(zn)} <span style="color:var(--crimson);font-weight:700">${list.length}</span></div>
        ${wide?animsTable(list):`<div class="rl">${list.map(a=>animRow(a,k++)).join("")}</div>`}`;
    }).join("");
  const libres=DB.clubs.filter(c=>scopedClubIds().includes(c.id)&&!c.animId);
  const pourvoir=libres.length?`<div class="month-label">À pourvoir <span style="color:var(--crimson);font-weight:700">${libres.length}</span></div>
    <div class="${wide?"grid two":"rl"}">${libres.map(c=>`<div class="rl-row" style="--vc:${villeColor(c.ville)}"><button class="rl-h" onclick="openClub('${c.id}')"><span class="rl-emb">${esc(initiales(c.nom.replace(/^CAP\s+/,"")))}</span><span class="rl-t"><b>${esc(c.nom.replace(/^CAP\s+/,""))}</b><small>${esc(c.ville)} · <span class="rl-no">animateur à nommer</span></small></span><span class="rl-ind"><span class="rl-flag urgent"></span></span><span class="rl-chev">›</span></button></div>`).join("")}</div>`:"";
  return `<div class="page"><div class="page-head"><div><div class="eyebrow">Équipe</div><h2>Animateurs</h2><p>${anims.length} animateur${anims.length>1?"s":""}</p></div></div>

}

const REGION_RSK=["Rabat","Salé","Kenitra"];
function dashStats(clubs){
  const ids=clubs.map(c=>c.id);
  const membres=DB.membres.filter(m=>ids.includes(m.clubId));
  const reunions=DB.reunions.filter(r=>ids.includes(r.clubId));
  const invites=reunions.flatMap(r=>r.guests||[]);
  return{
    clubs:clubs.length,
    actifs:clubs.filter(c=>c.statut==="actif").length,
    creation:clubs.filter(c=>c.statut==="creation").length,
    sansAnim:clubs.filter(c=>!c.animId).length,
    membres:membres.length,
    payes:membres.filter(m=>m.paiement).length,
    membresMois:membres.filter(m=>m.createdAt&&m.createdAt.slice(0,7)===isoJour(new Date()).slice(0,7)).length,
    reunionsAvenir:reunions.filter(r=>!isPast(r.date)&&r.statut!=="annulee").length,
    reunionsRealisees:reunions.filter(r=>r.statut==="realisee").length,
    invites:invites.length,
    invitesMembre:invites.filter(g=>g.statut==="Membre").length,
    perClub:clubs.map(c=>({id:c.id,nom:c.nom,ville:c.ville,n:DB.membres.filter(m=>m.clubId===c.id).length,lvl:clubHealth(c).level})).sort((a,b)=>b.n-a.n||a.nom.localeCompare(b.nom))
  };
}
/* Chaque chiffre de la Synthèse ouvre la liste qu'il compte (dashDrill), chaque ligne la fiche.
   sc = périmètre : "nat" (tout le réseau) ou "reg" (Rabat·Salé·Kénitra), mémorisé dans _dashScope. */
let _dashScope={};
function dashTile(n,l,kind,sc,i,tr){return `<div class="stat link" style="--i:${i}" role="button" tabindex="0" onclick="dashDrill('${kind}','${sc}')" onkeydown="if(event.key==='Enter')dashDrill('${kind}','${sc}')"><div class="n" data-count="${n}">${n}</div><div class="l">${l}</div>${tr?`<div class="tr">▲ ${tr}</div>`:""}</div>`}
function dashSec(ton,ico,titre,sous,html,id){
  if(!html||!html.trim())return "";
  return `<section class="dsec dsec-${ton}"${id?` id="${id}"`:""}><header class="dsec-h"><span class="dsec-ic" aria-hidden="true">${ico}</span><div><h3>${titre}</h3>${sous?`<p>${sous}</p>`:""}</div></header><div class="dsec-b">${html}</div></section>`;
}
function dashBlock(s,sc,sansTodo){
  sc=sc||"nat";
  const maxN=Math.max(1,...s.perClub.map(c=>c.n));
  const ranks=s.perClub.map(c=>`<div class="rank-row link" onclick="openClub('${c.id}')"><span class="hdot ${c.lvl}"></span><div class="rn">${esc(c.nom.replace("CAP ",""))}<small>${esc(c.ville)}</small></div>
    <div class="bar"><i style="width:${Math.round(c.n/maxN*100)}%"></i></div><div class="rv">${c.n}</div></div>`).join("");
  return `
    <div class="stats">
      ${dashTile(s.clubs,`Clubs · ${s.actifs} actifs`,"clubs",sc,0)}
      ${dashTile(s.membres,"Membres","membres",sc,1,s.membresMois?`+${s.membresMois} ce mois`:"")}
      ${dashTile(s.reunionsAvenir,"Réunions à venir","reunions",sc,2)}
    </div>
    <div class="stats">
      ${dashTile(s.payes,"Membres à jour (payé)","payes",sc,3)}
      ${dashTile(s.invites,"Invités suivis","invites",sc,4)}
      ${dashTile(s.sansAnim,"Clubs sans animateur","sansAnim",sc,5)}
    </div>
    ${dashObjectif(sc)}
    ${dashActivite(sc)}
    ${dashRecos(sc)}
    ${sansTodo==="chiffres"?"":(sansTodo?"":dashATraiter(sc))+dashCroissance(s,sc)}`;
}
/* v0.29.0 — la Synthèse se lit en quatre chapitres délimités (dashSec) : chiffres, à traiter, croissance, équipe. */
function dashCroissance(s,sc){
  return `${dashCourbe(sc)}
    <div class="dash-h">Membres par région</div>
    ${membresRegions(sc)||`<div class="rank"><div class="rank-row"><div class="rn" style="color:var(--muted);font-weight:500">Aucun club dans ce périmètre.</div></div></div>`}`;
}

const madFmt=n=>new Intl.NumberFormat("fr-FR").format(Math.round(Number(n)||0)).replace(/ | /g," ")+" MAD";
const RECO_LIB={envoyee:"Envoyée",contact:"Contact pris",devis:"Devis envoyé",signee:"Affaire signée",sans_suite:"Sans suite"};
function membreNom(id){const m=DB.membres.find(x=>x.id===id);return m?m.nom:"—"}
/* Recos d'un périmètre (club de celui qui donne). Montant compté à la date de signature (maj_le). */
function recosStats(ids,depuis){const l=(DB.recos||[]).filter(r=>ids.has(r.club_id));
  const s=l.filter(r=>r.statut==="signee"&&(!depuis||r.maj_le>=depuis));
  return {l,recos:l.filter(r=>!depuis||r.cree_le>=depuis).length,signees:s.length,montant:s.reduce((a,r)=>a+Number(r.montant||0),0)}}
function dashRecos(sc){
  const ids=new Set(_dashScope[sc]||[]);if(!(DB.recos||[]).some(r=>ids.has(r.club_id)))return"";
  const d=new Date(TODAY.getFullYear(),TODAY.getMonth(),1).toISOString(),y=new Date(TODAY.getFullYear(),0,1).toISOString();
  const m=recosStats(ids,d),a=recosStats(ids,y);
  return `<div class="dash-recos link" role="button" tabindex="0" onclick="openRecos('${sc}')" onkeydown="if(event.key==='Enter')openRecos('${sc}')">
    <div><small>Affaires générées par les recos · ${MOIS_LONG[TODAY.getMonth()].toLowerCase()}</small><b data-count="${Math.round(m.montant)}" data-fmt="mad">${esc(madFmt(m.montant))}</b>
    <span>${m.signees} signée${m.signees>1?"s":""} · ${m.recos} reco${m.recos>1?"s":""} ce mois · depuis janvier ${esc(madFmt(a.montant))}</span></div><i aria-hidden="true">🤝</i></div>`;
}

/* ---- Renouvellements : échéance = début d'abonnement (à défaut, date d'intégration) + 1 an ---- */
function abDebut(m){return m.abDebut||(m.createdAt?isoJour(new Date(m.createdAt)):"")}
function abPlus1an(iso){if(!iso)return "";const d=dObj(iso);d.setFullYear(d.getFullYear()+1);return isoJour(d)}
function abEcheance(m){return abPlus1an(abDebut(m))}
function abJours(m){const e=abEcheance(m);return e?Math.round((dObj(e)-TODAY)/864e5):null}
function abEchTxt(debut){const e=abPlus1an(debut);if(!e)return "";const d=dObj(e);return "Échéance : "+d.getDate()+" "+MOIS_LONG[d.getMonth()].toLowerCase()+" "+d.getFullYear()+" (formule annuelle 9 000 MAD HT)"}
function abDuree(j){return j<0?`dépassée de ${-j} jour${j<-1?"s":""}`:j===0?"aujourd'hui":`dans ${j} jour${j>1?"s":""}`}
function renouvAFaire(ids){return DB.membres.filter(m=>(!ids||ids.has(m.clubId))&&abJours(m)!==null&&abJours(m)<=30).sort((a,b)=>abJours(a)-abJours(b))}
function mbAbonnementHTML(m,d,canEd){
  const j=abJours(m);if(j===null)return "";
  const e=dObj(abEcheance(m)),txt=e.getDate()+" "+MOIS_LONG[e.getMonth()].toLowerCase()+" "+e.getFullYear();
  return `${secHead("Abonnement")}
    <div class="drow"><div class="tx"><div class="k">Échéance${m.abDebut?"":" (calculée sur la date d'intégration)"}</div><div class="v">${esc(txt)} <span class="renouv-j ${j<0?"ko":j<=30?"w":""}">${esc(abDuree(j))}</span></div></div>${canEd&&j<=30?`<a href="#" onclick="renouvMarquer('${m.id}');return false">Renouvelé</a>`:""}</div>
    ${canEd&&j<=30?`<div class="mb-code-act"><button class="btn mini" onclick="renouvRelancer('${m.id}')">Relancer par WhatsApp</button>${m.relanceRenouvLe?`<small class="fh-note">Relancé le ${esc(adhDate(m.relanceRenouvLe))}</small>`:""}</div>`:""}`;
}
function openRenouvellements(){
  const ids=new Set(scopedClubIds().length?scopedClubIds():DB.clubs.map(c=>c.id)),l=renouvAFaire(ids);
  document.getElementById("sheet-content").innerHTML=`<h3>Renouvellements à venir</h3>
    <div class="sheet-sub">Abonnements qui arrivent à échéance dans les 30 jours, ou dépassés. Formule annuelle 9 000 MAD HT.</div>
    ${l.length?`<div class="rank">${l.map(m=>{const j=abJours(m),tel=mbInfos(m).m_tel,ed=canEditClubId(m.clubId);return `<div class="rank-row"><div class="rn link" onclick="memberSheet('${m.clubId}','${m.id}')">${esc(m.nom)}<small>${esc((club(m.clubId).nom||"").replace(/^CAP\s+/,""))} · échéance ${esc(abDuree(j))}${m.relanceRenouvLe?" · relancé le "+esc(adhDate(m.relanceRenouvLe)):""}</small></div>
      ${ed?`<span class="renouv-act">${tel?`<button class="btn ghost mini" onclick="renouvRelancer('${m.id}',true)">Relancer</button>`:`<small class="fh-note">mobile manquant</small>`}<button class="btn mini" onclick="renouvMarquer('${m.id}',true)">Renouvelé</button></span>`:""}</div>`}).join("")}</div>`:`<p class="fh-empty">✓ Aucun renouvellement dans les 30 prochains jours.</p>`}
    <div class="sheet-actions"><button class="btn" onclick="closeSheet()">Fermer</button></div>`;

function waOuvrir(tel,msg){window.open(`https://wa.me/${mbWa(tel)}?text=${encodeURIComponent(msg)}`,"_blank","noopener")}
async function renouvRelancer(id,depuisListe){
  const m=DB.membres.find(x=>x.id===id),tel=mbInfos(m).m_tel;if(!tel){toast("Mobile manquant : ajoute-le dans ses informations","w");return}
  const e=dObj(abEcheance(m)),c=(club(m.clubId).nom||"ton club").replace(/^CAP\s+/,"");
  waOuvrir(tel,`Bonjour ${String(m.nom).split(/\s+/)[0]}, ton abonnement au club ${c} arrive à échéance le ${e.getDate()} ${MOIS_LONG[e.getMonth()].toLowerCase()}. On fait le point ensemble pour le renouveler ? Formule annuelle : 9 000 MAD HT. Merci !`);
  const now=new Date().toISOString();const {error}=await sb.from("membres").update({relance_renouv_le:now}).eq("id",id);
  if(error){toast(rlsMsg(error));return}m.relanceRenouvLe=now;
  depuisListe?openRenouvellements():memberSheet(m.clubId,m.id);
}
async function renouvMarquer(id,depuisListe){
  const m=DB.membres.find(x=>x.id===id),nv=abEcheance(m);
  if(!confirm(`Renouvelé ? Le nouvel abonnement démarre le ${nv.split("-").reverse().join("/")}, échéance un an plus tard.`))return;
  const {error}=await sb.from("membres").update({abonnement_debut:nv,relance_renouv_le:null}).eq("id",id);
  if(error){toast(rlsMsg(error));return}
  Object.assign(m,{abDebut:nv,relanceRenouvLe:null});pluieConfettis();toast("Abonnement de "+m.nom+" renouvelé","s",()=>memberSheet(m.clubId,m.id));render();
  depuisListe?openRenouvellements():memberSheet(m.clubId,m.id);
}

/* Repli automatique (réglable dans Paramètres, mémorisé sur l'appareil) : une région ou un groupe déplié se replie

const REPLI_CHOIX=[0,3,5,10,30];
function repliDelai(){try{const v=localStorage.getItem("cap-repli");return v===null?3:Math.max(0,+v||0)}catch(e){return 3}}

  el._rt=setTimeout(()=>{if(!el.isConnected)return;if(el._survol||el.querySelector(":focus-visible")){repliArmer(el,el._fermer);return}el._fermer()},d*1000);

/* C — les cartes de club s'inclinent vers la souris et une lueur or la suit (ordinateur seulement). */

  const nI=SESSION.role==="visiteur"?0:adhAIntegrer().length,nS=SESSION.role==="visiteur"?0:adhASaisir().length;
  const adhRows=(nI?`<div class="rank-row link" onclick="openAdhesions('todo')"><span class="dt-ic urgent">📝</span><div class="rn">${nI} adhésion${nI>1?"s":""} à intégrer<small>Formulaires reçus par le lien</small></div></div>`:"")
    +(nS?`<div class="rank-row link" onclick="openAdhesions('saisie')"><span class="dt-ic">🗂</span><div class="rn">${nS} à saisir dans le CRM national<small>Contrat membre à préparer</small></div></div>`:"")
    +(SESSION.role==="visiteur"?"":suiviRows(ids));
  const reg=todoRegions(sc),nX=SESSION.role==="visiteur"?0:suiviCompte(ids);
  const nC=DB.clubs.filter(c=>ids.has(c.id)).map(todoClub).filter(x=>x.plan||x.bil.length||x.anim).length;
  const tot=nC+(nI?1:0)+(nS?1:0)+nX;
  if(!tot)return `<div class="dash-todo ok">✓ Rien n'attend d'action.</div>`;
  return `<div class="dash-h dash-todo-h">À traiter <span style="color:var(--crimson);font-weight:700">${tot}</span></div>
    ${adhRows?`<div class="rank dash-todo">${adhRows}</div>`:""}${nC?reg+`<button type="button" class="km-lien" style="margin:-4px 2px 12px" onclick="go2('clubs')">Voir les ${nC} groupe${nC>1?"s":""} à traiter dans l'onglet Clubs ›</button>`:""}`;
}
function go2(t){go(t);if(t==="clubs"){filter="todo";render()}}
/* Entonnoir des invités : une colonne par étape, hauteur proportionnelle, clic = la liste. */
function dashFunnel(clubs,sc){
  const ids=clubs.map(c=>c.id);
  const invites=DB.reunions.filter(r=>ids.includes(r.clubId)).flatMap(r=>r.guests||[]);
  if(!invites.length)return"";
  const n=GUEST_STATUTS.map(s=>invites.filter(g=>g.statut===s).length),mx=Math.max(1,...n);
  const cols=GUEST_STATUTS.map((s,i)=>`<button class="fn-col" onclick="dashDrill('inv:${s}','${sc||"nat"}')"><b data-count="${n[i]}">${n[i]}</b><i style="height:${Math.max(4,Math.round(n[i]/mx*56))}px;--i:${i}"></i><small>${esc(s)}</small></button>`).join("");
  return `<div class="dash-h">Entonnoir des invités <span style="color:var(--crimson);font-weight:700">${invites.length}</span></div>
    <div class="funnel">${cols}</div>`;
}
function dashByAnim(clubs){
  const ids=new Set(clubs.map(c=>c.id));
  const anims=DB.animateurs.filter(a=>DB.clubs.some(c=>c.animId===a.id&&ids.has(c.id)));
  if(!anims.length)return"";
  const rows=anims.map(a=>{
    const acl=DB.clubs.filter(c=>c.animId===a.id&&ids.has(c.id));
    const nbM=DB.membres.filter(m=>acl.some(c=>c.id===m.clubId)).length;
    const nbUp=DB.reunions.filter(r=>acl.some(c=>c.id===r.clubId)&&!isPast(r.date)&&r.statut!=="annulee").length;
    return{id:a.id,nom:a.nom,c:acl.length,m:nbM,r:nbUp};
  }).sort((x,y)=>y.m-x.m);
  const maxM=Math.max(1,...rows.map(r=>r.m));
  return `<div class="dash-h">Par animateur</div>
    <div class="rank">${rows.map(r=>`<div class="rank-row link" onclick="openAnim('${r.id}')"><div class="rn">${esc(r.nom)}<small>${r.c} club${r.c>1?"s":""} · ${r.r} réunion${r.r>1?"s":""} à venir</small></div>
      <div class="bar"><i style="width:${Math.round(r.m/maxM*100)}%"></i></div><div class="rv">${r.m}</div></div>`).join("")}</div>`;
}
function dashRelancer(clubs){
  const ids=new Set(clubs.map(c=>c.id));
  const flag=[["formulaire","Formulaire"],["contrat","Contrat"],["facture","Facture"],["paiement","Paiement"]];
  const list=DB.membres.filter(m=>ids.has(m.clubId)&&flag.some(f=>!m[f[0]]));
  if(!list.length)return `<div class="dash-h">À relancer</div>
    <div class="rank"><div class="rank-row"><div class="rn" style="color:var(--ok);font-weight:600">✓ Tous les membres sont à jour.</div></div></div>`;
  const rows=list.sort((a,b)=>flag.filter(f=>!a[f[0]]).length-flag.filter(f=>!b[f[0]]).length===0?0:flag.filter(f=>!b[f[0]]).length-flag.filter(f=>!a[f[0]]).length).map(m=>{
    const manque=flag.filter(f=>!m[f[0]]).map(f=>f[1]).join(", ");
    return `<div class="rank-row link" onclick="memberSheet('${m.clubId}','${m.id}')"><div class="rn">${esc(m.nom)}<small>${esc(club(m.clubId).nom.replace("CAP ",""))} · manque : ${esc(manque)}</small></div>
      <span class="gstat" style="background:var(--warn-tint);color:var(--warn);border-color:transparent">${4-flag.filter(f=>!m[f[0]]).length}/4</span></div>`;
  }).join("");
  return `<div class="dash-h">À relancer <span style="color:var(--warn);font-weight:700">${list.length}</span></div>
    <div class="rank">${rows}</div>`;
}
function dashDrill(kind,sc){
  const ids=new Set(_dashScope[sc]||DB.clubs.map(c=>c.id));
  const clubsS=DB.clubs.filter(c=>ids.has(c.id));
  const perim=sc==="reg"?"Rabat · Salé · Kénitra":"Tout le réseau";
  const row=(on,t,sub,right)=>`<div class="rank-row drill-row" onclick="${on}"><div class="rn">${t}<small>${sub}</small></div>${right||""}<span style="color:var(--muted);font-size:18px">›</span></div>`;
  const nomClub=id=>esc((club(id).nom||"").replace("CAP ",""));
  let titre="",items=[];
  if(kind==="clubs"||kind==="sansAnim"){
    const l=(kind==="clubs"?clubsS:clubsS.filter(c=>!c.animId)).sort((a,b)=>a.ville.localeCompare(b.ville)||a.nom.localeCompare(b.nom));
    titre=kind==="clubs"?"Clubs":"Clubs sans animateur";
    items=l.map(c=>row(`openClub('${c.id}')`,esc(c.nom),`${esc(c.ville)} · ${c.statut==="actif"?"actif":"en création"} · ${esc(animNom(c.animId))}`,`<span class="rv" style="font-size:14px">${DB.membres.filter(m=>m.clubId===c.id).length}</span>`));
  }else if(kind==="membres"||kind==="payes"){
    const l=DB.membres.filter(m=>ids.has(m.clubId)&&(kind==="membres"||m.paiement)).sort((a,b)=>nomClub(a.clubId).localeCompare(nomClub(b.clubId))||a.nom.localeCompare(b.nom));
    titre=kind==="membres"?"Membres":"Membres à jour (payé)";
    items=l.map(m=>{const cl=memberChecklist(m);return row(`memberSheet('${m.clubId}','${m.id}')`,esc(m.nom),`${nomClub(m.clubId)}${m.specialite?" · "+esc(m.specialite):""}`,`<span class="gstat">${cl.done}/${cl.total}</span>`)});
  }else if(kind==="reunions"){
    const l=DB.reunions.filter(r=>ids.has(r.clubId)&&!isPast(r.date)&&r.statut!=="annulee").sort((a,b)=>a.date.localeCompare(b.date));
    titre="Réunions à venir";
    items=l.map(r=>{const d=dObj(r.date);return row(`openMeeting('${r.id}')`,`${d.getDate()} ${MOIS[d.getMonth()]} · ${nomClub(r.clubId)}`,`${TYPES[r.type]} · ${esc(lieuNom(r.lieuId))}${r.heure?" · "+esc(r.heure):""}`,`<span class="st ${r.statut}">${STATUTS[r.statut]}</span>`)});
  }else if(kind==="invites"||kind.startsWith("inv:")){
    const st=kind.startsWith("inv:")?kind.slice(4):null;
    const l=DB.reunions.filter(r=>ids.has(r.clubId)).flatMap(r=>(r.guests||[]).map(g=>({g,r}))).filter(x=>!st||x.g.statut===st);
    titre=st?"Invités · "+st:"Invités suivis";
    items=l.map(({g,r})=>row(`openMeeting('${r.id}')`,esc(g.nom),`${nomClub(r.clubId)} · ${dObj(r.date).getDate()} ${MOIS[dObj(r.date).getMonth()]}${g.par?" · invité par "+esc(g.par):""}`,`<span class="gstat">${esc(g.statut)}</span>`));
  }
  document.getElementById("sheet-content").innerHTML=`
    <h3>${titre} <span style="color:var(--crimson)">${items.length}</span></h3><div class="sheet-sub">${perim}</div>
    ${items.length?`<div class="rank">${items.join("")}</div>`:`<div class="empty"><b>Rien à afficher</b>Aucun élément dans ce périmètre.</div>`}
    <div class="sheet-actions" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">Fermer</button></div>`;
  openSheet();
}
/* Les chiffres de la Synthèse comptent jusqu'à leur valeur (une fois par affichage). */
function dashCountUp(root){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  root.querySelectorAll("[data-count]").forEach((el,i)=>{
    const fin=+el.dataset.count;if(!fin)return;
    const t0=performance.now()+i*45,dur=Math.min(900,350+fin*25);
    const f=el.dataset.fmt==="mad"?madFmt:(x=>x);const d2=el.dataset.fmt==="mad"?1300:dur;
    el.textContent=f(0);
    const pas=t=>{const k=Math.max(0,Math.min(1,(t-t0)/d2));el.textContent=f(Math.round(fin*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(pas)};
    requestAnimationFrame(pas);
  });
}

  const seg=`<div class="seg-sc" role="tablist"><span class="knob" style="transform:translateX(${sc==="reg"?"100%":"0"})"></span><button role="tab" aria-selected="${sc==="nat"}" class="${sc==="nat"?"on":""}" onclick="window._dashSc='nat';render()">National</button><button role="tab" aria-selected="${sc==="reg"}" class="${sc==="reg"?"on":""}" onclick="window._dashSc='reg';render()">Rabat · Salé · Kénitra</button></div>`;

  if(large){html+=seg+`<div class="dash-cols"><div>`+chiffres+crois+`</div><div>`+todo+equipe+`</div></div>`;return html+`<div style="height:8px"></div></div>`}

/* ============================================================
   RENDEMENT — module privé (superadmin) : commissions sur adhésions
   ============================================================ */
const RD_KEY="cap-rendement-params";
let _rdData=[];
function fmtMAD(n){return Math.round(n||0).toLocaleString("fr-FR").replace(/ /g," ")+" MAD"}
function rdParams(){const def={membership:9000,tauxDirect:20,tauxReseau:10,objectif:500000,membresMin:10,membresMax:15};try{return{...def,...JSON.parse(localStorage.getItem(RD_KEY)||"{}")}}catch(e){return def}}
function rdSave(p){try{localStorage.setItem(RD_KEY,JSON.stringify(p))}catch(e){}}
function rdRate(c){if(c.animId&&c.animId===SESSION.animId)return"direct";if(REGION_RSK.includes(c.ville))return"reseau";return null}
function rdRevAt(g){const p=rdParams();let rev=0;_rdData.forEach(x=>rev+=g*p.membership*x.rate/100);return rev}
function rdSim(g){
  const p=rdParams();const rev=rdRevAt(g);
  const pct=Math.min(100,Math.round(rev/(p.objectif||1)*100));
  document.getElementById("rd-sim-g").textContent=g;
  document.getElementById("rd-sim-tot").textContent=(g*_rdData.length);
  document.getElementById("rd-sim-rev").textContent=fmtMAD(rev);
  document.getElementById("rd-sim-pct").textContent=pct+"% de l'objectif";
  document.getElementById("rd-sim-bar").style.width=pct+"%";
}
function rdEdit(){
  const g=x=>parseFloat(document.getElementById(x).value)||0;
  rdSave({membership:g("rd-membership"),objectif:g("rd-objectif"),tauxDirect:g("rd-td"),tauxReseau:g("rd-tr"),membresMin:g("rd-mmin"),membresMax:g("rd-mmax")});
  toast("Paramètres enregistrés");openRendement();
}
function openRendement(){
  if(SESSION.role!=="superadmin")return;
  const p=rdParams();
  _rdData=DB.clubs.map(c=>{
    const type=rdRate(c);if(!type)return null;
    const rate=type==="direct"?p.tauxDirect:p.tauxReseau;
    const membres=DB.membres.filter(m=>m.clubId===c.id).length;
    return{nom:c.nom,ville:c.ville,type,rate,membres,revActuel:membres*p.membership*rate/100};
  }).filter(Boolean).sort((a,b)=>(b.type==="direct")-(a.type==="direct")||b.rate-a.rate||a.nom.localeCompare(b.nom));
  const nbClubs=_rdData.length;
  const nbDirect=_rdData.filter(x=>x.type==="direct").length;
  const nbReseau=nbClubs-nbDirect;
  const membresReels=_rdData.reduce((s,x)=>s+x.membres,0);
  const totActuel=_rdData.reduce((s,x)=>s+x.revActuel,0);
  const pctA=Math.min(100,Math.round(totActuel/(p.objectif||1)*100));
  const unitPerG=_rdData.reduce((s,x)=>s+p.membership*x.rate/100,0); // revenu par +1 membre/groupe
  const revMin=unitPerG*p.membresMin, revMax=unitPerG*p.membresMax;
  const gObj=unitPerG?Math.ceil(p.objectif/unitPerG):0; // membres/groupe pour l'objectif
  const gStart=Math.round((p.membresMin+p.membresMax)/2);
  const revStart=unitPerG*gStart, pctStart=Math.min(100,Math.round(revStart/(p.objectif||1)*100));
  const rows=_rdData.map(x=>`<div class="rank-row"><span class="hdot ${x.type==="direct"?"bad":"warn"}"></span><div class="rn">${esc(x.nom.replace("CAP ",""))}<small>${esc(x.ville)} · ${x.type==="direct"?"Direct "+x.rate+"%":"Réseau "+x.rate+"%"} · ${x.membres} membre${x.membres>1?"s":""}</small></div><div class="rv" style="font-size:12.5px">${fmtMAD(p.membership*p.membresMax*x.rate/100)}</div></div>`).join("");
  document.getElementById("sheet-content").innerHTML=`
    <h3>Mon rendement</h3><div class="sheet-sub">Commissions sur les adhésions · zone Rabat·Salé·Kénitra.</div>

    <div class="rd-sec">Suivi réel de la région</div>
    <div class="rd-obj"><div class="h"><span>Objectif annuel · ${fmtMAD(p.objectif)}</span><b>${pctA}%</b></div>
      <div class="gauge"><i style="width:${Math.max(pctA,2)}%"></i></div><small>Réalisé à ce jour : ${fmtMAD(totActuel)}</small></div>
    <div class="rd-g" style="margin-top:8px">
      <div class="rd-k" style="--i:0"><div class="n">${nbClubs}</div><small>Clubs · ${nbDirect} direct${nbDirect>1?"s":""} / ${nbReseau} réseau</small></div>
      <div class="rd-k" style="--i:1"><div class="n">${membresReels}</div><small>Membres réels</small></div>
      <div class="rd-k" style="--i:2"><div class="n" style="font-size:16px">${fmtMAD(totActuel)}</div><small>Revenu réalisé</small></div>
      <div class="rd-k" style="--i:3"><div class="n" style="font-size:16px">${fmtMAD(unitPerG)}</div><small>Par membre ajouté dans chaque groupe</small></div>
    </div>

    <div class="divider"></div>
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--crimson);margin-bottom:6px">Projection — hypothèse ${p.membresMin} à ${p.membresMax} membres / groupe</div>
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="stat"><div class="n" style="font-size:15px">${fmtMAD(revMin)}</div><div class="l">Bas (${p.membresMin}/groupe) · ${Math.round(revMin/(p.objectif||1)*100)}% obj.</div></div>
      <div class="stat"><div class="n" style="font-size:15px">${fmtMAD(revMax)}</div><div class="l">Haut (${p.membresMax}/groupe) · ${Math.round(revMax/(p.objectif||1)*100)}% obj.</div></div>
    </div>
    <p style="font-size:12.5px;color:var(--ink);margin:4px 2px 0;font-weight:500">🎯 Pour atteindre <b>${fmtMAD(p.objectif)}</b>, il te faut <b>~${gObj} membres par groupe</b> (soit ${gObj*nbClubs} membres sur ${nbClubs} clubs).</p>

    <div class="divider"></div>
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--crimson);margin-bottom:6px">Simulateur</div>
    <label style="font-size:12.5px;color:var(--muted);font-weight:600">Membres par groupe : <b id="rd-sim-g" style="color:var(--ink)">${gStart}</b> · total <b id="rd-sim-tot" style="color:var(--ink)">${gStart*nbClubs}</b> membres</label>
    <input type="range" min="0" max="30" value="${gStart}" oninput="rdSim(this.value)" style="width:100%;accent-color:var(--crimson);margin:10px 0">
    <div class="health-banner warn"><div class="hbig" id="rd-sim-rev">${fmtMAD(revStart)}</div><div class="hna" style="width:100%"><b>Projection</b><span id="rd-sim-pct">${pctStart}% de l'objectif</span><div class="cc-prog" style="margin-top:6px"><i id="rd-sim-bar" style="width:${pctStart}%;background:var(--warn)"></i></div></div></div>

    <div class="divider"></div>
    <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">Détail par club — potentiel à ${p.membresMax} membres</div>
    <div class="rank">${rows||`<div class="rank-row"><div class="rn" style="color:var(--muted)">Aucun club dans ton périmètre.</div></div>`}</div>

    <div class="divider"></div>
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--crimson);margin-bottom:8px">Paramètres</div>
    <div class="frow"><div class="field"><label>Adhésion HT (MAD)</label><input id="rd-membership" type="number" value="${p.membership}"></div><div class="field"><label>Objectif annuel (MAD)</label><input id="rd-objectif" type="number" value="${p.objectif}"></div></div>
    <div class="frow"><div class="field"><label>Taux direct (%)</label><input id="rd-td" type="number" value="${p.tauxDirect}"></div><div class="field"><label>Taux réseau (%)</label><input id="rd-tr" type="number" value="${p.tauxReseau}"></div></div>
    <div class="frow"><div class="field"><label>Membres/groupe (bas)</label><input id="rd-mmin" type="number" value="${p.membresMin}"></div><div class="field"><label>Membres/groupe (haut)</label><input id="rd-mmax" type="number" value="${p.membresMax}"></div></div>
    <div class="sheet-actions"><button class="btn ghost" onclick="rdEdit()">Enregistrer</button><button class="btn" onclick="closeSheet()">Fermer</button></div>
    <p style="font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.55"><b>Bases :</b> Direct = clubs que tu animes (${p.tauxDirect}%). Réseau = autres clubs de ta zone (${p.tauxReseau}%). Revenu = membres × ${fmtMAD(p.membership)} × taux. Le « suivi réel » utilise les membres réellement saisis ; la « projection » applique l'hypothèse membres/groupe à tous tes clubs. Paramètres enregistrés sur cet appareil.</p>`;
  openSheet();
}

function openMeeting(id){
  const editing=!!id;
  const m=editing?DB.reunions.find(x=>x.id===id):null;
  if(editing&&!canEditReunion(m)){meetingDetail(m,false);return}
  if(editing){meetingDetail(m,true);return}
  meetingForm(null);
}
function meetingDetail(m,editable){
  const c=club(m.clubId),l=lieu(m.lieuId),dt=dObj(m.date);
  const guests=m.guests||[];
  const guestsHtml=guests.length?guests.map((g,i)=>`

/* v0.30.0 — Localisation d'un lieu par un lien Google Maps ou Waze : on lit la position dans le lien,
   les liens courts (maps.app.goo.gl, goo.gl) sont dépliés par la fonction serveur « lien-carte ». */
const GH32="0123456789bcdefghjkmnpqrstuvwxyz";
function geohashDec(h){let ev=true,la=[-90,90],lo=[-180,180];for(const ch of h){const v=GH32.indexOf(ch);if(v<0)return null;for(let b=4;b>=0;b--){const bit=(v>>b)&1,r=ev?lo:la,m=(r[0]+r[1])/2;r[bit?0:1]=m;ev=!ev}}return{lat:(la[0]+la[1])/2,lng:(lo[0]+lo[1])/2}}
function carteCoords(url){
  const u=String(url||"");let d;try{d=decodeURIComponent(u)}catch(e){d=u}
  const ok=(a,b)=>{a=+a;b=+b;return Math.abs(a)<=90&&Math.abs(b)<=180&&(a||b)?{lat:+a.toFixed(6),lng:+b.toFixed(6)}:null};
  let m=d.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);if(m)return ok(m[1],m[2]);
  m=d.match(/[?&](?:q|query|ll|destination|daddr|center)=(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);if(m)return ok(m[1],m[2]);
  m=d.match(/ll\.(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);if(m)return ok(m[1],m[2]);
  m=d.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);if(m)return ok(m[1],m[2]);
  m=d.match(/waze\.com\/ul\/h([0-9b-hjkmnp-z]{5,12})/i);if(m){const g=geohashDec(m[1]);return g&&ok(g.lat,g.lng)}
  m=d.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);if(m)return ok(m[1],m[2]);
  return null;
}
const estLienCarte=t=>/^\s*https?:\/\/\S*(google\.|goo\.gl|g\.co\/|waze\.com)/i.test(t||"");
const lienCourt=t=>/^\s*https?:\/\/(maps\.app\.goo\.gl|goo\.gl|g\.co)\//i.test(t||"");
function lieuAdresseLien(inp){if(!estLienCarte(inp.value))return;const l=document.getElementById("l-lien");l.value=inp.value.trim();inp.value="";lieuLienLu()}
function lieuPoser(c,src){
  document.getElementById("l-lat").value=c.lat;document.getElementById("l-lng").value=c.lng;
  const st=document.getElementById("l-lien-st");if(st){st.textContent="📍 Position trouvée : "+c.lat+", "+c.lng+(src?" ("+src+")":"");st.className="ok"}
}
let _lienJeton=0;
async function lieuLienLu(){
  const inp=document.getElementById("l-lien"),st=document.getElementById("l-lien-st");if(!inp)return;
  const v=inp.value.trim(),j=++_lienJeton;
  if(!v){st.textContent="La latitude et la longitude se remplissent toutes seules.";st.className="";return}
  const c=carteCoords(v);if(c){lieuPoser(c,/waze/i.test(v)?"Waze":"Google Maps");return}
  if(!lienCourt(v)&&!/google\./i.test(v)){st.textContent=estLienCarte(v)?"Lien gardé. La position n'y figure pas : utilise « Partager » dans Waze ou Google Maps.":"Colle un lien Google Maps ou Waze.";st.className="w";return}
  st.textContent="⏳ Lecture du lien…";st.className="";
  try{
    const {data,error}=await sb.functions.invoke("lien-carte",{body:{url:v}});if(j!==_lienJeton)return;
    if(error||!data||data.error)throw 0;
    const c2=(data.lat!=null&&data.lng!=null)?{lat:data.lat,lng:data.lng}:carteCoords(data.url);
    if(c2){lieuPoser(c2,data.approx?"approximative, vérifie sur la carte":(/waze/i.test(data.url||"")?"Waze":"Google Maps"));return}
    st.textContent="Lien gardé, mais la position n'a pas pu être lue. Tu peux saisir la latitude et la longitude à la main.";st.className="w";
  }catch(e){if(j!==_lienJeton)return;st.textContent="Lien gardé. Lecture impossible pour l'instant : la position reste à saisir.";st.className="w"}
}

  const q=[document.getElementById("l-nom").value,document.getElementById("l-ville").value,"Maroc"].filter(Boolean).join(" ");

  const wz=l.lat?`https://waze.com/ul?ll=${l.lat},${l.lng}&navigate=yes`:(l.lien&&/waze/i.test(l.lien)?l.lien:`https://waze.com/ul?q=${q}&navigate=yes`);

    const max=1000;let{width:w,height:h}=img;if(w>max||h>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
    _photoBuffer=cv.toDataURL("image/jpeg",0.72);

  };img.src=rd.result;};rd.readAsDataURL(file);
}
async function saveLieu(id){

async function delLieu(id){
  const used=DB.reunions.some(m=>m.lieuId===id&&!isPast(m.date));

/* Crée (ou remplace) le code d'accès du membre par la fonction serveur membre-acces. Le code n'est montré
   qu'ici, une seule fois : il n'est stocké nulle part en clair. */
async function mbCodeAcces(id){
  const m=DB.membres.find(x=>x.id===id),box=document.getElementById("mb-code-"+id);if(!m||!box)return;
  if(m.inscrit&&!confirm("Créer un nouveau code ? L'ancien ne marchera plus."))return;
  box.innerHTML=`<p class="fh-note">Création du code…</p>`;
  const {data:r,error}=await sb.functions.invoke("membre-acces",{body:{membre_id:id}});
  if(error||!r||r.error){let msg=r&&r.error;if(!msg&&error&&error.context)try{msg=(await error.context.json()).error}catch(e){}box.innerHTML=`<p class="fh-note" style="color:var(--crimson)">${esc(msg||(error&&error.message)||"Erreur")}</p>`;return}
  m.inscrit=true;

  const msg=`Bonjour ${prenom}, ton espace membre Protéine est ouvert : l'annuaire du réseau et les messages entre membres.\n\n${ESPACE_MEMBRE_URL}\nMobile : ${r.telephone.replace(/^212/,"0")}\nCode d'accès : ${r.code}\n\nTu pourras changer ce code dans « Mon profil ».`;
  box.innerHTML=`<div class="mb-code"><span>Code d'accès de ${esc(prenom)}</span><b>${esc(r.code)}</b><small>À transmettre au membre. Il ne s'affichera plus : en cas d'oubli, crée un nouveau code.</small>
    <div class="mb-code-act"><a class="btn mini" href="https://wa.me/${r.telephone}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Envoyer par WhatsApp</a><button class="btn ghost mini" onclick="navigator.clipboard&&navigator.clipboard.writeText(${esc(JSON.stringify(msg))}).then(()=>toast('Message copié'))">Copier le message</button></div></div>`;
  const etat=box.parentElement&&box.parentElement.querySelector(".mb-esp");if(etat&&!m.vuLe){etat.className="mb-esp";etat.textContent="Code créé, jamais connecté"}
  const lien=box.previousElementSibling&&box.previousElementSibling.querySelector("a");if(lien)lien.textContent="Nouveau code";
}

async function mbDocOuvrir(bucket,chemin){
  if(bucket==="adhesions"){const a=(DB.adhesions||[]).find(x=>x.pdf_path===chemin);if(a)return adhPdf(a.id)}
  const w=window.open("","_blank"); // ouvert avant l'attente réseau, sinon le téléphone bloque la fenêtre
  const {data,error}=await sb.storage.from(bucket).createSignedUrl(chemin,600);
  if(error||!data){if(w)w.close();toast("Document introuvable");return}
  if(w)w.location=data.signedUrl;else location.href=data.signedUrl;
}
async function mbDocAjouter(clubId,id,input){
  const f=input.files&&input.files[0];if(!f)return;
  if(f.size>20*1024*1024){toast("Fichier trop lourd (20 Mo au plus)");input.value="";return}
  const type=(document.getElementById("mb-doc-type")||{}).value||"autre";
  const propre=f.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80);
  const chemin=`${id}/${Date.now()}-${propre}`;
  toast("Envoi du document…","s");
  const up=await sb.storage.from("membres").upload(chemin,f,{contentType:f.type||"application/pdf"});
  if(up.error){toast("Envoi impossible : "+rlsMsg(up.error));input.value="";return}
  const {error}=await sb.from("membre_documents").insert({membre_id:id,type,nom:f.name,chemin});
  if(error){await sb.storage.from("membres").remove([chemin]);toast("Envoi impossible : "+rlsMsg(error));input.value="";return}
  if(type==="contrat_signe"){const m=DB.membres.find(x=>x.id===id);if(m&&!m.contrat){const r=await sb.from("membres").update({contrat:true}).eq("id",id);if(!r.error){m.contrat=true}}}
  toast("Document ajouté au dossier");memberSheet(clubId,id);
}

  if(error){toast("Retrait impossible : "+rlsMsg(error));return}

/* ============================================================
   ADHÉSIONS — formulaires remplis par les futurs membres (adhesion.html)
   La page publique dépose le PDF rempli + une ligne `adhesions` ; ici on
   les lit, on ouvre le PDF, et on intègre la personne dans `membres`.
   ============================================================ */
const ADH_STATUTS={recue:"Reçue",traitee:"Traitée",integree:"Intégrée",rejetee:"Rejetée"};
const ADH_DOT={recue:"bad",traitee:"warn",integree:"ok",rejetee:""};
function adhLink(clubId){const u=new URL("adhesion.html",location.href);if(clubId)u.searchParams.set("ref",clubId);return u.toString()}
function adhNom(a){return((a.data.m_prenom||"")+" "+(a.data.m_nom||"")).trim()||"—"}
function adhDate(iso){const d=new Date(iso);return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function adhNouvelles(){return(DB.adhesions||[]).filter(a=>a.statut==="recue").length}
/* ── v0.11 : suivi des adhésions ──
   Une adhésion avance en 3 temps : reçue → intégrée au club → saisie dans le CRM national.
   « En retard » = en attente depuis plus de ADH_DELAI_J jours (à traiter ou à saisir). */
const ADH_DELAI_J=2;
function adhJours(iso){return Math.floor((Date.now()-new Date(iso).getTime())/864e5)}
function adhAge(iso){const j=adhJours(iso);return j<=0?"aujourd'hui":j===1?"hier":"il y a "+j+" j"}
function adhEtape(a){if(a.statut==="rejetee")return-1;return a.saisie_proteine_le?3:a.statut==="integree"?2:1}
function adhEnRetard(a){const e=adhEtape(a);return(e===1||e===2)&&adhJours(a.created_at)>ADH_DELAI_J}
function adhSuivi(a){const e=adhEtape(a);if(e<0)return `<span class="rl-fact">Rejetée</span>`;
  return `<span class="adh-steps" title="Reçue → intégrée au club → saisie dans le CRM national">${[1,2,3].map(k=>`<i class="${k<=e?"on":""}"></i>`).join("")}</span>`}
function adhAIntegrer(){return(DB.adhesions||[]).filter(a=>a.statut==="recue"||a.statut==="traitee")}
let _adhFiltre="todo";
async function adhCharger(){const {data,error}=await sb.from("adhesions").select("*").order("created_at",{ascending:false});if(!error&&data)DB.adhesions=data;try{localStorage.setItem("cap-adh-vu",new Date().toISOString())}catch(e){}}
async function openAdhesions(f){const sh=document.getElementById("sheet");if(sh.classList.contains("open"))closeSheet();window._dmF=f==="retard"?"retard":"";window._dmQ="";
  if(f==="todo"||f==="saisie")window._dmCol=f;if(tab==="demandes")render();else go("demandes");await adhCharger();if(tab==="demandes")render()}
async function openAdhesionsFiche(f){
  if(f)_adhFiltre=f;
  const {data,error}=await sb.from("adhesions").select("*").order("created_at",{ascending:false});
  if(error){console.error(error);toast(/does not exist|schema cache/i.test(error.message||"")?"Module adhésions pas encore installé":rlsMsg(error));return}
  DB.adhesions=data||[];
  try{localStorage.setItem("cap-adh-vu",new Date().toISOString())}catch(e){}
  const all=DB.adhesions;
  const F={todo:["À intégrer",a=>a.statut==="recue"||a.statut==="traitee"],saisie:["À saisir",a=>a.statut!=="rejetee"&&!a.saisie_proteine_le],retard:["En retard",adhEnRetard],all:["Toutes",a=>true],rejetee:["Rejetées",a=>a.statut==="rejetee"]};
  if(!F[_adhFiltre])_adhFiltre="todo";
  const list=all.filter(F[_adhFiltre][1]).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const chips=Object.entries(F).map(([k,[l,fn]])=>`<button class="chip ${_adhFiltre===k?"on":""}" onclick="openAdhesions('${k}')">${l}<em>${all.filter(fn).length}</em></button>`).join("");
  const rows=list.length?`<div class="rl">${list.map((a,i)=>{const g=adhGroupe(a),c=DB.clubs.find(x=>x.nom===g);return `<div class="rl-row" style="--vc:${c?villeColor(c.ville):"#8C8085"};--i:${i}"><button class="rl-h" onclick="adhDetail('${a.id}')">
      <span class="rl-emb sm">${esc(initiales(a.data.ent_nom||adhNom(a)))}</span>
      <span class="rl-t"><b>${esc(a.data.ent_nom||"—")}</b><small>${esc(adhNom(a))} · ${esc(g.replace(/^CAP\s+/,""))}</small></span>
      <span class="rl-ind"><span class="adh-age ${adhEnRetard(a)?"late":""}">${adhAge(a.created_at)}</span>${adhSuivi(a)}</span><span class="rl-chev">›</span></button></div>`}).join("")}</div>`
    :`<p class="fh-empty">${_adhFiltre==="todo"?"Rien à intégrer : tout est à jour ✓":"Aucune adhésion dans ce filtre."}</p>`;
  // repères chiffrés + répartition par groupe (hors rejetées)
  const vivantes=all.filter(a=>a.statut!=="rejetee");
  const parGroupe={};vivantes.forEach(a=>{const g=adhGroupe(a);parGroupe[g]=(parGroupe[g]||0)+1});
  const grp=Object.entries(parGroupe).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(1,...grp.map(x=>x[1]));
  const mois=vivantes.filter(a=>adhMoisCle(a.created_at)===adhMoisCle(new Date().toISOString())).length;
  const clubOpts=DB.clubs.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(c=>`<option value="${c.id}">${esc(c.nom)} · ${esc(c.ville)}</option>`).join("");
  document.getElementById("sheet-content").innerHTML=`
    ${ficheHead({ini:"📝",title:"Adhésions",sub:"Formulaires remplis par les futurs membres depuis leur téléphone."})}
    ${ficheKpis([[mois,"ce mois-ci"],[adhAIntegrer().length,"à intégrer",adhAIntegrer().length?"warn":""],[adhASaisir().length,"à saisir (national)",adhASaisir().length?"warn":""]])}
    <div class="filters">${chips}</div>
    ${rows}
    <div class="adh-legend"><span class="adh-steps"><i class="on"></i><i></i><i></i></span> reçue · intégrée au club · saisie dans le CRM national${all.some(adhEnRetard)?` — <b>en retard</b> : en attente depuis plus de ${ADH_DELAI_J} jours`:""}</div>
    ${grp.length?secHead("Par groupe",vivantes.length)+`<div class="rank">${grp.map(([g,n])=>`<div class="rank-row"><div class="rn">${esc(g.replace(/^CAP\s+/,""))}</div><div class="bar"><i style="width:${Math.round(n/mx*100)}%"></i></div><div class="rv">${n}</div></div>`).join("")}</div>`:""}
    <button class="btn ghost" style="margin-top:14px;width:100%" onclick="openClasseur()">📁 Classeur des PDF</button>
    ${readOnly()?"":`${secHead("Envoyer le lien")}
    <div class="field"><label>Club concerné (facultatif)</label><select id="adh-club"><option value="">— Sans club —</option>${clubOpts}</select></div>
    <div class="frow" style="display:flex;gap:8px"><button class="btn ghost" onclick="adhCopy()">Copier le lien</button><button class="btn" onclick="adhWhatsApp()">Envoyer par WhatsApp</button></div>
    <div class="sheet-actions" style="margin-top:14px"><button class="btn ghost" onclick="adhExportSaisie('csv')">Exporter pour saisie (${adhASaisir().length})</button><button class="btn ghost" style="flex:0 0 auto;width:auto" onclick="adhExportSaisie('json')" title="Fichier lu par le robot de saisie">JSON robot</button></div>`}
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Fermer</button></div>`;
  ficheOpen();
}

/* ---- Classeur des PDF : par mois de réception, puis par groupe, fichiers nommés
   « NOM Prénom - JJ-MM-AAAA - Groupe.pdf ». Les fichiers restent stockés sous leur id
   (le groupe n'est souvent connu qu'à l'intégration) : le nom lisible est appliqué à
   l'affichage et au téléchargement, il est donc toujours à jour. ---- */
const MOIS_FR=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
function adhGroupe(a){
  const mb=a.membre_id&&DB.membres.find(m=>m.id===a.membre_id);
  const c=mb?club(mb.clubId):(a.ref?club(a.ref):{});
  return c&&c.nom?c.nom:"Sans groupe";
}
function adhDateFr(iso){const d=new Date(iso);return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear()}
function adhMoisCle(iso){const d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function adhNomFichierPropre(t){return String(t||"").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim()}
function adhNomFichier(a){
  const nomPers=((a.data.m_nom||"").toUpperCase()+" "+(a.data.m_prenom||"")).trim()||"Sans nom";
  return adhNomFichierPropre(nomPers+" - "+adhDateFr(a.created_at)+" - "+adhGroupe(a)+(a.statut==="rejetee"?" (rejetée)":""))+".pdf";
}
/* Classeur : TOUTES les demandes reçues avec un PDF, rejetées comprises (trace complète, rien n'est
   jamais effacé : la base n'autorise aucune suppression d'adhésion ni de PDF). Chacun n'y voit que son
   périmètre (RLS cap_peut_voir_adhesion) : animateur = ses clubs, directeur = sa zone, national = tout. */
function adhClasseurListe(){return(DB.adhesions||[]).filter(a=>a.pdf_path)}
let _clsMode="groupe";
function adhPerimetre(){const r=SESSION&&SESSION.role;return r==="animateur"?"tes clubs":r==="directeur"?"ta zone":"tout le réseau"}
function clsLigne(a){return `<div class="rank-row"><span style="font-size:18px">📄</span><div class="rn" style="cursor:pointer" onclick="adhPdf('${a.id}')" title="${esc(adhNomFichier(a))}">${esc(((a.data.m_nom||"").toUpperCase()+" "+(a.data.m_prenom||"")).trim()||"Sans nom")}<small>${adhDateFr(a.created_at).replace(/-/g,"/")} · ${esc(a.data.ent_nom||"")} · ${a.statut==="rejetee"?'<b style="color:var(--muted)">Rejetée</b>':ADH_STATUTS[a.statut]}</small></div><button class="btn ghost mini" onclick="adhTelecharger('${a.id}')" aria-label="Télécharger">⬇</button></div>`}
function clsMoisTitre(m){const [y,mm]=m.split("-");return MOIS_FR[+mm-1]+" "+y}
function clsGrouper(liste,cle){const o={};liste.forEach(a=>{const k=cle(a);(o[k]=o[k]||[]).push(a)});return o}
async function openClasseur(mode){
  if(mode)_clsMode=mode;
  if(!DB.adhesions){await adhCharger();}
  const liste=adhClasseurListe();
  const triG=(x,y)=>(x==="Sans groupe")-(y==="Sans groupe")||x.localeCompare(y);
  let html="";
  if(!liste.length)html=`<div class="empty"><b>Aucun PDF pour l'instant</b>Les formulaires reçus apparaîtront ici.</div>`;
  else if(_clsMode==="groupe"){
    const pg=clsGrouper(liste,adhGroupe);
    html=Object.keys(pg).sort(triG).map((g,i)=>{const l=pg[g],pm=clsGrouper(l,a=>adhMoisCle(a.created_at)),c=DB.clubs.find(x=>x.nom===g);
      return `<details class="cls-dos" style="--vc:${c?villeColor(c.ville):"#8C8085"}" ${i===0?"open":""}><summary><span class="rl-emb sm">${esc(initiales(g.replace(/^CAP\s+/,"")))}</span><span class="rl-t"><b>${esc(g.replace(/^CAP\s+/,""))}</b><small>${l.length} PDF${c?" · "+esc(c.ville):""}</small></span><button class="btn ghost mini" onclick="event.preventDefault();adhZipGroupe(${JSON.stringify(g).replace(/"/g,"&quot;")})">⬇ .zip</button></summary>
        ${Object.keys(pm).sort().reverse().map(m=>`<div class="cls-mois">${clsMoisTitre(m)} <em>${pm[m].length}</em></div><div class="rank">${pm[m].sort((x,y)=>y.created_at.localeCompare(x.created_at)).map(clsLigne).join("")}</div>`).join("")}</details>`}).join("");
  }else{
    const pm=clsGrouper(liste,a=>adhMoisCle(a.created_at));
    html=Object.keys(pm).sort().reverse().map(m=>{const pg=clsGrouper(pm[m],adhGroupe);
      return `<div class="cls-mtitre">${clsMoisTitre(m)} <em>${pm[m].length} PDF</em><button class="btn ghost mini" onclick="adhZipMois('${m}')">⬇ .zip</button></div>
        ${Object.keys(pg).sort(triG).map(g=>`<div class="cls-mois">📂 ${esc(g)} <em>${pg[g].length}</em></div><div class="rank">${pg[g].map(clsLigne).join("")}</div>`).join("")}`}).join("");
  }
  document.getElementById("sheet-content").innerHTML=`
    ${ficheHead({ini:"📁",title:"Classeur des PDF",sub:`Toutes les demandes reçues, rejetées comprises · ${adhPerimetre()}`})}
    <div class="seg-sc" style="margin-top:0"><span class="knob" style="transform:translateX(${_clsMode==="mois"?"100%":"0"})"></span><button class="${_clsMode==="groupe"?"on":""}" onclick="openClasseur('groupe')">Par groupe</button><button class="${_clsMode==="mois"?"on":""}" onclick="openClasseur('mois')">Par mois</button></div>
    ${html}
    <p class="fh-note" style="margin-top:12px">Fichiers nommés « NOM Prénom - date - groupe ». Rien n'est jamais effacé : chaque demande reçue reste consultable.</p>
    <div class="sheet-actions"><button class="btn ghost" onclick="openAdhesions()">← Adhésions</button></div>`;
  ficheOpen();
}
async function adhBlob(a){
  const {data,error}=await sb.storage.from("adhesions").createSignedUrl(a.pdf_path,600);
  if(error||!data)throw new Error("PDF introuvable");
  const r=await fetch(data.signedUrl);if(!r.ok)throw new Error("PDF introuvable");
  return await adhTamponner(await r.blob(),a);
}
function adhSauver(blob,nom){const u=URL.createObjectURL(blob);const l=Object.assign(document.createElement("a"),{href:u,download:nom});document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function adhTelecharger(id){
  const a=DB.adhesions.find(x=>x.id===id);
  try{adhSauver(await adhBlob(a),adhNomFichier(a))}catch(e){toast(e.message)}
}
async function adhZip(liste,racine,dossier){
  if(!liste.length)return;
  toast("Préparation du ZIP ("+liste.length+" PDF)…");
  try{
    if(!window.JSZip)await new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";sc.onload=ok;sc.onerror=()=>ko(new Error("Module ZIP indisponible"));document.head.appendChild(sc)});
    const zip=new JSZip();const vus=new Set();let manquants=0;
    for(const a of liste){
      let chemin=racine+"/"+adhNomFichierPropre(dossier(a))+"/"+adhNomFichier(a),k=2;
      while(vus.has(chemin)){chemin=chemin.replace(/( \(\d+\))?\.pdf$/," ("+(k++)+").pdf")}vus.add(chemin);
      try{zip.file(chemin,await adhBlob(a))}catch(e){manquants++}
    }
    adhSauver(await zip.generateAsync({type:"blob"}),racine+".zip");
    toast(manquants?(liste.length-manquants)+" PDF dans le ZIP, "+manquants+" introuvable(s)":"ZIP prêt : "+liste.length+" PDF");
  }catch(e){toast(e.message)}
}
function adhZipMois(m){const [y,mm]=m.split("-");return adhZip(adhClasseurListe().filter(a=>adhMoisCle(a.created_at)===m),"Adhesions "+y+"-"+mm+" ("+MOIS_FR[+mm-1]+")",adhGroupe)}
function adhZipGroupe(g){return adhZip(adhClasseurListe().filter(a=>adhGroupe(a)===g),"Adhesions "+adhNomFichierPropre(g),a=>{const m=adhMoisCle(a.created_at);return m+" ("+MOIS_FR[+m.split("-")[1]-1]+")"})}
async function adhPdf(id){
  const a=DB.adhesions.find(x=>x.id===id);
  const w=window.open("","_blank"); // ouvert AVANT l'attente réseau, sinon le téléphone bloque la fenêtre
  let b;try{b=await adhBlob(a)}catch(e){if(w)w.close();toast("PDF introuvable");return}
  const u=URL.createObjectURL(b);setTimeout(()=>URL.revokeObjectURL(u),600000);
  if(w)w.location=u;else location.href=u;
}

/* Les menus courts deviennent des pastilles : le <select> reste (caché) et porte la valeur, rien ne change à l'enregistrement. */
function pillify(root){
  if(!root)return;
  root.querySelectorAll("select[data-pills]").forEach(sel=>{
    if(sel.dataset.pilled)return;sel.dataset.pilled="1";sel.classList.add("hidden");
    const box=document.createElement("div");box.className="pills";box.setAttribute("role","radiogroup");
    [...sel.options].forEach(o=>{const b=document.createElement("button");b.type="button";b.className="pill"+(o.value===sel.value?" on":"");
      b.textContent=o.text;b.setAttribute("role","radio");b.setAttribute("aria-checked",o.value===sel.value);
      b.onclick=()=>{sel.value=o.value;box.querySelectorAll(".pill").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-checked",on)});sel.dispatchEvent(new Event("change",{bubbles:true}))};
      box.appendChild(b)});
    sel.after(box);
  });
}

function agendaSemaine(all){
  const cnt={};all.forEach(m=>{if(m.statut!=="annulee")cnt[m.date]=(cnt[m.date]||0)+1});
  let h="";for(let i=0;i<14;i++){const d=new Date(TODAY);d.setDate(d.getDate()+i);const iso=isoJour(d),n=cnt[iso]||0,on=filter==="d:"+iso;
    h+=`<button class="day ${i===0?"today":""} ${on?"on":""}" onclick="filter='${on?"all":"d:"+iso}';render()" aria-pressed="${on}" aria-label="${jourLong(iso)}, ${n} réunion${n>1?"s":""}"><small>${i===0?"auj.":JOURS[d.getDay()]}</small><b>${d.getDate()}</b><span class="dots">${"<i></i>".repeat(Math.min(n,3))}</span></button>`}
  return `<div class="week">${h}</div>`;
}
const GP_COUL=["#B0122E","#B8862A","#2E7D5B","#3A5DA8","#7A4DA8","#1FA0A0"];

function dashCourbe(sc){
  const ids=new Set(_dashScope[sc]||[]);const mb=DB.membres.filter(m=>ids.has(m.clubId));
  if(!mb.length)return"";
  const now=new Date(),mois=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i+1,1);mois.push({fin:isoJour(d),lab:MOIS[(now.getMonth()-i+12)%12]})}

  const max=Math.max(1,...pts),min=Math.min(...pts),W=300,H=64,rg=Math.max(1,max-min);

    <div class="months">${mois.map(x=>`<span>${x.lab}</span>`).join("")}</div></div>`;

function dashFete(){

/* v0.29.1 — toutes les notifications (annonces, célébrations) s'empilent en bas à droite, la plus récente en bas. */
function notifPile(){let p=document.getElementById("notifs");if(!p){p=document.createElement("div");p.id="notifs";p.setAttribute("aria-live","polite");document.body.appendChild(p)}return p}
function celebrer(ico,titre,gros,lien,act){
  document.querySelectorAll(".celeb").forEach(x=>x.remove());
  const d=document.createElement("div");d.className="celeb";d.setAttribute("role","alertdialog");d.setAttribute("aria-label",titre);
  d.innerHTML=`<div class="celeb-c"><span class="celeb-s">${ico}</span><b>${esc(titre)}</b>${gros?`<span class="celeb-g">${esc(gros)}</span>`:""}${act?`<button class="btn mini">${esc(lien||"Voir")} ›</button>`:""}</div>`;
  const fin=()=>{d.classList.add("out");setTimeout(()=>d.remove(),350)};
  d.onclick=()=>{fin();if(act)act()};
  notifPile().appendChild(d);pluieConfettis();setTimeout(fin,6500);
}
/* H — Ce qui arrive de l'extérieur (adhésion, recommandation…) descend du haut ; un clic ouvre la page concernée. */
function annonce(ico,titre,sous,act){
  const d=document.createElement("button");d.type="button";d.className="annonce";
  d.innerHTML=`<span class="an-ic">${ico}</span><span class="an-t"><b>${esc(titre)}</b>${sous?`<small>${esc(sous)}</small>`:""}</span>${act?'<span class="an-go" aria-hidden="true">›</span>':""}`;
  const fin=()=>{d.classList.add("out");setTimeout(()=>d.remove(),350)};
  d.onclick=()=>{fin();if(act)act()};
  notifPile().appendChild(d);setTimeout(fin,6500);
}

async function saveBilan(){

/* ---------- 2. Carte du Maroc (schéma : côte atlantique + villes, sans tuiles externes) ---------- */
const VILLE_GPS={"Rabat":[34.02,-6.84],"Salé":[34.05,-6.80],"Kenitra":[34.26,-6.58],"Casablanca":[33.57,-7.59],"Dar Bouazza":[33.52,-7.81],"Bouskoura":[33.45,-7.65],"Marrakech":[31.63,-8.0],"Tanger":[35.76,-5.83],"Fès":[34.03,-5.0],"Meknès":[33.9,-5.55],"Agadir":[30.42,-9.6],"Oujda":[34.68,-1.91],"Tétouan":[35.57,-5.37],"El Jadida":[33.25,-8.5],"Mohammedia":[33.69,-7.38],"Temara":[33.93,-6.91]};
const COTE=[[35.79,-5.92],[35.2,-6.15],[34.68,-6.35],[34.26,-6.62],[34.02,-6.86],[33.69,-7.4],[33.6,-7.64],[33.25,-8.5],[32.6,-9.0],[32.3,-9.24],[31.5,-9.77],[30.9,-9.84],[30.42,-9.62],[29.9,-9.9],[28.5,-11.1]];
const TON_COUL={urgent:"#B0122E",todo:"#B07A12",ok:"#2E7D5B"};
function carteSvg(opts){
  opts=opts||{};const W=360,HMAX=opts.hmax||380,cl=0.84;
  const villes=[...new Set(DB.clubs.map(c=>c.ville))].filter(v=>VILLE_GPS[v]);
  if(!villes.length)return"";
  const la=villes.map(v=>VILLE_GPS[v][0]),lo=villes.map(v=>VILLE_GPS[v][1]);
  let la0=Math.min(...la)-.45,la1=Math.max(...la)+.45,lo0=Math.min(...lo)-.6,lo1=Math.max(...lo)+.6;
  let k=W/((lo1-lo0)*cl),H=(la1-la0)*k;
  if(H>HMAX){k=HMAX/(la1-la0);H=HMAX;const w=W/(k*cl),mid=(lo0+lo1)/2;lo0=mid-w/2;lo1=mid+w/2}
  if(H<220){const h2=220/k,mid=(la0+la1)/2;la0=mid-h2/2;la1=mid+h2/2;H=220}
  const P=(a,o)=>[(o-lo0)*k*cl,(la1-a)*k];
  const land="M"+COTE.map(([a,o])=>P(a,o).map(n=>n.toFixed(1)).join(",")).join(" L")+` L${P(27,-11.1).map(n=>n.toFixed(1))} L${P(27,5).map(n=>n.toFixed(1))} L${P(37,5).map(n=>n.toFixed(1))} L${P(37,-5.92).map(n=>n.toFixed(1))} Z`;
  const rang={urgent:0,todo:1,ok:2};
  const nodes=villes.map(v=>{const cs=DB.clubs.filter(c=>c.ville===v);const t=cs.map(clubTone).sort((a,b)=>rang[a]-rang[b])[0];const[x,y]=P(...VILLE_GPS[v]);return{v,n:cs.length,t,x,y,r:Math.min(22,7+cs.length*2.4)}});
  for(let it=0;it<120;it++)for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;const need=a.r+b.r+(Math.abs(dy/d)>.5?30:22);if(d<need){const p=(need-d)/2;dx/=d;dy/=d;a.x-=dx*p;a.y-=dy*p;b.x+=dx*p;b.y+=dy*p}}
  nodes.forEach(n=>{n.x=Math.max(n.r+2,Math.min(W-n.r-2,n.x));n.y=Math.max(n.r+2,Math.min(H-n.r-14,n.y))});
  const col=n=>TON_COUL[n.t]||"#8C8085";
  const g=nodes.map(n=>`<g class="city" data-v="${esc(n.v)}" tabindex="0" role="button" aria-label="${esc(n.v)} : ${n.n} club${n.n>1?"s":""}">${opts.calme?"":`<circle class="pulse" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.r}" fill="${col(n)}"/>`}<circle class="b" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.r}" fill="${col(n)}" stroke="${opts.dark?"#3E0710":"var(--card)"}" stroke-width="2"/><text x="${n.x.toFixed(1)}" y="${(n.y+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Inter,sans-serif">${n.n}</text><text x="${n.x.toFixed(1)}" y="${(n.y+n.r+12).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${opts.dark?"rgba(255,255,255,.8)":"var(--ink)"}" font-family="Inter,sans-serif">${esc(n.v)}</text></g>`).join("");
  return `<svg viewBox="0 0 ${W} ${H.toFixed(0)}" role="img" aria-label="Carte des clubs par ville"><path d="${land}" fill="${opts.dark?"rgba(255,255,255,.07)":"var(--land)"}" stroke="${opts.dark?"rgba(255,255,255,.18)":"var(--line)"}" stroke-width="1.5"/><text x="12" y="${(H-12).toFixed(0)}" font-size="10.5" font-style="italic" fill="${opts.dark?"rgba(255,255,255,.5)":"var(--muted)"}" font-family="Inter,sans-serif">Océan Atlantique</text>${g}</svg>`;
}
function openCarte(ville){
  const villes=[...new Set(DB.clubs.map(c=>c.ville))],hors=villes.filter(v=>!VILLE_GPS[v]);
  const v=ville||villes.slice().sort((a,b)=>DB.clubs.filter(c=>c.ville===b).length-DB.clubs.filter(c=>c.ville===a).length)[0];
  const cs=DB.clubs.filter(c=>c.ville===v).sort((a,b)=>a.nom.localeCompare(b.nom));
  document.getElementById("sheet-content").innerHTML=`
    <h3>Le réseau sur la carte</h3><div class="sheet-sub">${DB.clubs.length} clubs dans ${villes.length} villes · touche une ville</div>

    const f=await doc.embedFont(StandardFonts.Helvetica),fb=await doc.embedFont(StandardFonts.HelveticaBold);

    const lignes=[["Groupe : ",g==="Sans groupe"?"à attribuer":g],["Responsable du groupe : ",r||"à désigner"]];
    const {width,height}=pg.getSize(),droite=width*494/540;let y=height*668/780;
    for(const [k,v] of lignes){
      const kv=pdfTexteSur(k),vv=pdfTexteSur(v);let tv=9;while(tv>6&&f.widthOfTextAtSize(kv,8)+fb.widthOfTextAtSize(vv,tv)>230)tv-=.5;
      const wk=f.widthOfTextAtSize(kv,8),wv=fb.widthOfTextAtSize(vv,tv),x=droite-wk-wv;
      pg.drawText(kv,{x,y,size:8,font:f,color:rgb(.42,.38,.4)});
      pg.drawText(vv,{x:x+wk,y,size:tv,font:fb,color:rgb(.69,.07,.18)});y-=12.5;
    }
    return new Blob([await doc.save()],{type:"application/pdf"});
  }catch(e){console.warn("Tampon PDF :",e);return blob}
}

/* ============================================================
   FIL D'ARIANE
   1. Fiches (panneau / feuille) : chaque fiche ouverte DEPUIS une fiche s'empile (Carte › Club › Membre).
      Ouverte depuis la page, elle repart d'un fil neuf. Rouvrir une fiche déjà dans le fil y remonte (pas de boucle).
      Les ouvreurs sont enveloppés une fois pour toutes (FIL_FICHES), sans toucher à leur code.
   2. Pages : passer d'un onglet à l'autre par un lien (« Voir les clubs à traiter ») s'empile ; le menu repart à zéro.
   ============================================================ */
let _fil=[],_filClicFiche=false,_filPage=[],_filMenu=false,_filPageRejeu=false;
document.addEventListener("click",e=>{const t=e.target&&e.target.closest?e.target:null;_filClicFiche=!!(t&&t.closest("#sheet"));_filMenu=!!(t&&t.closest("#nav"))},true);
const FIL_FICHES=["openCR","changerJour","openRythme","openClub","memberSheet","openMeeting","openLieu","openAnim","openCarte","dashDrill","adhDetail","openBilan","openZones","openLancements","openAdhesions","clubForm","openQuiConnecte","openAccounts","accountEdit","accountForm","openParametres","openAide","openNotifs","openChangelog","openRendement","openMyPassword","openRapport","openClasseur"];
function filTitreCourant(){const h=document.querySelector("#sheet-content h3");return h?h.textContent.replace(/\s+\d+\s*$/,"").replace(/\s*\(\d+\)\s*$/,"").trim():""}
function filNoter(n,a){
  const w=document.getElementById("sheet"),ouverte=w&&w.classList.contains("open");
  if(!ouverte||!_filClicFiche)_fil=[];
  else if(_fil.length)_fil[_fil.length-1].t=filTitreCourant()||_fil[_fil.length-1].t;
  let k;try{k=n+"|"+JSON.stringify(a)}catch(e){k=n+"|"+Math.random()}
  const i=_fil.findIndex(x=>x.k===k);if(i>=0)_fil=_fil.slice(0,i);
  _fil.push({k,n,a,t:""});_filClicFiche=false;
}
FIL_FICHES.forEach(n=>{const f=window[n];if(typeof f!=="function")return;window[n]=function(...a){filNoter(n,a);return f.apply(this,a)}});
function filFicheRendu(){
  const el=document.getElementById("fil-fiche");if(!el)return;
  if(_fil.length)_fil[_fil.length-1].t=filTitreCourant()||_fil[_fil.length-1].t||"Fiche";
  if(_fil.length<2){el.innerHTML="";el.classList.remove("on");return}
  el.classList.add("on");
  el.innerHTML=`<button class="fil-ret" onclick="filAller(${_fil.length-2})" aria-label="Revenir à ${esc(_fil[_fil.length-2].t)}">←</button><span class="fil-l">${_fil.map((x,i)=>i<_fil.length-1?`<button class="fil-c" onclick="filAller(${i})">${esc(x.t||"Fiche")}</button><span class="fil-s">›</span>`:`<b>${esc(x.t||"")}</b>`).join("")}</span>`;
}
function filAller(i){const e=_fil[i];if(!e)return;_fil=_fil.slice(0,i);_filClicFiche=true;window[e.n](...e.a)}
const FIL_ONGLETS={dash:"Synthèse",agenda:"Agenda",reunions:"Mes réunions",clubs:"Clubs",membres:"Membres",lieux:"Lieux",team:"Équipe"};
const FIL_FILTRES={todo:"à traiter",actif:"actifs",creation:"en création",up:"à venir",tbd:"lieu à définir",SI:"sessions d'info",RL:"lancements"};
function filPageNoter(t){
  if(_filPageRejeu){_filPageRejeu=false;return}
  if(_filMenu||!_filPage.length){_filPage=[{tab:t,filter:"all"}];_filMenu=false;return}
  const i=_filPage.findIndex(x=>x.tab===t);if(i>=0)_filPage=_filPage.slice(0,i);
  _filPage.push({tab:t,filter:"all"});
}
function filPageLib(x){return (FIL_ONGLETS[x.tab]||x.tab)+(x.filter&&x.filter!=="all"?" · "+(x.filter.startsWith("v:")?x.filter.slice(2):FIL_FILTRES[x.filter]||x.filter):"")}
function filPageRendu(v){
  if(!_filPage.length)_filPage=[{tab,filter}];
  const top=_filPage[_filPage.length-1];if(top.tab===tab)top.filter=filter;
  if(_filPage.length<2)return;
  const pg=v.querySelector(".page");if(!pg)return;
  const n=document.createElement("nav");n.className="fil fil-page on";n.setAttribute("aria-label","Fil d'Ariane");
  n.innerHTML=`<button class="fil-ret" onclick="filPageAller(${_filPage.length-2})" aria-label="Revenir à ${esc(filPageLib(_filPage[_filPage.length-2]))}">←</button><span class="fil-l">${_filPage.map((x,i)=>i<_filPage.length-1?`<button class="fil-c" onclick="filPageAller(${i})">${esc(filPageLib(x))}</button><span class="fil-s">›</span>`:`<b>${esc(filPageLib(x))}</b>`).join("")}</span>`;
  pg.prepend(n);
}
function filPageAller(i){const e=_filPage[i];if(!e)return;_filPage=_filPage.slice(0,i+1);_filPageRejeu=true;go(e.tab);if(e.filter!=="all"){filter=e.filter;render()}}

/* ============================================================
   DATE ET HEURE — en haut de l'écran, à la minute.
   ============================================================ */
let _horT=null;
function horlogeTxt(){const d=new Date(),h=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return{h:h.replace(":",'<i class="h-col">:</i>'),d:d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase()),
    court:d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}).replace(/^./,c=>c.toUpperCase()),hs:h}}
function horlogeMaj(){
  const x=horlogeTxt(),el=document.getElementById("tb-clock");
  if(el){el.innerHTML=`<span class="tc-d">${x.court}</span><b>${x.hs}</b>`;el.title=x.d}
  document.querySelectorAll('[data-hor="t"]').forEach(e=>{if(e.dataset.v!==x.hs){e.dataset.v=x.hs;e.innerHTML=x.h;e.classList.remove("tick");void e.offsetWidth;e.classList.add("tick")}});
  document.querySelectorAll('[data-hor="d"]').forEach(e=>e.textContent=x.d);
}
function horlogeDemarrer(){horlogeMaj();clearTimeout(_horT);const suite=()=>{horlogeMaj();_horT=setTimeout(suite,60000-Date.now()%60000+50)};_horT=setTimeout(suite,60000-Date.now()%60000+50)}
</script>
</body>
