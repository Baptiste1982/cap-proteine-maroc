  }
  html+=dashFunnel(per,sc)+dashByAnim(per)+dashRelancer(per);
  return html+`<div style="height:8px"></div></div>`;
}

/* ============================================================
   RENDEMENT — module privé (superadmin) : commissions sur adhésions
   ============================================================ */
const RD_KEY="cap-rendement-params";
let _rdData=[];
function fmtMAD(n){return Math.round(n||0).toLocaleString("fr-FR").replace(/ /g," ")+" MAD"}
function rdParams(){const def={membership:9000,tauxDirect:20,tauxReseau:10,objectif:500000,membresMin:10,membresMax:15};try{return{...def,...JSON.parse(localStorage.getItem(RD_KEY)||"{}")}}catch(e){return def}}
function rdSave(p){try{localStorage.setItem(RD_KEY,JSON.stringify(p))}catch(e){}}
function rdRate(c){if(c.animId&&c.animId===SESSION.animId)return"direct";if(REGION_RSK.includes(c.ville))return"reseau";return null}
function rdRevAt(g){const p=rdParams();let rev=0;_rdData.forEach(x=>rev+=g*p.membership*x.rate/100);return rev}
function rdSim(g){
  const p=rdParams();const rev=rdRevAt(g);
  const pct=Math.min(100,Math.round(rev/(p.objectif||1)*100));
  document.getElementById("rd-sim-g").textContent=g;
  document.getElementById("rd-sim-tot").textContent=(g*_rdData.length);
  document.getElementById("rd-sim-rev").textContent=fmtMAD(rev);
  document.getElementById("rd-sim-pct").textContent=pct+"% de l'objectif";
  document.getElementById("rd-sim-bar").style.width=pct+"%";
}
function rdEdit(){
  const g=x=>parseFloat(document.getElementById(x).value)||0;
  rdSave({membership:g("rd-membership"),objectif:g("rd-objectif"),tauxDirect:g("rd-td"),tauxReseau:g("rd-tr"),membresMin:g("rd-mmin"),membresMax:g("rd-mmax")});
  toast("Paramètres enregistrés");openRendement();
}
function openRendement(){
  if(SESSION.role!=="superadmin")return;
  const p=rdParams();
  _rdData=DB.clubs.map(c=>{
    const type=rdRate(c);if(!type)return null;
    const rate=type==="direct"?p.tauxDirect:p.tauxReseau;
    const membres=DB.membres.filter(m=>m.clubId===c.id).length;
    return{nom:c.nom,ville:c.ville,type,rate,membres,revActuel:membres*p.membership*rate/100};
  }).filter(Boolean).sort((a,b)=>(b.type==="direct")-(a.type==="direct")||b.rate-a.rate||a.nom.localeCompare(b.nom));
  const nbClubs=_rdData.length;
  const nbDirect=_rdData.filter(x=>x.type==="direct").length;
  const nbReseau=nbClubs-nbDirect;
  const membresReels=_rdData.reduce((s,x)=>s+x.membres,0);
  const totActuel=_rdData.reduce((s,x)=>s+x.revActuel,0);
  const pctA=Math.min(100,Math.round(totActuel/(p.objectif||1)*100));
  const unitPerG=_rdData.reduce((s,x)=>s+p.membership*x.rate/100,0); // revenu par +1 membre/groupe
  const revMin=unitPerG*p.membresMin, revMax=unitPerG*p.membresMax;
  const gObj=unitPerG?Math.ceil(p.objectif/unitPerG):0; // membres/groupe pour l'objectif
  const gStart=Math.round((p.membresMin+p.membresMax)/2);
  const revStart=unitPerG*gStart, pctStart=Math.min(100,Math.round(revStart/(p.objectif||1)*100));
  const rows=_rdData.map(x=>`<div class="rank-row"><span class="hdot ${x.type==="direct"?"bad":"warn"}"></span><div class="rn">${esc(x.nom.replace("CAP ",""))}<small>${esc(x.ville)} · ${x.type==="direct"?"Direct "+x.rate+"%":"Réseau "+x.rate+"%"} · ${x.membres} membre${x.membres>1?"s":""}</small></div><div class="rv" style="font-size:12.5px">${fmtMAD(p.membership*p.membresMax*x.rate/100)}</div></div>`).join("");
  document.getElementById("sheet-content").innerHTML=`
    <h3>Mon rendement</h3><div class="sheet-sub">Commissions sur les adhésions · zone Rabat·Salé·Kénitra.</div>

    <div class="rd-sec">Suivi réel de la région</div>
    <div class="rd-obj"><div class="h"><span>Objectif annuel · ${fmtMAD(p.objectif)}</span><b>${pctA}%</b></div>
      <div class="gauge"><i style="width:${Math.max(pctA,2)}%"></i></div><small>Réalisé à ce jour : ${fmtMAD(totActuel)}</small></div>
    <div class="rd-g" style="margin-top:8px">
      <div class="rd-k" style="--i:0"><div class="n">${nbClubs}</div><small>Clubs · ${nbDirect} direct${nbDirect>1?"s":""} / ${nbReseau} réseau</small></div>
      <div class="rd-k" style="--i:1"><div class="n">${membresReels}</div><small>Membres réels</small></div>
      <div class="rd-k" style="--i:2"><div class="n" style="font-size:16px">${fmtMAD(totActuel)}</div><small>Revenu réalisé</small></div>
      <div class="rd-k" style="--i:3"><div class="n" style="font-size:16px">${fmtMAD(unitPerG)}</div><small>Par membre ajouté dans chaque groupe</small></div>
    </div>

async function saveMeeting(id){
  const g=x=>document.getElementById(x).value;
  const clubId=g("f-club"),date=g("f-date");if(!clubId||!date){toast("Club et date obligatoires");return}
  const row={type:g("f-type"),club_id:clubId,date,heure:g("f-heure")||null,lieu_id:g("f-lieu")||null,animateur_id:g("f-anim")||null,statut:g("f-statut")};
  if(id){
    const {error}=await sb.from("reunions").update(row).eq("id",id);
    if(error){toast(rlsMsg(error));return}
    const m=DB.reunions.find(x=>x.id===id);
    Object.assign(m,{type:row.type,clubId:row.club_id,date:row.date,heure:row.heure||"",lieuId:row.lieu_id,animId:row.animateur_id,statut:row.statut});
    toast("Réunion mise à jour");
  }else{
    const {data,error}=await sb.from("reunions").insert(row).select().single();
    if(error){toast(rlsMsg(error));return}
    DB.reunions.push(mapReunion(data));toast("Réunion créée");
  }
  await okPuis();closeSheet();render();
}
async function delMeeting(id){
  const {error}=await sb.from("reunions").delete().eq("id",id);
  if(error){toast(rlsMsg(error));return}
  DB.reunions=DB.reunions.filter(x=>x.id!==id);closeSheet();render();toast("Réunion supprimée");
}
async function setReunionStatut(id,s){
  const {error}=await sb.from("reunions").update({statut:s}).eq("id",id);
  if(error){toast(rlsMsg(error));return}
  DB.reunions.find(x=>x.id===id).statut=s;render();toast("Statut : "+STATUTS[s]);
}

  const gg=DB.reunions.find(x=>x.id===mid).guests[i];

  if(error){toast(rlsMsg(error));return}

async function convertGuest(mid,i){
  const m=DB.reunions.find(x=>x.id===mid);const g=m.guests[i];
  const already=DB.membres.some(x=>x.clubId===m.clubId&&x.nom.toLowerCase()===g.nom.toLowerCase());
  if(already){toast(g.nom+" est déjà membre de ce club");return}
  const nextNum=(DB.membres.filter(x=>x.clubId===m.clubId).reduce((a,b)=>Math.max(a,b.num||0),0))+1;
  const {data,error}=await sb.from("membres").insert({club_id:m.clubId,num:nextNum,nom:g.nom,commentaires:"Ancien invité"+(g.par?" (invité par "+g.par+")":"")}).select().single();
  if(error){toast(rlsMsg(error));return}
  DB.membres.push(mapMembre(data));
  await sb.from("invites").update({statut:"Membre"}).eq("id",g._id);g.statut="Membre";
  toast(g.nom+" ajouté aux membres du club");meetingDetail(m,true);
}

function handlePhoto(e){
  const file=e.target.files[0];if(!file)return;
  const img=new Image();const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    const max=1000;let{width:w,height:h}=img;if(w>max||h>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
    _photoBuffer=cv.toDataURL("image/jpeg",0.72);
    const p=document.getElementById("l-photo-prev");p.src=_photoBuffer;p.classList.remove("hidden");
  };img.src=rd.result;};rd.readAsDataURL(file);
}

async function saveMembre(clubId,id){
  const nom=document.getElementById("m-nom").value.trim();if(!nom){toast("Nom requis");return}
  const chk=k=>document.getElementById("m-"+k).checked;
  const spec=document.getElementById("m-specialite").value.trim();
  const dupSpec=spec&&DB.membres.some(m=>m.clubId===clubId&&m.id!==id&&(m.specialite||"").toLowerCase()===spec.toLowerCase());
  const row={club_id:clubId,nom,specialite:document.getElementById("m-specialite").value.trim(),
    formulaire:chk("formulaire"),contrat:chk("contrat"),facture:chk("facture"),paiement:chk("paiement"),
    reorientation:document.getElementById("m-reorientation").value.trim(),commentaires:document.getElementById("m-commentaires").value.trim()};
  if(id){
    const {error}=await sb.from("membres").update(row).eq("id",id);
    if(error){toast(rlsMsg(error));return}
    Object.assign(DB.membres.find(x=>x.id===id),mapMembre({id,...row}));toast("Membre mis à jour");
  }else{
    const nextNum=(DB.membres.filter(x=>x.clubId===clubId).reduce((a,b)=>Math.max(a,b.num||0),0))+1;
    const {data,error}=await sb.from("membres").insert({...row,num:nextNum}).select().single();

  openClub(clubId);
  if(dupSpec)setTimeout(()=>toast("⚠️ Spécialité « "+spec+" » déjà présente dans ce club"),1400);

function adhLink(clubId){const u=new URL("adhesion.html",location.href);if(clubId)u.searchParams.set("ref",clubId);return u.toString()}
function adhNom(a){return((a.data.m_prenom||"")+" "+(a.data.m_nom||"")).trim()||"—"}
function adhDate(iso){const d=new Date(iso);return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function adhNouvelles(){return(DB.adhesions||[]).filter(a=>a.statut==="recue").length}
/* ── v0.11 : suivi des adhésions ──
   Une adhésion avance en 3 temps : reçue → intégrée au club → saisie dans le CRM national.
   « En retard » = en attente depuis plus de ADH_DELAI_J jours (à traiter ou à saisir). */
const ADH_DELAI_J=2;
function adhJours(iso){return Math.floor((Date.now()-new Date(iso).getTime())/864e5)}
function adhAge(iso){const j=adhJours(iso);return j<=0?"aujourd'hui":j===1?"hier":"il y a "+j+" j"}
function adhEtape(a){if(a.statut==="rejetee")return-1;return a.saisie_proteine_le?3:a.statut==="integree"?2:1}
function adhEnRetard(a){const e=adhEtape(a);return(e===1||e===2)&&adhJours(a.created_at)>ADH_DELAI_J}
function adhSuivi(a){const e=adhEtape(a);if(e<0)return `<span class="rl-fact">Rejetée</span>`;
  return `<span class="adh-steps" title="Reçue → intégrée au club → saisie dans le CRM national">${[1,2,3].map(k=>`<i class="${k<=e?"on":""}"></i>`).join("")}</span>`}
function adhAIntegrer(){return(DB.adhesions||[]).filter(a=>a.statut==="recue"||a.statut==="traitee")}
let _adhFiltre="todo";
async function openAdhesions(f){
  if(f)_adhFiltre=f;
  const {data,error}=await sb.from("adhesions").select("*").order("created_at",{ascending:false});
  if(error){console.error(error);toast(/does not exist|schema cache/i.test(error.message||"")?"Module adhésions pas encore installé":rlsMsg(error));return}
  DB.adhesions=data||[];
  try{localStorage.setItem("cap-adh-vu",new Date().toISOString())}catch(e){}
  const all=DB.adhesions;
  const F={todo:["À intégrer",a=>a.statut==="recue"||a.statut==="traitee"],saisie:["À saisir",a=>a.statut!=="rejetee"&&!a.saisie_proteine_le],retard:["En retard",adhEnRetard],all:["Toutes",a=>true],rejetee:["Rejetées",a=>a.statut==="rejetee"]};
  if(!F[_adhFiltre])_adhFiltre="todo";
  const list=all.filter(F[_adhFiltre][1]).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const chips=Object.entries(F).map(([k,[l,fn]])=>`<button class="chip ${_adhFiltre===k?"on":""}" onclick="openAdhesions('${k}')">${l}<em>${all.filter(fn).length}</em></button>`).join("");
  const rows=list.length?`<div class="rl">${list.map((a,i)=>{const g=adhGroupe(a),c=DB.clubs.find(x=>x.nom===g);return `<div class="rl-row" style="--vc:${c?villeColor(c.ville):"#8C8085"};--i:${i}"><button class="rl-h" onclick="adhDetail('${a.id}')">
      <span class="rl-emb sm">${esc(initiales(a.data.ent_nom||adhNom(a)))}</span>
      <span class="rl-t"><b>${esc(a.data.ent_nom||"—")}</b><small>${esc(adhNom(a))} · ${esc(g.replace(/^CAP\s+/,""))}</small></span>
      <span class="rl-ind"><span class="adh-age ${adhEnRetard(a)?"late":""}">${adhAge(a.created_at)}</span>${adhSuivi(a)}</span><span class="rl-chev">›</span></button></div>`}).join("")}</div>`
    :`<p class="fh-empty">${_adhFiltre==="todo"?"Rien à intégrer : tout est à jour ✓":"Aucune adhésion dans ce filtre."}</p>`;
  // repères chiffrés + répartition par groupe (hors rejetées)
  const vivantes=all.filter(a=>a.statut!=="rejetee");
  const parGroupe={};vivantes.forEach(a=>{const g=adhGroupe(a);parGroupe[g]=(parGroupe[g]||0)+1});
  const grp=Object.entries(parGroupe).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(1,...grp.map(x=>x[1]));
  const mois=vivantes.filter(a=>adhMoisCle(a.created_at)===adhMoisCle(new Date().toISOString())).length;
  const clubOpts=DB.clubs.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(c=>`<option value="${c.id}">${esc(c.nom)} · ${esc(c.ville)}</option>`).join("");
  document.getElementById("sheet-content").innerHTML=`
    ${ficheHead({ini:"📝",title:"Adhésions",sub:"Formulaires remplis par les futurs membres depuis leur téléphone."})}
    ${ficheKpis([[mois,"ce mois-ci"],[adhAIntegrer().length,"à intégrer",adhAIntegrer().length?"warn":""],[adhASaisir().length,"à saisir (national)",adhASaisir().length?"warn":""]])}
    <div class="filters">${chips}</div>
    ${rows}
    <div class="adh-legend"><span class="adh-steps"><i class="on"></i><i></i><i></i></span> reçue · intégrée au club · saisie dans le CRM national${all.some(adhEnRetard)?` — <b>en retard</b> : en attente depuis plus de ${ADH_DELAI_J} jours`:""}</div>
    ${grp.length?secHead("Par groupe",vivantes.length)+`<div class="rank">${grp.map(([g,n])=>`<div class="rank-row"><div class="rn">${esc(g.replace(/^CAP\s+/,""))}</div><div class="bar"><i style="width:${Math.round(n/mx*100)}%"></i></div><div class="rv">${n}</div></div>`).join("")}</div>`:""}
    <button class="btn ghost" style="margin-top:14px;width:100%" onclick="openClasseur()">📁 Classeur des PDF</button>
    ${readOnly()?"":`${secHead("Envoyer le lien")}
    <div class="field"><label>Club concerné (facultatif)</label><select id="adh-club"><option value="">— Sans club —</option>${clubOpts}</select></div>
    <div class="frow" style="display:flex;gap:8px"><button class="btn ghost" onclick="adhCopy()">Copier le lien</button><button class="btn" onclick="adhWhatsApp()">Envoyer par WhatsApp</button></div>
    <div class="sheet-actions" style="margin-top:14px"><button class="btn ghost" onclick="adhExportSaisie('csv')">Exporter pour saisie (${adhASaisir().length})</button><button class="btn ghost" style="flex:0 0 auto;width:auto" onclick="adhExportSaisie('json')" title="Fichier lu par le robot de saisie">JSON robot</button></div>`}
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Fermer</button></div>`;
  ficheOpen();
}
/* À la connexion : prévient s'il est arrivé des adhésions depuis la dernière visite de la liste. */
function adhAnnonce(){
  if(!SESSION||SESSION.role==="visiteur"||!(DB.adhesions||[]).length)return;
  let vu=null;try{vu=localStorage.getItem("cap-adh-vu")}catch(e){}
  const n=(DB.adhesions||[]).filter(a=>a.statut!=="rejetee"&&(!vu||a.created_at>vu)).length;
  if(vu&&n)setTimeout(()=>toast(`📝 ${n} nouvelle${n>1?"s":""} adhésion${n>1?"s":""} depuis ta dernière visite`),900);
  if(!vu){try{localStorage.setItem("cap-adh-vu",new Date().toISOString())}catch(e){}}
}

function adhWhatsAppClub(id){window.open("https://wa.me/?text="+encodeURIComponent("Bonjour, voici le formulaire d'adhésion au "+(club(id).nom||"Club d'affaires Protéine")+". Il se remplit en 3 minutes depuis votre téléphone : "+adhLink(id)),"_blank")}
function adhSelLink(){return adhLink(document.getElementById("adh-club").value)}
async function adhCopy(){const u=adhSelLink();try{await navigator.clipboard.writeText(u);toast("Lien copié")}catch(e){prompt("Lien d'adhésion :",u)}}
function adhWhatsApp(){

const ADH_CHAMPS=[["Entreprise",[["metier","Métier"],["ent_nom","Nom usuel"],["ent_nom_legal","Nom légal"],["ent_categorie","Catégorie juridique"],["ent_activite","Activité"],["ent_ice","ICE"],["ent_patente","Patente"],["ent_ville_rcs","Ville RCS"],["ent_capital","Capital"],["ent_adresse","Adresse"],["ent_tel","Téléphone"],["ent_web","Site web"]]],
  ["Membre",[["m_prenom","Prénom"],["m_nom","Nom"],["m_fonction","Fonction"],["m_email","Email"],["m_tel","Mobile"],["m_naissance","Naissance"],["m_hobbies","Hobbies"]]],
  ["Signataire",[["s_prenom","Prénom"],["s_nom","Nom"],["s_fonction","Fonction"],["s_email","Email"],["s_tel","Mobile"]]],
  ["Règlement",[["reg_mode","Mode"],["reg_fois","Versements"],["commentaires","Commentaires"]]],
  ["Facturation",[["f_entreprise","Entreprise"],["f_adresse","Adresse"],["f_cpville","CP / Ville"]]]];
function adhDetail(id){
  const a=(DB.adhesions||[]).find(x=>x.id===id);if(!a)return;const d={...a.data};
  if(d.sig_same){d.s_prenom="(le membre)";}
  if(d.fac_same){d.f_entreprise="(l'entreprise)";}
  d.reg_mode={cheque:"Chèque",virement:"Virement bancaire"}[d.reg_mode]||d.reg_mode;
  if(d.reg_fois)d.reg_fois="En "+d.reg_fois+" fois";
  if(/^\d{4}-\d{2}-\d{2}$/.test(d.m_naissance||""))d.m_naissance=d.m_naissance.split("-").reverse().join("/");
  const blocs=ADH_CHAMPS.map(([t,ch])=>{const r=ch.filter(([k])=>d[k]).map(([k,l])=>`<div class="drow"><div class="tx"><div class="k">${esc(l)}</div><div class="v" style="font-weight:500">${esc(d[k])}</div></div>${k==="m_tel"||k==="s_tel"||k==="ent_tel"?`<a href="tel:${esc(String(d[k]).replace(/\s/g,""))}">Appeler</a>`:k.endsWith("email")?`<a href="mailto:${esc(d[k])}">Écrire</a>`:""}</div>`).join("");
    return r?`<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--crimson);margin:14px 0 4px">${esc(t)}</div>${r}`:""}).join("");
  const mb=a.membre_id&&DB.membres.find(m=>m.id===a.membre_id);
  const clubOpts=DB.clubs.slice().sort((x,y)=>x.nom.localeCompare(y.nom)).map(c=>`<option value="${c.id}" ${c.id===a.ref?"selected":""}>${esc(c.nom)} · ${esc(c.ville)}</option>`).join("");
  const peut=!readOnly();
  document.getElementById("sheet-content").innerHTML=`
    ${ficheHead({ini:initiales(a.data.ent_nom||adhNom(a)),title:a.data.ent_nom||"Adhésion",sub:`${esc(adhNom(a))} · reçue ${adhAge(a.created_at)} · <b>${ADH_STATUTS[a.statut]}</b>${mb?" · membre n°"+mb.num+" de "+esc(club(mb.clubId).nom||""):""}`})}
    ${adhEtape(a)>0?`<div class="adh-track">${[["Reçue",1],["Intégrée au club",2],["Saisie CRM national",3]].map(([l,k])=>`<div class="${k<=adhEtape(a)?"on":""}"><i>${k<=adhEtape(a)?"✓":k}</i><span>${l}</span></div>`).join("")}</div>`:""}
    ${adhEnRetard(a)?`<div class="ck-act urgent" style="margin-bottom:10px;cursor:default"><span class="ic">⏰</span><span class="tx">En attente depuis ${adhJours(a.created_at)} jours</span></div>`:""}
    ${a.pdf_path?`<button class="btn" onclick="adhPdf('${a.id}')">📄 Ouvrir le formulaire PDF</button>`:`<p style="color:var(--muted);font-size:13px">Pas de PDF joint.</p>`}
    <div class="drow" style="margin-top:10px"><div class="tx"><div class="k">CRM national Protéine</div><div class="v">${a.saisie_proteine_le?"Saisie faite le "+adhDate(a.saisie_proteine_le):"Pas encore saisie"}</div></div>${peut?`<a href="#" onclick="adhSaisie('${a.id}',${!a.saisie_proteine_le});return false">${a.saisie_proteine_le?"Annuler":"Marquer saisie"}</a>`:""}</div>
    ${blocs}
    ${peut&&a.statut!=="integree"?`<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--crimson);margin:18px 0 8px">Intégrer comme membre</div>
      <div class="field"><label>Club</label><select id="adh-int-club"><option value="">— Choisir un club —</option>${clubOpts}</select></div>
      <button class="btn" onclick="adhIntegrer('${a.id}')">Intégrer dans le club</button>`:""}
    <div class="sheet-actions" style="margin-top:12px">
      <button class="btn ghost" onclick="openAdhesions()">← Liste</button>
      ${peut&&a.statut==="recue"?`<button class="btn ghost" onclick="adhStatut('${a.id}','traitee')">Marquer traitée</button>`:""}
      ${peut&&a.statut!=="integree"&&a.statut!=="rejetee"?`<button class="btn ghost" onclick="adhStatut('${a.id}','rejetee')">Rejeter</button>`:""}
    </div>`;
}
/* ---- Classeur des PDF : par mois de réception, puis par groupe, fichiers nommés
   « NOM Prénom - JJ-MM-AAAA - Groupe.pdf ». Les fichiers restent stockés sous leur id
   (le groupe n'est souvent connu qu'à l'intégration) : le nom lisible est appliqué à
   l'affichage et au téléchargement, il est donc toujours à jour. ---- */
const MOIS_FR=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
function adhGroupe(a){
  const mb=a.membre_id&&DB.membres.find(m=>m.id===a.membre_id);
  const c=mb?club(mb.clubId):(a.ref?club(a.ref):{});
  return c&&c.nom?c.nom:"Sans groupe";
}
function adhDateFr(iso){const d=new Date(iso);return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear()}
function adhMoisCle(iso){const d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function adhNomFichierPropre(t){return String(t||"").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim()}
function adhNomFichier(a){
  const nomPers=((a.data.m_nom||"").toUpperCase()+" "+(a.data.m_prenom||"")).trim()||"Sans nom";
  return adhNomFichierPropre(nomPers+" - "+adhDateFr(a.created_at)+" - "+adhGroupe(a)+(a.statut==="rejetee"?" (rejetée)":""))+".pdf";
}
/* Classeur : TOUTES les demandes reçues avec un PDF, rejetées comprises (trace complète, rien n'est
   jamais effacé : la base n'autorise aucune suppression d'adhésion ni de PDF). Chacun n'y voit que son
   périmètre (RLS cap_peut_voir_adhesion) : animateur = ses clubs, directeur = sa zone, national = tout. */
function adhClasseurListe(){return(DB.adhesions||[]).filter(a=>a.pdf_path)}
let _clsMode="groupe";
function adhPerimetre(){const r=SESSION&&SESSION.role;return r==="animateur"?"tes clubs":r==="directeur"?"ta zone":"tout le réseau"}
function clsLigne(a){return `<div class="rank-row"><span style="font-size:18px">📄</span><div class="rn" style="cursor:pointer" onclick="adhPdf('${a.id}')" title="${esc(adhNomFichier(a))}">${esc(((a.data.m_nom||"").toUpperCase()+" "+(a.data.m_prenom||"")).trim()||"Sans nom")}<small>${adhDateFr(a.created_at).replace(/-/g,"/")} · ${esc(a.data.ent_nom||"")} · ${a.statut==="rejetee"?'<b style="color:var(--muted)">Rejetée</b>':ADH_STATUTS[a.statut]}</small></div><button class="btn ghost mini" onclick="adhTelecharger('${a.id}')" aria-label="Télécharger">⬇</button></div>`}
function clsMoisTitre(m){const [y,mm]=m.split("-");return MOIS_FR[+mm-1]+" "+y}
function clsGrouper(liste,cle){const o={};liste.forEach(a=>{const k=cle(a);(o[k]=o[k]||[]).push(a)});return o}
async function openClasseur(mode){
  if(mode)_clsMode=mode;
  if(!DB.adhesions){await openAdhesions();}
  const liste=adhClasseurListe();
  const triG=(x,y)=>(x==="Sans groupe")-(y==="Sans groupe")||x.localeCompare(y);
  let html="";
  if(!liste.length)html=`<div class="empty"><b>Aucun PDF pour l'instant</b>Les formulaires reçus apparaîtront ici.</div>`;
  else if(_clsMode==="groupe"){
    const pg=clsGrouper(liste,adhGroupe);
    html=Object.keys(pg).sort(triG).map((g,i)=>{const l=pg[g],pm=clsGrouper(l,a=>adhMoisCle(a.created_at)),c=DB.clubs.find(x=>x.nom===g);
      return `<details class="cls-dos" style="--vc:${c?villeColor(c.ville):"#8C8085"}" ${i===0?"open":""}><summary><span class="rl-emb sm">${esc(initiales(g.replace(/^CAP\s+/,"")))}</span><span class="rl-t"><b>${esc(g.replace(/^CAP\s+/,""))}</b><small>${l.length} PDF${c?" · "+esc(c.ville):""}</small></span><button class="btn ghost mini" onclick="event.preventDefault();adhZipGroupe(${JSON.stringify(g).replace(/"/g,"&quot;")})">⬇ .zip</button></summary>
        ${Object.keys(pm).sort().reverse().map(m=>`<div class="cls-mois">${clsMoisTitre(m)} <em>${pm[m].length}</em></div><div class="rank">${pm[m].sort((x,y)=>y.created_at.localeCompare(x.created_at)).map(clsLigne).join("")}</div>`).join("")}</details>`}).join("");
  }else{
    const pm=clsGrouper(liste,a=>adhMoisCle(a.created_at));
    html=Object.keys(pm).sort().reverse().map(m=>{const pg=clsGrouper(pm[m],adhGroupe);
      return `<div class="cls-mtitre">${clsMoisTitre(m)} <em>${pm[m].length} PDF</em><button class="btn ghost mini" onclick="adhZipMois('${m}')">⬇ .zip</button></div>
        ${Object.keys(pg).sort(triG).map(g=>`<div class="cls-mois">📂 ${esc(g)} <em>${pg[g].length}</em></div><div class="rank">${pg[g].map(clsLigne).join("")}</div>`).join("")}`}).join("");
  }
  document.getElementById("sheet-content").innerHTML=`
    ${ficheHead({ini:"📁",title:"Classeur des PDF",sub:`Toutes les demandes reçues, rejetées comprises · ${adhPerimetre()}`})}
    <div class="seg-sc" style="margin-top:0"><span class="knob" style="transform:translateX(${_clsMode==="mois"?"100%":"0"})"></span><button class="${_clsMode==="groupe"?"on":""}" onclick="openClasseur('groupe')">Par groupe</button><button class="${_clsMode==="mois"?"on":""}" onclick="openClasseur('mois')">Par mois</button></div>
    ${html}
    <p class="fh-note" style="margin-top:12px">Fichiers nommés « NOM Prénom - date - groupe ». Rien n'est jamais effacé : chaque demande reçue reste consultable.</p>
    <div class="sheet-actions"><button class="btn ghost" onclick="openAdhesions()">← Adhésions</button></div>`;
  ficheOpen();
}
async function adhBlob(a){
  const {data,error}=await sb.storage.from("adhesions").createSignedUrl(a.pdf_path,600);
  if(error||!data)throw new Error("PDF introuvable");
  const r=await fetch(data.signedUrl);if(!r.ok)throw new Error("PDF introuvable");
  return await r.blob();
}
function adhSauver(blob,nom){const u=URL.createObjectURL(blob);const l=Object.assign(document.createElement("a"),{href:u,download:nom});document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function adhTelecharger(id){
  const a=DB.adhesions.find(x=>x.id===id);
  try{adhSauver(await adhBlob(a),adhNomFichier(a))}catch(e){toast(e.message)}
}
async function adhZip(liste,racine,dossier){
  if(!liste.length)return;
  toast("Préparation du ZIP ("+liste.length+" PDF)…");
  try{
    if(!window.JSZip)await new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";sc.onload=ok;sc.onerror=()=>ko(new Error("Module ZIP indisponible"));document.head.appendChild(sc)});
    const zip=new JSZip();const vus=new Set();let manquants=0;
    for(const a of liste){
      let chemin=racine+"/"+adhNomFichierPropre(dossier(a))+"/"+adhNomFichier(a),k=2;
      while(vus.has(chemin)){chemin=chemin.replace(/( \(\d+\))?\.pdf$/," ("+(k++)+").pdf")}vus.add(chemin);
      try{zip.file(chemin,await adhBlob(a))}catch(e){manquants++}
    }
    adhSauver(await zip.generateAsync({type:"blob"}),racine+".zip");
    toast(manquants?(liste.length-manquants)+" PDF dans le ZIP, "+manquants+" introuvable(s)":"ZIP prêt : "+liste.length+" PDF");
  }catch(e){toast(e.message)}
}
function adhZipMois(m){const [y,mm]=m.split("-");return adhZip(adhClasseurListe().filter(a=>adhMoisCle(a.created_at)===m),"Adhesions "+y+"-"+mm+" ("+MOIS_FR[+mm-1]+")",adhGroupe)}
function adhZipGroupe(g){return adhZip(adhClasseurListe().filter(a=>adhGroupe(a)===g),"Adhesions "+adhNomFichierPropre(g),a=>{const m=adhMoisCle(a.created_at);return m+" ("+MOIS_FR[+m.split("-")[1]-1]+")"})}
async function adhPdf(id){
  const a=DB.adhesions.find(x=>x.id===id);
  const w=window.open("","_blank"); // ouvert AVANT l'attente réseau, sinon le téléphone bloque la fenêtre
  const {data,error}=await sb.storage.from("adhesions").createSignedUrl(a.pdf_path,600);
  if(error||!data){if(w)w.close();toast("PDF introuvable");return}
  if(w)w.location=data.signedUrl;else location.href=data.signedUrl;
}
function adhASaisir(){return(DB.adhesions||[]).filter(a=>!a.saisie_proteine_le&&a.statut!=="rejetee")}
async function adhSaisie(id,faite){
  const {error}=await sb.from("adhesions").update(faite?{saisie_proteine_le:new Date().toISOString(),saisie_proteine_par:SESSION.id}:{saisie_proteine_le:null,saisie_proteine_par:null}).eq("id",id);
  if(error){toast(rlsMsg(error));return}
  const a=DB.adhesions.find(x=>x.id===id);a.saisie_proteine_le=faite?new Date().toISOString():null;toast(faite?"Marquée saisie dans le CRM Protéine":"Saisie annulée");adhDetail(id);
}
/* Export « prêt à saisir » : une ligne par adhésion pas encore saisie dans le CRM national,
   colonnes dans l'ordre du formulaire officiel. Sert à la saisie en série (voir
   docs/saisie-en-serie-crm-proteine.md) ; le format JSON est lu par l'outil de saisie. */

function adhLigneExport(a){

function adhExportSaisie(format){

  const lignes=list.map(adhLigneExport),jour=new Date().toISOString().slice(0,10);
  const dl=(blob,nom)=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nom;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)};
  const csv="\ufeff"+[ADH_EXPORT_COLS.map(c=>c[1]),...lignes.map(l=>ADH_EXPORT_COLS.map(([k])=>l[k]))].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n");
  // un seul fichier par clic : un second téléchargement simultané est bloqué par les navigateurs
  if(format==="json")dl(new Blob([JSON.stringify(lignes,null,2)],{type:"application/json"}),"adhesions-a-saisir-"+jour+".json");
  else dl(new Blob([csv],{type:"text/csv"}),"adhesions-a-saisir-"+jour+".csv");

/* Les menus courts deviennent des pastilles : le <select> reste (caché) et porte la valeur, rien ne change à l'enregistrement. */
function pillify(root){
  if(!root)return;
  root.querySelectorAll("select[data-pills]").forEach(sel=>{
    if(sel.dataset.pilled)return;sel.dataset.pilled="1";sel.classList.add("hidden");
    const box=document.createElement("div");box.className="pills";box.setAttribute("role","radiogroup");
    [...sel.options].forEach(o=>{const b=document.createElement("button");b.type="button";b.className="pill"+(o.value===sel.value?" on":"");
      b.textContent=o.text;b.setAttribute("role","radio");b.setAttribute("aria-checked",o.value===sel.value);
      b.onclick=()=>{sel.value=o.value;box.querySelectorAll(".pill").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-checked",on)});sel.dispatchEvent(new Event("change",{bubbles:true}))};
      box.appendChild(b)});
    sel.after(box);
  });
}

function guestStack(guests,ng){
  const g=(guests||[]).slice(0,3).map((x,i)=>`<span style="background:${GP_COUL[(x.nom||"").length%GP_COUL.length]}">${esc(initiales(x.nom))}</span>`).join("");
  return `<span class="gp" title="${ng} invité${ng>1?"s":""}">${g}${ng>3?`<span class="more">+${ng-3}</span>`:""}</span>`;
}
/* Synthèse : bonjour personnalisé, objectif le plus proche, courbe des membres, fête quand un club atteint son objectif. */
function dashBonjour(){
  const h=new Date().getHours(),sal=h<5||h>=18?"Bonsoir":"Bonjour";
  const prenom=(SESSION.name||"").split(/[ @.]/)[0];
  const ids=new Set(_dashScope.nat||[]);
  const n=DB.clubs.filter(c=>ids.has(c.id)&&clubTone(c)!=="ok").length+(SESSION.role==="visiteur"?0:(adhAIntegrer().length?1:0)+(adhASaisir().length?1:0));
  const jour=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}).replace(/^./,c=>c.toUpperCase());
  return `<button class="hello" onclick="const t=document.getElementById('dash-todo');if(t)t.scrollIntoView({behavior:'smooth',block:'center'})"><span style="flex:1;position:relative;z-index:1"><b>${sal} ${esc(prenom)} 👋</b><small>${jour} · ${n?`${n} action${n>1?"s":""} t'attend${n>1?"ent":""}`:"rien ne presse"}</small></span><span class="n">${n||"✓"}</span></button>`;
}
function dashObjectif(sc){
  const ids=new Set(_dashScope[sc]||[]);
  const c=DB.clubs.filter(c=>ids.has(c.id)&&c.objectif).map(c=>({c,n:DB.membres.filter(m=>m.clubId===c.id).length})).filter(x=>x.n<x.c.objectif&&x.n/x.c.objectif>=.5).sort((a,b)=>(b.n/b.c.objectif)-(a.n/a.c.objectif))[0];
  if(!c)return"";const k=c.c.objectif-c.n;
  return `<button class="goal" onclick="openClub('${c.c.id}')"><span style="font-size:22px">🎯</span><span style="flex:1"><b>${esc(c.c.nom.replace(/^CAP\s+/,""))} : ${c.n} membres sur ${c.c.objectif}</b><small>Plus que ${k} pour atteindre l'objectif</small></span></button>`;
}
function dashCourbe(sc){
  const ids=new Set(_dashScope[sc]||[]);const mb=DB.membres.filter(m=>ids.has(m.clubId));
  if(!mb.length)return"";
  const now=new Date(),mois=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i+1,1);mois.push({fin:isoJour(d),lab:MOIS[(now.getMonth()-i+12)%12]})}
  const pts=mois.map(x=>mb.filter(m=>!m.createdAt||m.createdAt.slice(0,10)<x.fin).length);
  const max=Math.max(1,...pts),min=Math.min(...pts),W=300,H=64,rg=Math.max(1,max-min);
  const xy=pts.map((v,i)=>[Math.round(i*W/5),Math.round(H-6-(v-min)/rg*(H-14))]);
  const d=xy.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  return `<div class="spark-c"><div class="h">Membres sur 6 mois <span style="color:var(--crimson)">${pts[5]}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Évolution du nombre de membres : ${pts.join(", ")}"><defs><linearGradient id="spg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--crimson)" stop-opacity=".22"/><stop offset="1" stop-color="var(--crimson)" stop-opacity="0"/></linearGradient></defs>
    <path class="a" d="${d} L${W} ${H} L0 ${H} Z" fill="url(#spg)"/><path class="l" d="${d}" vector-effect="non-scaling-stroke"/></svg>
    <div class="months">${mois.map(x=>`<span>${x.lab}</span>`).join("")}</div></div>`;
}
function dashFete(){
  const atteints=DB.clubs.filter(c=>c.objectif&&DB.membres.filter(m=>m.clubId===c.id).length>=c.objectif);
  let neuf=null;
  atteints.forEach(c=>{const k="cap-fete-"+c.id;try{if(!localStorage.getItem(k)){localStorage.setItem(k,"1");if(!neuf)neuf=c}}catch(e){}});
  if(!neuf)return;
  toast("🏆 "+neuf.nom.replace(/^CAP\s+/,"")+" a atteint son objectif !","s");
  if(_calme())return;
  const box=document.getElementById("confetti");const col=["#B0122E","#C8A24C","#F3D88E","#2E7D5B","#5C0A18"];
  box.innerHTML=Array.from({length:60},(_,i)=>`<i style="left:${Math.random()*100}%;background:${col[i%col.length]};animation-delay:${Math.random()*.4}s;--dx:${Math.round(Math.random()*160-80)}px;--r:${Math.round(Math.random()*720-360)}deg"></i>`).join("");
  setTimeout(()=>box.innerHTML="",2600);
}
/* Comptes : une couleur par rôle. */
function roleCouleur(r){return{superadmin:"#B0122E",directeur_national:"#5C0A18",directeur:"#B8862A",animateur:"#2E7D5B",visiteur:"#8C8085"}[r]||"#8C8085"}
function rolePill(r){return{directeur:"dir",directeur_national:"dir",animateur:"an",visiteur:"vi"}[r]||""}
