/* ============================================================
   TABLEAU DE BORD — National + Régional
   ============================================================ */
const REGION_RSK=["Rabat","Salé","Kenitra"];
function dashStats(clubs){
  const ids=clubs.map(c=>c.id);
  const membres=DB.membres.filter(m=>ids.includes(m.clubId));
  const reunions=DB.reunions.filter(r=>ids.includes(r.clubId));
  const invites=reunions.flatMap(r=>r.guests||[]);
  return{
    clubs:clubs.length,
    actifs:clubs.filter(c=>c.statut==="actif").length,
    creation:clubs.filter(c=>c.statut==="creation").length,
    sansAnim:clubs.filter(c=>!c.animId).length,
    membres:membres.length,
    payes:membres.filter(m=>m.paiement).length,
    membresMois:membres.filter(m=>m.createdAt&&m.createdAt.slice(0,7)===isoJour(new Date()).slice(0,7)).length,
    reunionsAvenir:reunions.filter(r=>!isPast(r.date)&&r.statut!=="annulee").length,
    reunionsRealisees:reunions.filter(r=>r.statut==="realisee").length,
    invites:invites.length,
    invitesMembre:invites.filter(g=>g.statut==="Membre").length,
    perClub:clubs.map(c=>({id:c.id,nom:c.nom,ville:c.ville,n:DB.membres.filter(m=>m.clubId===c.id).length,lvl:clubHealth(c).level})).sort((a,b)=>b.n-a.n||a.nom.localeCompare(b.nom))
  };
}
/* Chaque chiffre de la Synthèse ouvre la liste qu'il compte (dashDrill), chaque ligne la fiche.
   sc = périmètre : "nat" (tout le réseau) ou "reg" (Rabat·Salé·Kénitra), mémorisé dans _dashScope. */
let _dashScope={};
function dashTile(n,l,kind,sc,i,tr){return `<div class="stat link" style="--i:${i}" role="button" tabindex="0" onclick="dashDrill('${kind}','${sc}')" onkeydown="if(event.key==='Enter')dashDrill('${kind}','${sc}')"><div class="n" data-count="${n}">${n}</div><div class="l">${l}</div>${tr?`<div class="tr">▲ ${tr}</div>`:""}</div>`}
function dashBlock(s,sc,sansTodo){
  sc=sc||"nat";
  const maxN=Math.max(1,...s.perClub.map(c=>c.n));
  const ranks=s.perClub.map(c=>`<div class="rank-row link" onclick="openClub('${c.id}')"><span class="hdot ${c.lvl}"></span><div class="rn">${esc(c.nom.replace("CAP ",""))}<small>${esc(c.ville)}</small></div>
    <div class="bar"><i style="width:${Math.round(c.n/maxN*100)}%"></i></div><div class="rv">${c.n}</div></div>`).join("");
  return `
    <div class="stats">
      ${dashTile(s.clubs,`Clubs · ${s.actifs} actifs`,"clubs",sc,0)}
      ${dashTile(s.membres,"Membres","membres",sc,1,s.membresMois?`+${s.membresMois} ce mois`:"")}
      ${dashTile(s.reunionsAvenir,"Réunions à venir","reunions",sc,2)}
    </div>
    <div class="stats">
      ${dashTile(s.payes,"Membres à jour (payé)","payes",sc,3)}
      ${dashTile(s.invites,"Invités suivis","invites",sc,4)}
      ${dashTile(s.sansAnim,"Clubs sans animateur","sansAnim",sc,5)}
    </div>
    ${dashObjectif(sc)}
    ${dashActivite(sc)}
    ${sansTodo?"":dashATraiter(sc)}
    ${dashCourbe(sc)}
    <div style="font-size:12px;font-weight:600;color:var(--muted);margin:6px 2px 8px">Membres par groupe</div>
    <div class="rank" style="--i:6">${ranks||`<div class="rank-row"><div class="rn" style="color:var(--muted);font-weight:500">Aucun club dans ce périmètre.</div></div>`}</div>`;
}
/* Ce qui attend une action, club par club (même règle que la fiche du club) : urgent d'abord. */
function dashATraiter(sc){
  const ids=new Set(_dashScope[sc]||[]);
  const l=DB.clubs.filter(c=>ids.has(c.id)).map(c=>({c,t:clubTone(c),na:clubNextAction(c)})).filter(x=>x.t!=="ok").sort((a,b)=>(a.t==="urgent"?0:1)-(b.t==="urgent"?0:1)||a.c.nom.localeCompare(b.c.nom));
  const nI=SESSION.role==="visiteur"?0:adhAIntegrer().length,nS=SESSION.role==="visiteur"?0:adhASaisir().length;
  const adhRows=(nI?`<div class="rank-row link" onclick="openAdhesions('todo')"><span class="dt-ic urgent">📝</span><div class="rn">${nI} adhésion${nI>1?"s":""} à intégrer<small>Formulaires reçus par le lien</small></div></div>`:"")
    +(nS?`<div class="rank-row link" onclick="openAdhesions('saisie')"><span class="dt-ic">🗂</span><div class="rn">${nS} à saisir dans le CRM national<small>Contrat membre à préparer</small></div></div>`:"");
  if(!l.length&&!adhRows)return `<div class="dash-todo ok" id="dash-todo">✓ Rien n'attend d'action.</div>`;
  if(!l.length)return `<div id="dash-todo" style="font-size:12px;font-weight:600;color:var(--muted);margin:6px 2px 8px">À traiter</div><div class="rank dash-todo">${adhRows}</div>`;
  const vis=l.slice(0,4);
  return `<div id="dash-todo" style="font-size:12px;font-weight:600;color:var(--muted);margin:6px 2px 8px">À traiter <span style="color:var(--crimson);font-weight:700">${l.length+(nI?1:0)+(nS?1:0)}</span></div>
    <div class="rank dash-todo">${adhRows}${vis.map(x=>`<div class="rank-row link" onclick="clubCardAction('${x.c.id}')"><span class="dt-ic ${x.t}">${clubIco(x.c,x.t)}</span><div class="rn">${esc(x.na.label)}<small>${esc(x.c.nom.replace(/^CAP\s+/,""))}</small></div></div>`).join("")}
    ${l.length>vis.length?`<div class="rank-row link" onclick="filter='todo';go2('clubs')"><div class="rn" style="color:var(--crimson)">Voir les ${l.length} clubs à traiter</div></div>`:""}</div>`;
}
function go2(t){go(t);if(t==="clubs"){filter="todo";render()}}
/* Entonnoir des invités : une colonne par étape, hauteur proportionnelle, clic = la liste. */
function dashFunnel(clubs,sc){
  const ids=clubs.map(c=>c.id);
  const invites=DB.reunions.filter(r=>ids.includes(r.clubId)).flatMap(r=>r.guests||[]);
  if(!invites.length)return"";
  const n=GUEST_STATUTS.map(s=>invites.filter(g=>g.statut===s).length),mx=Math.max(1,...n);
  const cols=GUEST_STATUTS.map((s,i)=>`<button class="fn-col" onclick="dashDrill('inv:${s}','${sc||"nat"}')"><b data-count="${n[i]}">${n[i]}</b><i style="height:${Math.max(4,Math.round(n[i]/mx*56))}px;--i:${i}"></i><small>${esc(s)}</small></button>`).join("");
  return `<div style="font-size:12px;font-weight:600;color:var(--muted);margin:16px 2px 8px">Entonnoir des invités <span style="color:var(--crimson);font-weight:700">${invites.length}</span></div>
    <div class="funnel">${cols}</div>`;
}
function dashByAnim(clubs){
  const ids=new Set(clubs.map(c=>c.id));
  const anims=DB.animateurs.filter(a=>DB.clubs.some(c=>c.animId===a.id&&ids.has(c.id)));
  if(!anims.length)return"";
  const rows=anims.map(a=>{
    const acl=DB.clubs.filter(c=>c.animId===a.id&&ids.has(c.id));
    const nbM=DB.membres.filter(m=>acl.some(c=>c.id===m.clubId)).length;
    const nbUp=DB.reunions.filter(r=>acl.some(c=>c.id===r.clubId)&&!isPast(r.date)&&r.statut!=="annulee").length;
    return{id:a.id,nom:a.nom,c:acl.length,m:nbM,r:nbUp};
  }).sort((x,y)=>y.m-x.m);
  const maxM=Math.max(1,...rows.map(r=>r.m));
  return `<div style="font-size:12px;font-weight:600;color:var(--muted);margin:16px 2px 8px">Par animateur</div>
    <div class="rank">${rows.map(r=>`<div class="rank-row link" onclick="openAnim('${r.id}')"><div class="rn">${esc(r.nom)}<small>${r.c} club${r.c>1?"s":""} · ${r.r} réunion${r.r>1?"s":""} à venir</small></div>
      <div class="bar"><i style="width:${Math.round(r.m/maxM*100)}%"></i></div><div class="rv">${r.m}</div></div>`).join("")}</div>`;
}
function dashRelancer(clubs){
  const ids=new Set(clubs.map(c=>c.id));
  const flag=[["formulaire","Formulaire"],["contrat","Contrat"],["facture","Facture"],["paiement","Paiement"]];
  const list=DB.membres.filter(m=>ids.has(m.clubId)&&flag.some(f=>!m[f[0]]));
  if(!list.length)return `<div style="font-size:12px;font-weight:600;color:var(--muted);margin:16px 2px 8px">À relancer</div>
    <div class="rank"><div class="rank-row"><div class="rn" style="color:var(--ok);font-weight:600">✓ Tous les membres sont à jour.</div></div></div>`;
  const rows=list.sort((a,b)=>flag.filter(f=>!a[f[0]]).length-flag.filter(f=>!b[f[0]]).length===0?0:flag.filter(f=>!b[f[0]]).length-flag.filter(f=>!a[f[0]]).length).map(m=>{
    const manque=flag.filter(f=>!m[f[0]]).map(f=>f[1]).join(", ");
    return `<div class="rank-row link" onclick="memberSheet('${m.clubId}','${m.id}')"><div class="rn">${esc(m.nom)}<small>${esc(club(m.clubId).nom.replace("CAP ",""))} · manque : ${esc(manque)}</small></div>
      <span class="gstat" style="background:var(--warn-tint);color:var(--warn);border-color:transparent">${4-flag.filter(f=>!m[f[0]]).length}/4</span></div>`;
  }).join("");
  return `<div style="font-size:12px;font-weight:600;color:var(--muted);margin:16px 2px 8px">À relancer <span style="color:var(--warn);font-weight:700">${list.length}</span></div>
    <div class="rank">${rows}</div>`;
}
function dashDrill(kind,sc){
  const ids=new Set(_dashScope[sc]||DB.clubs.map(c=>c.id));
  const clubsS=DB.clubs.filter(c=>ids.has(c.id));
  const perim=sc==="reg"?"Rabat · Salé · Kénitra":"Tout le réseau";
  const row=(on,t,sub,right)=>`<div class="rank-row drill-row" onclick="${on}"><div class="rn">${t}<small>${sub}</small></div>${right||""}<span style="color:var(--muted);font-size:18px">›</span></div>`;
  const nomClub=id=>esc((club(id).nom||"").replace("CAP ",""));
  let titre="",items=[];
  if(kind==="clubs"||kind==="sansAnim"){
    const l=(kind==="clubs"?clubsS:clubsS.filter(c=>!c.animId)).sort((a,b)=>a.ville.localeCompare(b.ville)||a.nom.localeCompare(b.nom));
    titre=kind==="clubs"?"Clubs":"Clubs sans animateur";
    items=l.map(c=>row(`openClub('${c.id}')`,esc(c.nom),`${esc(c.ville)} · ${c.statut==="actif"?"actif":"en création"} · ${esc(animNom(c.animId))}`,`<span class="rv" style="font-size:14px">${DB.membres.filter(m=>m.clubId===c.id).length}</span>`));
  }else if(kind==="membres"||kind==="payes"){
    const l=DB.membres.filter(m=>ids.has(m.clubId)&&(kind==="membres"||m.paiement)).sort((a,b)=>nomClub(a.clubId).localeCompare(nomClub(b.clubId))||a.nom.localeCompare(b.nom));
    titre=kind==="membres"?"Membres":"Membres à jour (payé)";
    items=l.map(m=>{const cl=memberChecklist(m);return row(`memberSheet('${m.clubId}','${m.id}')`,esc(m.nom),`${nomClub(m.clubId)}${m.specialite?" · "+esc(m.specialite):""}`,`<span class="gstat">${cl.done}/${cl.total}</span>`)});
  }else if(kind==="reunions"){
    const l=DB.reunions.filter(r=>ids.has(r.clubId)&&!isPast(r.date)&&r.statut!=="annulee").sort((a,b)=>a.date.localeCompare(b.date));
    titre="Réunions à venir";
    items=l.map(r=>{const d=dObj(r.date);return row(`openMeeting('${r.id}')`,`${d.getDate()} ${MOIS[d.getMonth()]} · ${nomClub(r.clubId)}`,`${TYPES[r.type]} · ${esc(lieuNom(r.lieuId))}${r.heure?" · "+esc(r.heure):""}`,`<span class="st ${r.statut}">${STATUTS[r.statut]}</span>`)});
  }else if(kind==="invites"||kind.startsWith("inv:")){
    const st=kind.startsWith("inv:")?kind.slice(4):null;
    const l=DB.reunions.filter(r=>ids.has(r.clubId)).flatMap(r=>(r.guests||[]).map(g=>({g,r}))).filter(x=>!st||x.g.statut===st);
    titre=st?"Invités · "+st:"Invités suivis";
    items=l.map(({g,r})=>row(`openMeeting('${r.id}')`,esc(g.nom),`${nomClub(r.clubId)} · ${dObj(r.date).getDate()} ${MOIS[dObj(r.date).getMonth()]}${g.par?" · invité par "+esc(g.par):""}`,`<span class="gstat">${esc(g.statut)}</span>`));
  }
  document.getElementById("sheet-content").innerHTML=`
    <h3>${titre} <span style="color:var(--crimson)">${items.length}</span></h3><div class="sheet-sub">${perim}</div>
    ${items.length?`<div class="rank">${items.join("")}</div>`:`<div class="empty"><b>Rien à afficher</b>Aucun élément dans ce périmètre.</div>`}
    <div class="sheet-actions" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">Fermer</button></div>`;
  openSheet();
}
/* Les chiffres de la Synthèse comptent jusqu'à leur valeur (une fois par affichage). */
function dashCountUp(root){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  root.querySelectorAll("[data-count]").forEach((el,i)=>{
    const fin=+el.dataset.count;if(!fin)return;
    const t0=performance.now()+i*45,dur=Math.min(900,350+fin*25);
    el.textContent="0";
    const pas=t=>{const k=Math.max(0,Math.min(1,(t-t0)/dur));el.textContent=Math.round(fin*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(pas)};
    requestAnimationFrame(pas);
  });
}
function viewDashboard(){
  const seeAll=true; // tout le monde voit le national + régional ; filtrage local par onglet
  const scope=DB.clubs;
  _dashScope={nat:DB.clubs.map(c=>c.id),reg:DB.clubs.filter(c=>REGION_RSK.includes(c.ville)).map(c=>c.id)};
  let html=`<div class="page dash"><div class="page-head"><div><div class="eyebrow">Pilotage</div><h2>Synthèse</h2></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0">${SESSION.role==="superadmin"?`<button class="btn ghost mini" onclick="openRendement()">💰 Rendement</button>`:""}${SESSION.role!=="visiteur"?`<button class="btn ghost mini" onclick="openAdhesions()">📝 Adhésions${adhNouvelles()?` <b style="background:var(--crimson);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px">${adhNouvelles()}</b>`:""}</button>`:""}<button class="btn ghost mini" onclick="exportMembres()">Export</button></div></div>`;
  /* Un seul bloc, et un interrupteur National / Régional (mémorisé) au lieu de deux blocs empilés. */
  const sc=window._dashSc==="reg"?"reg":"nat";
  const per=DB.clubs.filter(c=>_dashScope[sc].includes(c.id));
  const large=window.matchMedia("(min-width:1100px)").matches;
  html+=large?`<div class="dash-top">${dashBonjour()}${dashOutils()}</div>`+dashBilanAlerte():dashBonjour()+dashOutils()+dashBilanAlerte();
  if(large){
    const sc=window._dashSc==="reg"?"reg":"nat";const per=DB.clubs.filter(c=>_dashScope[sc].includes(c.id));
    html+=`<div class="dash-cols"><div><div class="seg-sc" role="tablist"><span class="knob" style="transform:translateX(${sc==="reg"?"100%":"0"})"></span><button role="tab" aria-selected="${sc==="nat"}" class="${sc==="nat"?"on":""}" onclick="window._dashSc='nat';render()">National</button><button role="tab" aria-selected="${sc==="reg"}" class="${sc==="reg"?"on":""}" onclick="window._dashSc='reg';render()">Rabat · Salé · Kénitra</button></div>`
      +dashBlock(dashStats(per),sc,true)+dashByAnim(per)+`</div><div>`+dashATraiter(sc)+dashFunnel(per,sc)+dashRelancer(per)+`</div></div>`;
    return html+`<div style="height:8px"></div></div>`;
  }
  if(seeAll){
    html+=`<div class="seg-sc" role="tablist"><span class="knob" style="transform:translateX(${sc==="reg"?"100%":"0"})"></span><button role="tab" aria-selected="${sc==="nat"}" class="${sc==="nat"?"on":""}" onclick="window._dashSc='nat';render()">National</button><button role="tab" aria-selected="${sc==="reg"}" class="${sc==="reg"?"on":""}" onclick="window._dashSc='reg';render()">Rabat · Salé · Kénitra</button></div>`+dashBlock(dashStats(per),sc);
  }else{
    html+=`<div class="dash-band">Mon périmètre</div>`+dashBlock(dashStats(scope));
  }
  html+=dashFunnel(per,sc)+dashByAnim(per)+dashRelancer(per);
  return html+`<div style="height:8px"></div></div>`;
}

/* ============================================================
   RENDEMENT — module privé (superadmin) : commissions sur adhésions
   ============================================================ */
const RD_KEY="cap-rendement-params";
let _rdData=[];
function fmtMAD(n){return Math.round(n||0).toLocaleString("fr-FR").replace(/ /g," ")+" MAD"}
function rdParams(){const def={membership:9000,tauxDirect:20,tauxReseau:10,objectif:500000,membresMin:10,membresMax:15};try{return{...def,...JSON.parse(localStorage.getItem(RD_KEY)||"{}")}}catch(e){return def}}
function rdSave(p){try{localStorage.setItem(RD_KEY,JSON.stringify(p))}catch(e){}}
function rdRate(c){if(c.animId&&c.animId===SESSION.animId)return"direct";if(REGION_RSK.includes(c.ville))return"reseau";return null}
function rdRevAt(g){const p=rdParams();let rev=0;_rdData.forEach(x=>rev+=g*p.membership*x.rate/100);return rev}
function rdSim(g){
  const p=rdParams();const rev=rdRevAt(g);
  const pct=Math.min(100,Math.round(rev/(p.objectif||1)*100));
  document.getElementById("rd-sim-g").textContent=g;
  document.getElementById("rd-sim-tot").textContent=(g*_rdData.length);
  document.getElementById("rd-sim-rev").textContent=fmtMAD(rev);
  document.getElementById("rd-sim-pct").textContent=pct+"% de l'objectif";
  document.getElementById("rd-sim-bar").style.width=pct+"%";
}
function rdEdit(){
  const g=x=>parseFloat(document.getElementById(x).value)||0;
  rdSave({membership:g("rd-membership"),objectif:g("rd-objectif"),tauxDirect:g("rd-td"),tauxReseau:g("rd-tr"),membresMin:g("rd-mmin"),membresMax:g("rd-mmax")});
  toast("Paramètres enregistrés");openRendement();
}
function openRendement(){
  if(SESSION.role!=="superadmin")return;
  const p=rdParams();
  _rdData=DB.clubs.map(c=>{
    const type=rdRate(c);if(!type)return null;
    const rate=type==="direct"?p.tauxDirect:p.tauxReseau;
    const membres=DB.membres.filter(m=>m.clubId===c.id).length;
    return{nom:c.nom,ville:c.ville,type,rate,membres,revActuel:membres*p.membership*rate/100};
  }).filter(Boolean).sort((a,b)=>(b.type==="direct")-(a.type==="direct")||b.rate-a.rate||a.nom.localeCompare(b.nom));
  const nbClubs=_rdData.length;
  const nbDirect=_rdData.filter(x=>x.type==="direct").length;
  const nbReseau=nbClubs-nbDirect;
  const membresReels=_rdData.reduce((s,x)=>s+x.membres,0);
  const totActuel=_rdData.reduce((s,x)=>s+x.revActuel,0);
  const pctA=Math.min(100,Math.round(totActuel/(p.objectif||1)*100));
  const unitPerG=_rdData.reduce((s,x)=>s+p.membership*x.rate/100,0); // revenu par +1 membre/groupe
  const revMin=unitPerG*p.membresMin, revMax=unitPerG*p.membresMax;
  const gObj=unitPerG?Math.ceil(p.objectif/unitPerG):0; // membres/groupe pour l'objectif
  const gStart=Math.round((p.membresMin+p.membresMax)/2);
  const revStart=unitPerG*gStart, pctStart=Math.min(100,Math.round(revStart/(p.objectif||1)*100));
  const rows=_rdData.map(x=>`<div class="rank-row"><span class="hdot ${x.type==="direct"?"bad":"warn"}"></span><div class="rn">${esc(x.nom.replace("CAP ",""))}<small>${esc(x.ville)} · ${x.type==="direct"?"Direct "+x.rate+"%":"Réseau "+x.rate+"%"} · ${x.membres} membre${x.membres>1?"s":""}</small></div><div class="rv" style="font-size:12.5px">${fmtMAD(p.membership*p.membresMax*x.rate/100)}</div></div>`).join("");
  document.getElementById("sheet-content").innerHTML=`
    <h3>Mon rendement</h3><div class="sheet-sub">Commissions sur les adhésions · zone Rabat·Salé·Kénitra.</div>

    <div class="rd-sec">Suivi réel de la région</div>
    <div class="rd-obj"><div class="h"><span>Objectif annuel · ${fmtMAD(p.objectif)}</span><b>${pctA}%</b></div>
      <div class="gauge"><i style="width:${Math.max(pctA,2)}%"></i></div><small>Réalisé à ce jour : ${fmtMAD(totActuel)}</small></div>
    <div class="rd-g" style="margin-top:8px">
      <div class="rd-k" style="--i:0"><div class="n">${nbClubs}</div><small>Clubs · ${nbDirect} direct${nbDirect>1?"s":""} / ${nbReseau} réseau</small></div>
      <div class="rd-k" style="--i:1"><div class="n">${membresReels}</div><small>Membres réels</small></div>
      <div class="rd-k" style="--i:2"><div class="n" style="font-size:16px">${fmtMAD(totActuel)}</div><small>Revenu réalisé</small></div>
      <div class="rd-k" style="--i:3"><div class="n" style="font-size:16px">${fmtMAD(unitPerG)}</div><small>Par membre ajouté dans chaque groupe</small></div>
    </div>

    <div class="divider"></div>
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--crimson);margin-bottom:6px">Projection — hypothèse ${p.membresMin} à ${p.membresMax} membres / groupe</div>
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="stat"><div class="n" style="font-size:15px">${fmtMAD(revMin)}</div><div class="l">Bas (${p.membresMin}/groupe) · ${Math.round(revMin/(p.objectif||1)*100)}% obj.</div></div>
      <div class="stat"><div class="n" style="font-size:15px">${fmtMAD(revMax)}</div><div class="l">Haut (${p.membresMax}/groupe) · ${Math.round(revMax/(p.objectif||1)*100)}% obj.</div></div>
    </div>
    <p style="font-size:12.5px;color:var(--ink);margin:4px 2px 0;font-weight:500">🎯 Pour atteindre <b>${fmtMAD(p.objectif)}</b>, il te faut <b>~${gObj} membres par groupe</b> (soit ${gObj*nbClubs} membres sur ${nbClubs} clubs).</p>

    <div class="divider"></div>
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--crimson);margin-bottom:6px">Simulateur</div>
    <label style="font-size:12.5px;color:var(--muted);font-weight:600">Membres par groupe : <b id="rd-sim-g" style="color:var(--ink)">${gStart}</b> · total <b id="rd-sim-tot" style="color:var(--ink)">${gStart*nbClubs}</b> membres</label>
    <input type="range" min="0" max="30" value="${gStart}" oninput="rdSim(this.value)" style="width:100%;accent-color:var(--crimson);margin:10px 0">
    <div class="health-banner warn"><div class="hbig" id="rd-sim-rev">${fmtMAD(revStart)}</div><div class="hna" style="width:100%"><b>Projection</b><span id="rd-sim-pct">${pctStart}% de l'objectif</span><div class="cc-prog" style="margin-top:6px"><i id="rd-sim-bar" style="width:${pctStart}%;background:var(--warn)"></i></div></div></div>

    <div class="divider"></div>
    <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">Détail par club — potentiel à ${p.membresMax} membres</div>
    <div class="rank">${rows||`<div class="rank-row"><div class="rn" style="color:var(--muted)">Aucun club dans ton périmètre.</div></div>`}</div>

    <div class="divider"></div>
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--crimson);margin-bottom:8px">Paramètres</div>
    <div class="frow"><div class="field"><label>Adhésion HT (MAD)</label><input id="rd-membership" type="number" value="${p.membership}"></div><div class="field"><label>Objectif annuel (MAD)</label><input id="rd-objectif" type="number" value="${p.objectif}"></div></div>
    <div class="frow"><div class="field"><label>Taux direct (%)</label><input id="rd-td" type="number" value="${p.tauxDirect}"></div><div class="field"><label>Taux réseau (%)</label><input id="rd-tr" type="number" value="${p.tauxReseau}"></div></div>
    <div class="frow"><div class="field"><label>Membres/groupe (bas)</label><input id="rd-mmin" type="number" value="${p.membresMin}"></div><div class="field"><label>Membres/groupe (haut)</label><input id="rd-mmax" type="number" value="${p.membresMax}"></div></div>
    <div class="sheet-actions"><button class="btn ghost" onclick="rdEdit()">Enregistrer</button><button class="btn" onclick="closeSheet()">Fermer</button></div>
    <p style="font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.55"><b>Bases :</b> Direct = clubs que tu animes (${p.tauxDirect}%). Réseau = autres clubs de ta zone (${p.tauxReseau}%). Revenu = membres × ${fmtMAD(p.membership)} × taux. Le « suivi réel » utilise les membres réellement saisis ; la « projection » applique l'hypothèse membres/groupe à tous tes clubs. Paramètres enregistrés sur cet appareil.</p>`;
  openSheet();
}

function openMeeting(id){
  const editing=!!id;
  const m=editing?DB.reunions.find(x=>x.id===id):null;
  if(editing&&!canEditReunion(m)){meetingDetail(m,false);return}
  if(editing){meetingDetail(m,true);return}
  meetingForm(null);
}

function handlePhoto(e){
  const file=e.target.files[0];if(!file)return;
  const img=new Image();const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    const max=1000;let{width:w,height:h}=img;if(w>max||h>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
    _photoBuffer=cv.toDataURL("image/jpeg",0.72);
    const p=document.getElementById("l-photo-prev");p.src=_photoBuffer;p.classList.remove("hidden");
  };img.src=rd.result;};rd.readAsDataURL(file);
}

async function delLieu(id){

/* ---- Dossier du membre : ses informations (reprises du formulaire d'adhésion ou saisies à la main)
   et ses documents (formulaire PDF, contrat du national, contrat signé, autres pièces).
   Fichiers dans le bucket privé « membres », liste dans membre_documents (mêmes droits que les membres). ---- */
const DOC_TYPES={formulaire:"Formulaire d'adhésion",contrat:"Contrat",contrat_signe:"Contrat signé",autre:"Autre pièce"};
function mbAdhesion(m){return (DB.adhesions||[]).find(a=>a.membre_id===m.id)}
function mbInfos(m){if(m.infos&&Object.keys(m.infos).length)return m.infos;const a=mbAdhesion(m);return a?a.data||{}:{}}
function mbInfosHTML(d){
  d={...d};if(/^\d{4}-\d{2}-\d{2}$/.test(d.m_naissance||""))d.m_naissance=d.m_naissance.split("-").reverse().join("/");
  return ADH_CHAMPS.filter(([t])=>t==="Entreprise"||t==="Membre").map(([t,ch])=>{const r=ch.filter(([k])=>d[k]).map(([k,l])=>`<div class="drow"><div class="tx"><div class="k">${esc(l)}</div><div class="v" style="font-weight:500">${esc(d[k])}</div></div>${k==="m_tel"||k==="ent_tel"?`<a href="tel:${esc(String(d[k]).replace(/\s/g,""))}">Appeler</a>`:k==="m_email"?`<a href="mailto:${esc(d[k])}">Écrire</a>`:""}</div>`).join("");
    return r?`<div class="mb-sub">${esc(t)}</div>${r}`:""}).join("");
}
function mbDossierHTML(m,canEd){
  const d=mbInfos(m),vide=!Object.values(d).some(v=>typeof v==="string"&&v.trim());
  return `<div class="mb-dossier">
    ${secHead("Informations",undefined,canEd?`<button class="btn ghost mini" onclick="mbInfosForm('${m.clubId}','${m.id}')">${vide?"+ Saisir":"Modifier"}</button>`:"")}
    ${vide?`<p class="fh-empty">Aucune information. ${canEd?"Elles se remplissent toutes seules quand le membre vient du formulaire d'adhésion, ou à la main.":""}</p>`:mbInfosHTML(d)}
    ${secHead("Documents",undefined,canEd?`<span class="mb-add"><select id="mb-doc-type"><option value="contrat_signe">Contrat signé</option><option value="contrat">Contrat</option><option value="formulaire">Formulaire</option><option value="autre" selected>Autre pièce</option></select><label class="btn ghost mini">+ Ajouter<input type="file" hidden accept="application/pdf,image/jpeg,image/png,image/webp" onchange="mbDocAjouter('${m.clubId}','${m.id}',this)"></label></span>`:"")}
    <div id="mb-docs"><p class="fh-empty">Chargement…</p></div>
  </div>`;
}
async function mbDocsCharger(m,canEd){
  const a=mbAdhesion(m);
  let q=sb.from("membre_documents").select("*");
  q=a?q.or(`membre_id.eq.${m.id},adhesion_id.eq.${a.id}`):q.eq("membre_id",m.id);
  const {data,error}=await q.order("cree_le",{ascending:false});
  const el=document.getElementById("mb-docs");if(!el)return;
  const docs=(data||[]).map(x=>({...x,bucket:"membres"}));
  if(a&&a.pdf_path)docs.push({id:"",type:"formulaire",nom:"Formulaire d'adhésion signé en ligne",chemin:a.pdf_path,bucket:"adhesions",cree_le:a.created_at,fixe:true});
  if(error){el.innerHTML=`<p class="fh-empty">Documents indisponibles : ${esc(rlsMsg(error))}</p>`;return}
  el.innerHTML=docs.length?`<div class="mb-docs">${docs.map(x=>`<div class="mb-doc"><span class="mb-doc-ic">${x.type==="contrat_signe"?"✅":x.type==="contrat"?"✍️":x.type==="formulaire"?"📝":"📎"}</span>
    <span class="mb-doc-t"><b>${esc(x.nom)}</b><small>${esc(DOC_TYPES[x.type]||"Document")} · ${esc(adhDate(x.cree_le))}</small></span>
    <button class="btn ghost mini" onclick="mbDocOuvrir('${x.bucket}','${esc(x.chemin)}')">Ouvrir</button>
    ${canEd&&!x.fixe?`<button class="btn ghost mini" onclick="mbDocRetirer('${m.clubId}','${m.id}','${x.id}','${esc(x.chemin)}')">Retirer</button>`:""}</div>`).join("")}</div>`
    :`<p class="fh-empty">Aucun document pour l'instant.</p>`;
}
async function mbDocOuvrir(bucket,chemin){
  const w=window.open("","_blank"); // ouvert avant l'attente réseau, sinon le téléphone bloque la fenêtre
  const {data,error}=await sb.storage.from(bucket).createSignedUrl(chemin,600);
  if(error||!data){if(w)w.close();toast("Document introuvable");return}
  if(w)w.location=data.signedUrl;else location.href=data.signedUrl;
}
async function mbDocAjouter(clubId,id,input){
  const f=input.files&&input.files[0];if(!f)return;
  if(f.size>20*1024*1024){toast("Fichier trop lourd (20 Mo au plus)");input.value="";return}
  const type=(document.getElementById("mb-doc-type")||{}).value||"autre";
  const propre=f.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80);
  const chemin=`${id}/${Date.now()}-${propre}`;
  toast("Envoi du document…","s");
  const up=await sb.storage.from("membres").upload(chemin,f,{contentType:f.type||"application/pdf"});
  if(up.error){toast("Envoi impossible : "+rlsMsg(up.error));input.value="";return}
  const {error}=await sb.from("membre_documents").insert({membre_id:id,type,nom:f.name,chemin});
  if(error){await sb.storage.from("membres").remove([chemin]);toast("Envoi impossible : "+rlsMsg(error));input.value="";return}
  if(type==="contrat_signe"){const m=DB.membres.find(x=>x.id===id);if(m&&!m.contrat){const r=await sb.from("membres").update({contrat:true}).eq("id",id);if(!r.error){m.contrat=true}}}
  toast("Document ajouté au dossier");memberSheet(clubId,id);
}
async function mbDocRetirer(clubId,id,docId,chemin){
  const rm=await sb.storage.from("membres").remove([chemin]);
  if(rm.error){toast("Retrait impossible : "+rlsMsg(rm.error));return}
  const {error}=await sb.from("membre_documents").delete().eq("id",docId);
  if(error){toast("Retrait impossible : "+rlsMsg(error));return}
  toast("Document retiré");memberSheet(clubId,id);
}
function mbInfosForm(clubId,id){
  const m=DB.membres.find(x=>x.id===id),d=mbInfos(m);
  const champ=([k,l])=>`<div class="field"><label>${esc(l)}</label><input id="mi-${k}" value="${esc(d[k]||"")}" ${k==="m_naissance"?'type="date"':k.endsWith("email")?'type="email"':k.endsWith("tel")||k==="m_tel2"?'type="tel"':""}></div>`;
  document.getElementById("sheet-content").innerHTML=`
    ${ficheHead({vc:villeColor(club(clubId).ville),ini:initiales(m.nom),round:true,title:m.nom,sub:"Informations du membre"})}
    ${ADH_CHAMPS.filter(([t])=>t==="Entreprise"||t==="Membre").map(([t,ch])=>`<div class="mb-sub">${esc(t)}</div>${ch.map(champ).join("")}`).join("")}
    <div class="sheet-actions"><button class="btn ghost" onclick="memberSheet('${clubId}','${id}')">Annuler</button><button class="btn" onclick="mbInfosSave('${clubId}','${id}')">Enregistrer</button></div>`;
  openSheet();
}
async function mbInfosSave(clubId,id){
  const m=DB.membres.find(x=>x.id===id),infos={...mbInfos(m)};
  ADH_CHAMPS.filter(([t])=>t==="Entreprise"||t==="Membre").forEach(([,ch])=>ch.forEach(([k])=>{const el=document.getElementById("mi-"+k);if(el)infos[k]=el.value.trim()}));
  const {error}=await sb.from("membres").update({infos}).eq("id",id);
  if(error){toast(rlsMsg(error));return}
  m.infos=infos;toast("Informations enregistrées");memberSheet(clubId,id);
}
async function saveMembre(clubId,id){
  const nom=document.getElementById("m-nom").value.trim();if(!nom){toast("Nom requis");return}
  const chk=k=>document.getElementById("m-"+k).checked;
  const spec=document.getElementById("m-specialite").value.trim();
  const dupSpec=spec&&DB.membres.some(m=>m.clubId===clubId&&m.id!==id&&(m.specialite||"").toLowerCase()===spec.toLowerCase());
  const row={club_id:clubId,nom,specialite:document.getElementById("m-specialite").value.trim(),
    formulaire:chk("formulaire"),contrat:chk("contrat"),facture:chk("facture"),paiement:chk("paiement"),
    reorientation:document.getElementById("m-reorientation").value.trim(),commentaires:document.getElementById("m-commentaires").value.trim()};
  if(id){
    const {error}=await sb.from("membres").update(row).eq("id",id);
    if(error){toast(rlsMsg(error));return}
    Object.assign(DB.membres.find(x=>x.id===id),mapMembre({id,...row}));toast("Membre mis à jour");
  }else{
    const nextNum=(DB.membres.filter(x=>x.clubId===clubId).reduce((a,b)=>Math.max(a,b.num||0),0))+1;
    const {data,error}=await sb.from("membres").insert({...row,num:nextNum}).select().single();
    if(error){toast(rlsMsg(error));return}
    DB.membres.push(mapMembre(data));toast("Membre ajouté");
  }
  openClub(clubId);
  if(dupSpec)setTimeout(()=>toast("⚠️ Spécialité « "+spec+" » déjà présente dans ce club"),1400);
}
async function delMembre(clubId,id){
  const {error}=await sb.from("membres").delete().eq("id",id);
  if(error){toast(rlsMsg(error));return}
  DB.membres=DB.membres.filter(x=>x.id!==id);openClub(clubId);toast("Membre retiré");

async function saveClub(id){
  const g=x=>document.getElementById(x).value;const nom=g("c-nom").trim();if(!nom){toast("Nom requis");return}
  const row={nom,ville:g("c-ville"),animateur_id:g("c-anim")||null,statut:g("c-statut"),objectif:parseInt(g("c-objectif"))||null};
  if(id){
    const {error}=await sb.from("clubs").update(row).eq("id",id);
    if(error){toast(rlsMsg(error));return}
    Object.assign(club(id),mapClub({id,...row}));
  }else{
    const {data,error}=await sb.from("clubs").insert(row).select().single();
    if(error){toast(rlsMsg(error));return}
    DB.clubs.push(mapClub(data));
  }
  await okPuis();closeSheet();render();toast(id?"Club mis à jour":"Club créé");

async function delClub(id){
  if(DB.reunions.some(m=>m.clubId===id)){toast("Des réunions sont rattachées — supprime-les d'abord");return}
  const {error}=await sb.from("clubs").delete().eq("id",id);
  if(error){toast(rlsMsg(error));return}
  DB.clubs=DB.clubs.filter(c=>c.id!==id);
  DB.membres=DB.membres.filter(m=>m.clubId!==id);
  closeSheet();render();toast("Club supprimé");
}

  }else{

async function delAnim(id){

/* ── v0.11 : suivi des adhésions ──
   Une adhésion avance en 3 temps : reçue → intégrée au club → saisie dans le CRM national.
   « En retard » = en attente depuis plus de ADH_DELAI_J jours (à traiter ou à saisir). */
const ADH_DELAI_J=2;
function adhJours(iso){return Math.floor((Date.now()-new Date(iso).getTime())/864e5)}
function adhAge(iso){const j=adhJours(iso);return j<=0?"aujourd'hui":j===1?"hier":"il y a "+j+" j"}
function adhEtape(a){if(a.statut==="rejetee")return-1;return a.saisie_proteine_le?3:a.statut==="integree"?2:1}
function adhEnRetard(a){const e=adhEtape(a);return(e===1||e===2)&&adhJours(a.created_at)>ADH_DELAI_J}
function adhSuivi(a){const e=adhEtape(a);if(e<0)return `<span class="rl-fact">Rejetée</span>`;

    <button class="btn ghost" style="margin-top:14px;width:100%" onclick="openClasseur()">📁 Classeur des PDF</button>

/* ---- Classeur des PDF : par mois de réception, puis par groupe, fichiers nommés
   « NOM Prénom - JJ-MM-AAAA - Groupe.pdf ». Les fichiers restent stockés sous leur id
   (le groupe n'est souvent connu qu'à l'intégration) : le nom lisible est appliqué à
   l'affichage et au téléchargement, il est donc toujours à jour. ---- */
const MOIS_FR=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
function adhGroupe(a){
  const mb=a.membre_id&&DB.membres.find(m=>m.id===a.membre_id);
  const c=mb?club(mb.clubId):(a.ref?club(a.ref):{});
  return c&&c.nom?c.nom:"Sans groupe";
}
function adhDateFr(iso){const d=new Date(iso);return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear()}
function adhMoisCle(iso){const d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function adhNomFichierPropre(t){return String(t||"").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim()}
function adhNomFichier(a){
  const nomPers=((a.data.m_nom||"").toUpperCase()+" "+(a.data.m_prenom||"")).trim()||"Sans nom";
  return adhNomFichierPropre(nomPers+" - "+adhDateFr(a.created_at)+" - "+adhGroupe(a)+(a.statut==="rejetee"?" (rejetée)":""))+".pdf";
}
/* Classeur : TOUTES les demandes reçues avec un PDF, rejetées comprises (trace complète, rien n'est
   jamais effacé : la base n'autorise aucune suppression d'adhésion ni de PDF). Chacun n'y voit que son
   périmètre (RLS cap_peut_voir_adhesion) : animateur = ses clubs, directeur = sa zone, national = tout. */
function adhClasseurListe(){return(DB.adhesions||[]).filter(a=>a.pdf_path)}
let _clsMode="groupe";
function adhPerimetre(){const r=SESSION&&SESSION.role;return r==="animateur"?"tes clubs":r==="directeur"?"ta zone":"tout le réseau"}
function clsLigne(a){return `<div class="rank-row"><span style="font-size:18px">📄</span><div class="rn" style="cursor:pointer" onclick="adhPdf('${a.id}')" title="${esc(adhNomFichier(a))}">${esc(((a.data.m_nom||"").toUpperCase()+" "+(a.data.m_prenom||"")).trim()||"Sans nom")}<small>${adhDateFr(a.created_at).replace(/-/g,"/")} · ${esc(a.data.ent_nom||"")} · ${a.statut==="rejetee"?'<b style="color:var(--muted)">Rejetée</b>':ADH_STATUTS[a.statut]}</small></div><button class="btn ghost mini" onclick="adhTelecharger('${a.id}')" aria-label="Télécharger">⬇</button></div>`}
function clsMoisTitre(m){const [y,mm]=m.split("-");return MOIS_FR[+mm-1]+" "+y}
function clsGrouper(liste,cle){const o={};liste.forEach(a=>{const k=cle(a);(o[k]=o[k]||[]).push(a)});return o}

        ${Object.keys(pm).sort().reverse().map(m=>`<div class="cls-mois">${clsMoisTitre(m)} <em>${pm[m].length}</em></div><div class="rank">${pm[m].sort((x,y)=>y.created_at.localeCompare(x.created_at)).map(clsLigne).join("")}</div>`).join("")}</details>`}).join("");
  }else{

  }

    <div class="seg-sc" style="margin-top:0"><span class="knob" style="transform:translateX(${_clsMode==="mois"?"100%":"0"})"></span><button class="${_clsMode==="groupe"?"on":""}" onclick="openClasseur('groupe')">Par groupe</button><button class="${_clsMode==="mois"?"on":""}" onclick="openClasseur('mois')">Par mois</button></div>
    ${html}
    <p class="fh-note" style="margin-top:12px">Fichiers nommés « NOM Prénom - date - groupe ». Rien n'est jamais effacé : chaque demande reçue reste consultable.</p>

async function adhZip(liste,racine,dossier){

/* Export « prêt à saisir » : une ligne par adhésion pas encore saisie dans le CRM national,
   colonnes dans l'ordre du formulaire officiel. Sert à la saisie en série (voir
   docs/saisie-en-serie-crm-proteine.md) ; le format JSON est lu par l'outil de saisie. */
const ADH_EXPORT_COLS=[["id","Réf. adhésion"],["created_at","Reçue le"],["metier","Métier représenté"],["ent_nom","Nom de l'entreprise"],["ent_ice","ICE"],["ent_nom_legal","Nom légal"],["ent_categorie","Catégorie juridique"],["ent_activite","Activité"],["ent_patente","Patente"],["ent_ville_rcs","Ville RCS"],["ent_capital","Capital social"],["ent_adresse","Adresse"],["ent_cp","Code postal"],["ent_ville","Ville"],["ent_tel","Téléphone"],["ent_web","Site web"],["ent_effectif","Effectif"],["ent_annee","Année de création"],["m_civilite","Civilité"],["m_nom","Nom"],["m_prenom","Prénom"],["m_dirigeant","Dirigeant"],["m_fonction","Fonction"],["m_email","Email"],["m_tel","Téléphone mobile"],["m_tel2","Autre téléphone"],["m_naissance","Date de naissance"],["m_hobbies","Hobbies"],["sig_same","Signataire = membre"],["s_nom","Signataire nom"],["s_prenom","Signataire prénom"],["s_fonction","Signataire fonction"],["s_email","Signataire email"],["s_tel","Signataire mobile"],["reg_mode","Mode de règlement"],["reg_fois","Nombre de versements"],["commentaires","Commentaires"],["fac_same","Facturation = entreprise du membre"],["f_entreprise","Facturation entreprise"],["f_adresse","Facturation adresse"],["f_cpville","Facturation CP / ville"],["club","Club"]];
function adhLigneExport(a){
  const d={...a.data};
  if(d.sig_same){d.s_nom=d.m_nom;d.s_prenom=d.m_prenom;d.s_fonction=d.m_fonction;d.s_email=d.m_email;d.s_tel=d.m_tel}
  if(d.fac_same){d.f_entreprise=d.ent_nom_legal||d.ent_nom;d.f_adresse=d.ent_adresse;d.f_cpville=[d.ent_cp,d.ent_ville].filter(Boolean).join(" ")}
  const oui=v=>v===true||v==="true"?"Oui":v===false||v==="false"?"Non":"";d.sig_same=oui(d.sig_same);d.fac_same=oui(d.fac_same);
  d.reg_mode={cheque:"Chèque",virement:"Virement bancaire"}[d.reg_mode]||d.reg_mode||"";
  if(/^\d{4}-\d{2}-\d{2}$/.test(d.m_naissance||""))d.m_naissance=d.m_naissance.split("-").reverse().join("/");
  d.id=a.id;d.created_at=a.created_at.slice(0,10);d.club=a.ref&&club(a.ref).nom||"";
  return Object.fromEntries(ADH_EXPORT_COLS.map(([k])=>[k,d[k]??""]));

function adhExportSaisie(format){
  const list=adhASaisir();if(!list.length){toast("Rien à saisir : tout est déjà dans le CRM Protéine");return}
  const lignes=list.map(adhLigneExport),jour=new Date().toISOString().slice(0,10);
  const dl=(blob,nom)=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nom;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)};
  const csv="\ufeff"+[ADH_EXPORT_COLS.map(c=>c[1]),...lignes.map(l=>ADH_EXPORT_COLS.map(([k])=>l[k]))].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n");
  // un seul fichier par clic : un second téléchargement simultané est bloqué par les navigateurs
  if(format==="json")dl(new Blob([JSON.stringify(lignes,null,2)],{type:"application/json"}),"adhesions-a-saisir-"+jour+".json");
  else dl(new Blob([csv],{type:"text/csv"}),"adhesions-a-saisir-"+jour+".csv");
  toast(list.length+" adhésion"+(list.length>1?"s":"")+" exportée"+(list.length>1?"s":""));

/* Les menus courts deviennent des pastilles : le <select> reste (caché) et porte la valeur, rien ne change à l'enregistrement. */
function pillify(root){
  if(!root)return;
  root.querySelectorAll("select[data-pills]").forEach(sel=>{
    if(sel.dataset.pilled)return;sel.dataset.pilled="1";sel.classList.add("hidden");
    const box=document.createElement("div");box.className="pills";box.setAttribute("role","radiogroup");
    [...sel.options].forEach(o=>{const b=document.createElement("button");b.type="button";b.className="pill"+(o.value===sel.value?" on":"");
      b.textContent=o.text;b.setAttribute("role","radio");b.setAttribute("aria-checked",o.value===sel.value);
      b.onclick=()=>{sel.value=o.value;box.querySelectorAll(".pill").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-checked",on)});sel.dispatchEvent(new Event("change",{bubbles:true}))};
      box.appendChild(b)});
    sel.after(box);
  });
}

    const sec=t=>{besoin(40);txt(t.toUpperCase(),X,y,{s:10,b:1,c:CR});y-=16};
    sec("L'essentiel");
    const kp=[[d.clubs,"clubs, dont "+d.actifs+" actifs"],[d.membres,"membres"+(d.nouv?" (+"+d.nouv+" ce mois)":"")],[d.tenues,"réunions tenues"],[d.adh,"adhésions reçues"]];
    const kw=(WD-18)/4;kp.forEach(([n,l],i)=>{const x=X+i*(kw+6);page.drawRectangle({x,y:y-40,width:kw,height:46,borderColor:LI,borderWidth:1});txt(String(n),x+8,y-14,{s:17,b:1,c:CR});txt(l,x+8,y-32,{s:8,c:MU})});y-=62;
    sec("Les clubs");
    const cols=[["Club",X,0],["Statut",X+200,0],["Membres",X+300,1],["Réunions",X+360,1],["Invités",X+420,1],["Adhésions",X+WD,1]];
    const ligne=(vals,o={})=>{besoin(18);vals.forEach((v,i)=>{const[,cx,right]=cols[i];const t=pdfTxt(v);const w=(o.b?fb:f).widthOfTextAtSize(t,o.s||9);txt(t,right?cx-w:cx,y,{s:o.s||9,b:o.b,c:o.c})});y-=6;page.drawLine({start:{x:X,y},end:{x:X+WD,y},thickness:.6,color:LI});y-=12};
    ligne(cols.map(c=>c[0]),{s:7.5,b:1,c:MU});
    d.lignes.forEach(l=>ligne([l.c.nom.replace(/^CAP\s+/,""),l.c.statut==="actif"?"actif":"création",l.m+(l.nouv?" (+"+l.nouv+")":""),l.t,l.i,l.a]));
    y-=6;
    const puces=(arr,vide)=>{(arr.length?arr:[vide]).forEach(x=>{const mots=pdfTxt(x).split(" ");let l="";const out=[];mots.forEach(m=>{const t=l?l+" "+m:m;if(f.widthOfTextAtSize(t,9.5)>WD-14){out.push(l);l=m}else l=t});out.push(l);besoin(out.length*13+4);out.forEach((o,i)=>{if(i===0&&arr.length)txt("•",X,y,{s:9.5,c:CR});txt(o,X+12,y,{s:9.5});y-=13});y-=2})};
    sec("À surveiller");puces(d.surv,"Rien de particulier.");y-=8;
    sec(d.suivLib);puces(d.proch,"Aucune réunion planifiée pour l'instant.");
    const pages=doc.getPages();pages.forEach((p,i)=>{p.drawText(pdfTxt("CRM CAP Protéine Maroc · généré le "+new Date().toLocaleDateString("fr-FR")),{x:X,y:34,size:8,font:f,color:MU});p.drawText(`Page ${i+1} / ${pages.length}`,{x:X+WD-50,y:34,size:8,font:f,color:MU})});
    const bytes=await doc.save();const nom=pdfTxt("Rapport CAP "+rpMoisLib(_rp.mois)+" - "+d.perim).replace(/[\/\\:*?"<>|]/g,"-")+".pdf";
    const file=new File([bytes],nom,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:d.titre,text:d.titre+" · "+d.perim});b.textContent=lib;return}catch(e){if(e.name==="AbortError"){b.textContent=lib;return}}}
    const u=URL.createObjectURL(file);const a=document.createElement("a");a.href=u;a.download=nom;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast("Rapport téléchargé");
  }catch(e){console.error(e);toast("Erreur : rapport impossible à générer")}
  b.textContent=lib;
}
/* ---------- 6. Mode présentation ---------- */
let _sh={i:0,t:null};
function showSlides(){
  const d0=jours90(),t90=DB.reunions.filter(r=>tenue(r)&&r.date>=d0);
  const inv=DB.reunions.flatMap(r=>r.guests||[]),cv=pct(inv.filter(g=>g.statut==="Membre").length,inv.length);
  const villes=new Set(DB.clubs.map(c=>c.ville)).size;
  const zs=zonesListe().map(z=>({...z,s:zoneStats(z)})).filter(z=>z.s.clubs);
  const parM=zs.some(z=>z.s.membres),mx=Math.max(1,...zs.map(z=>parM?z.s.membres:z.s.clubs));
  const crea=DB.clubs.filter(c=>c.statut!=="actif"),sansA=crea.filter(c=>!c.animId).length;
  const prochaines=DB.reunions.filter(r=>!isPast(r.date)&&r.statut!=="annulee").sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  const adh30=(DB.adhesions||[]).filter(a=>a.statut!=="rejetee").length;
  const S=[
    `<h3>Le réseau <em>Protéine Maroc</em></h3><div class="sbig"><div><b>${DB.clubs.length}</b><span>clubs dans ${villes} villes</span></div><div><b>${DB.membres.length}</b><span>membres</span></div><div><b>${DB.animateurs.length}</b><span>animateurs</span></div><div><b>${t90.length}</b><span>réunions tenues sur 90 jours</span></div></div>`,
    `<h3>Implanté dans <em>${villes} villes</em></h3><div class="smap">${carteSvg({dark:1,calme:1,hmax:420})}</div>`,
    `<h3>Les zones, <em>côte à côte</em></h3><div class="szl">${zs.map((z,i)=>{const v=parM?z.s.membres:z.s.clubs;return `<div><span>${esc(z.nom)}</span><i style="width:${Math.max(1,v/mx*100)}%;animation-delay:${i*.12}s"></i><b>${v}</b></div>`}).join("")}</div><p style="opacity:.65;margin-top:18px">${parM?"membres":"clubs"} par zone</p>`,
    crea.length?`<h3><em>${crea.length} club${crea.length>1?"s":""}</em> en route vers leur lancement</h3><div class="slist">${crea.slice(0,7).map(c=>`<div><em>${["Création","SI tenue","Actif"][clubEtape(c)]}</em><span>${esc(c.nom.replace(/^CAP\s+/,""))} · ${esc(c.ville)}${c.animId?"":" · animateur à nommer"}</span></div>`).join("")}</div>${sansA?`<p style="opacity:.7;margin-top:16px">Dont ${sansA} en attente d'un animateur.</p>`:""}`:"",
    prochaines.length?`<h3>Les <em>prochaines réunions</em></h3><div class="slist">${prochaines.map(r=>{const d=dObj(r.date);return `<div><em>${d.getDate()} ${MOIS[d.getMonth()]}</em><span>${TYPES[r.type]||r.type} · ${esc(club(r.clubId).nom.replace(/^CAP\s+/,""))}</span></div>`}).join("")}</div>`:"",
    `<h3>La conversion</h3><div class="sbig"><div><b>${inv.length}</b><span>invités suivis</span></div><div><b>${cv==null?"—":cv+" %"}</b><span>devenus membres</span></div><div><b>${adh30}</b><span>adhésions reçues par le lien</span></div><div><b>${DB.membres.filter(m=>m.paiement).length}</b><span>membres à jour du paiement</span></div></div>`
  ].filter(Boolean);
  return S;
}
function openPresentation(){
  closePresentation();
  const o=document.createElement("div");o.className="show-o";o.id="show-o";o.setAttribute("role","dialog");o.setAttribute("aria-label","Mode présentation");
  document.body.appendChild(o);_sh.i=0;showRender();
  try{if(document.documentElement.requestFullscreen&&isWide())document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
  document.addEventListener("keydown",showKey);
}
function showRender(){
  const o=document.getElementById("show-o");if(!o)return;const S=showSlides();_sh.i=(_sh.i+S.length)%S.length;
  o.innerHTML=`<div class="tap"><button aria-label="Diapositive précédente" onclick="showGo(-1)"></button><button aria-label="Diapositive suivante" onclick="showGo(1)"></button></div>
    <div class="h"><span class="mono"><img src="icone-192.png" alt=""></span><span><small>Club d'Affaires</small><b>Protéine Maroc</b></span><span class="clk">${new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span><button class="x" onclick="closePresentation()" aria-label="Quitter la présentation">✕</button></div>
    <div class="sl">${S[_sh.i]}</div>
    <div class="sprog">${S.map((_,i)=>`<i class="${i<_sh.i?"done":i===_sh.i?"on":""}"><b></b></i>`).join("")}</div>`;
  clearTimeout(_sh.t);_sh.t=setTimeout(()=>showGo(1),7000);
}
function showGo(d){_sh.i+=d;showRender()}
function showKey(e){if(e.key==="Escape")closePresentation();else if(e.key==="ArrowRight"||e.key===" ")showGo(1);else if(e.key==="ArrowLeft")showGo(-1)}
function closePresentation(){clearTimeout(_sh.t);const o=document.getElementById("show-o");if(o)o.remove();document.removeEventListener("keydown",showKey);try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}


/* ============================================================
   v0.16 — GRAND ÉCRAN (tableaux) ET PARAMÈTRES
   ============================================================ */
function trOpen(fn,cls){return `class="row ${cls||""}" tabindex="0" onclick="${fn}" onkeydown="if(event.key==='Enter')${fn}"`}
function clubsTable(list){
  return `<div class="tbl tbl-wrap"><table><thead><tr><th>Club</th><th>Animateur</th><th>Statut</th><th class="n">Membres</th><th>Prochaine réunion</th><th class="c">Santé</th><th>À faire</th></tr></thead><tbody>${list.map(c=>{
    const nom=c.nom.replace(/^CAP\s+/,""),nbM=DB.membres.filter(m=>m.clubId===c.id).length,h=clubHealth(c),na=clubNextAction(c),t=clubTone(c);
    const up=DB.reunions.filter(m=>m.clubId===c.id&&!isPast(m.date)&&m.statut!=="annulee").sort((x,y)=>x.date.localeCompare(y.date))[0];
    return `<tr ${trOpen(`openClub('${c.id}')`)}><td><div class="who" style="--vc:${villeColor(c.ville)}"><span class="emb">${esc(initiales(nom))}</span><span><b>${esc(nom)}</b><small>${esc(c.ville)}</small></span></div></td>
      <td class="${c.animId?"":"red"}">${c.animId?esc(animNom(c.animId)):"À nommer"}</td>
      <td><span class="ck-pill ${c.statut==="actif"?"actif":"creation"}">${c.statut==="actif"?"Actif":"En création"}</span></td>
      <td class="n">${miniG(nbM,c.objectif)}</td>
      <td>${up?`<b>${dObj(up.date).getDate()} ${MOIS[dObj(up.date).getMonth()]}</b> <span class="mut">· ${up.type}</span>`:`<span class="red">aucune</span>`}</td>
      <td class="c">${ringSm(h)}</td>
      <td>${na.act?`<button class="act ${t==="urgent"?"":"todo"}" onclick="event.stopPropagation();clubCardAction('${c.id}')">${esc(na.label)} ›</button>`:`<span class="act ok">✓ ${esc(na.label.replace(/\s*✓$/,""))}</span>`}</td></tr>`}).join("")}</tbody></table></div>`;
}
const AG_THEAD=`<thead><tr><th>Date</th><th>Heure</th><th>Club</th><th>Type</th><th>Lieu</th><th>Animateur</th><th>Invités</th><th>Statut</th></tr></thead>`;
function meetingTr(m){
  const c=club(m.clubId),dt=dObj(m.date),past=isPast(m.date),ng=(m.guests||[]).length,nom=(c.nom||"—").replace(/^CAP\s+/,"");
  return `<tr ${trOpen(`openMeeting('${m.id}')`,past?"past":"")}><td class="date"><b>${dt.getDate()}</b><small>${JOURS[dt.getDay()]}</small></td>
    <td class="mut">${esc(m.heure||"—")}</td>
    <td><div class="who" style="--vc:${villeColor(c.ville)}"><span class="emb">${esc(initiales(nom))}</span><span><b>${esc(nom)}</b><small>${esc(c.ville||"")}</small></span></div></td>
    <td><span class="rl-type ${m.type==="RL"?"rl":""}">${m.type}</span></td>
    <td class="${!m.lieuId&&!past?"red":""}">${m.lieuId?esc(lieuNom(m.lieuId)):(past?"—":"À définir")}</td>
    <td>${m.animId?esc(animNom(m.animId)):`<span class="mut">Non attribué</span>`}</td>
    <td>${ng?guestStack(m.guests,ng):`<span class="mut">—</span>`}</td>
    <td><span class="st ${m.statut}">${STATUTS[m.statut]}</span>${past&&(m.statut==="planifiee"||m.statut==="confirmee")&&canEditReunion(m)?` <button class="act todo" onclick="event.stopPropagation();openBilan('${m.id}')">Bilan ›</button>`:""}</td></tr>`;
}
function animsTable(list){
  return `<div class="tbl tbl-wrap"><table><thead><tr><th>Animateur</th><th>Clubs</th><th class="n">Membres</th><th class="n">Réunions à venir</th><th>Téléphone</th></tr></thead><tbody>${list.map(a=>{
    const cs=DB.clubs.filter(c=>c.animId===a.id),nbM=DB.membres.filter(m=>cs.some(c=>c.id===m.clubId)).length,nbUp=DB.reunions.filter(m=>m.animId===a.id&&!isPast(m.date)&&m.statut!=="annulee").length;
    return `<tr ${trOpen(`openAnim('${a.id}')`)}><td><div class="who" style="--vc:${villeColor(a.ville)}"><span class="emb round">${esc(initiales(a.nom))}</span><span><b>${esc(a.nom)}</b><small>${esc(a.ville||"")}</small></span></div></td>
      <td>${cs.length?`<div class="chipz">${cs.map(c=>`<span>${esc(c.nom.replace(/^CAP\s+/,""))}</span>`).join("")}</div>`:`<span class="mut">aucun club</span>`}</td>
      <td class="n">${nbM}</td><td class="n ${nbUp?"":"red"}">${nbUp}</td><td class="mut">${a.tel?esc(fmtTelAff(a.tel)):"—"}</td></tr>`}).join("")}</tbody></table></div>`;
}
function fmtTelAff(t){return String(t).replace(/^\+212/,"0").replace(/(\d{2})(?=\d)/g,"$1 ").trim()}
/* ---------- Thème ---------- */
function themeChoisi(){try{return localStorage.getItem("cap-theme")||"clair"}catch(e){return"clair"}}
function appliquerTheme(){const t=themeChoisi(),d=t==="sombre"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark",d);const m=document.querySelector('meta[name="color-scheme"]');if(m)m.content=d?"dark":"light"}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(themeChoisi()==="auto")appliquerTheme()})}catch(e){}
function choisirTheme(t){try{localStorage.setItem("cap-theme",t)}catch(e){}appliquerTheme();openParametres();toast(t==="clair"?"Mode clair":t==="sombre"?"Mode sombre":"Le thème suit le téléphone")}
/* ---------- Paramètres : tous les réglages au même endroit ---------- */
async function openParametres(){
  const role=SESSION.role,t=themeChoisi(),sa=role==="superadmin";
  const r=(ic,tit,sub,fn)=>`<button class="set-r" onclick="${fn}"><span class="ic">${ic}</span><span class="t"><b>${tit}</b>${sub?`<small>${sub}</small>`:""}</span><span class="go">›</span></button>`;
  const th=(k,l,a,b)=>`<button class="${t===k?"on":""}" onclick="choisirTheme('${k}')" aria-pressed="${t===k}"><i style="background:linear-gradient(135deg,${a} 50%,${b} 50%)"></i>${l}</button>`;
  const ne=await notifEtat().catch(()=>"non");
  const notifLib={actif:"Activées sur cet appareil",inactif:"Désactivées sur cet appareil",refuse:"Bloquées dans le navigateur",ios:"Ajoute d'abord le CRM à l'écran d'accueil",non:"Non disponibles sur cet appareil"}[ne]||"";
  document.getElementById("sheet-content").innerHTML=`
    <h3>Paramètres</h3>
    <div class="set-who"><span class="av" style="background:${roleCouleur(role)}">${esc(initiales(SESSION.name))}</span><span><b>${esc(SESSION.name)}</b><small>${esc(ROLES[role]||role)} · ${esc(document.getElementById("tb-region").textContent)}</small></span></div>
    <div class="set-sec">Apparence</div>
    <div class="set-l"><div class="theme3" role="group" aria-label="Thème">${th("clair","Clair","#FAF6F4","#FFFFFF")}${th("sombre","Sombre","#1A1214","#241A1D")}${th("auto","Comme le téléphone","#FAF6F4","#1A1214")}</div></div>
    ${role!=="visiteur"?`<div class="set-sec">Compte</div><div class="set-l">
      ${ne!=="masque"?r("🔔","Notifications",notifLib,"openNotifs()"):""}
      ${r("🔑","Changer mon mot de passe","","openMyPassword()")}</div>`:""}
    ${sa?`<div class="set-sec">Administration</div><div class="set-l">${r("👥","Comptes et accès","Créer, modifier, réinitialiser","openAccounts()")}${r("💰","Mon rendement","Commissions et objectif annuel","openRendement()")}</div>`:""}
    <div class="set-sec">Aide</div>
    <div class="set-l">${r("🎓","Visite guidée","Revoir l'utilisation du CRM, en entier ou par partie","openAide()")}</div>
    <div class="set-sec">Application</div>
    <div class="set-l">${r("📝","Notes de version","Version "+APP_VERSION,"openChangelog()")}${r("↻","Recharger les données","Récupère les dernières saisies","rechargerDonnees()")}</div>
    <button class="btn ghost set-out" onclick="logout()">Se déconnecter</button>`;
  openSheet();
}
async function rechargerDonnees(){toast("Mise à jour…");try{await loadDB();if(SESSION.role==="animateur"&&SESSION.animId)SESSION.clubIds=DB.clubs.filter(c=>c.animId===SESSION.animId).map(c=>c.id);closeSheet();render();toast("Données à jour")}catch(e){toast("Erreur de mise à jour")}}

/* Comptes : une couleur par rôle. */
function roleCouleur(r){return{superadmin:"#B0122E",directeur_national:"#5C0A18",directeur:"#B8862A",animateur:"#2E7D5B",visiteur:"#8C8085"}[r]||"#8C8085"}
function rolePill(r){return{directeur:"dir",directeur_national:"dir",animateur:"an",visiteur:"vi"}[r]||""}
