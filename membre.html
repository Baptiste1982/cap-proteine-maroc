/* v1.3.0 : #equipe=<club> = la direction (CRM) regarde un groupe comme un membre. On reprend la session du CRM

let MOI=(location.hash.match(/^#moi=([0-9a-f-]{36})(?:&|$)/i)||[])[1]||null;const MOI_SUITE=(location.hash.match(/^#moi=[0-9a-f-]{36}&(.+)$/i)||[])[1]||""; // v1.25 : #moi=<fiche>&r=recues
try{if(MOI)sessionStorage.setItem("cap-moi-crm",MOI);else MOI=sessionStorage.getItem("cap-moi-crm")}catch(e){}

/* ---------- Connexion : mobile + code d'accès donné par l'animateur (fonction membre-acces) ----------

const DOMAINE="membres.cap-proteine.ma";
function telE164(v){let d=String(v||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("212"))return /^212[5-7]\d{8}$/.test(d)?d:null;if(d.startsWith("0"))d=d.slice(1);return /^[5-7]\d{8}$/.test(d)?"212"+d:null}

  if(typeof Lancement!=="undefined")Lancement.fin();

  </div>`;

  (S.telSaisi?$("l-code"):$("l-tel")).focus();

async function seConnecter(){
  S.telSaisi=$("l-tel").value;
  const t=telE164(S.telSaisi),code=$("l-code").value.trim();
  if(!t)return vueLogin({t:"Ce numéro ne ressemble pas à un mobile marocain. Exemple : 06 61 23 45 67."});

  if(error)return vueLogin({t:/invalid|credentials/i.test(error.message)?"Mobile ou code incorrect. Vérifie le code, ou demande-en un nouveau à ton animateur."

}

  if(h==="#d"){history.replaceState(null,"",location.pathname);S.mesDocs=undefined;aller("mesdocs");return true} // v1.45 : notification « une pièce t'attend »
  if(h==="#r=nouvelle"){history.replaceState(null,"",location.pathname);aller("recos",{recoForm:true,recoPour:""});return true}

function reduireImage(file,max){return new Promise((ok,ko)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error("image illisible")),"image/jpeg",.86)};img.onerror=()=>{URL.revokeObjectURL(u);ko(new Error("image illisible"))};img.src=u})}
async function televerser(file,quoi){
  try{const b=await reduireImage(file,quoi==="logo"?500:640);
    if(DEMO){S[quoi==="logo"?"fLogo":"fPhoto"]=URL.createObjectURL(b);return rendu(true)}
    const chemin=`${S.moi.id}/${quoi}-${Date.now()}.jpg`;
    const {error}=await sb.storage.from("profils").upload(chemin,b,{contentType:"image/jpeg",upsert:true});

    S[quoi==="logo"?"fLogo":"fPhoto"]=sb.storage.from("profils").getPublicUrl(chemin).data.publicUrl;
    toast((quoi==="logo"?"Logo":"Photo")+" prêt"+(quoi==="logo"?"":"e")+" : pense à enregistrer ta fiche");rendu(true);
  }catch(e){toast("Envoi impossible : "+(e.message||e))}
}

/* ---------- Notifications sur le téléphone (web push, même service worker que le CRM) ---------- */
const VAPID_PUBLIC="BAKkMOISOmM62avwTzeE81_l592rvg9O-AiLBct4eGf7Xovoy_OswNK0lnQ0yokt6VDoRkL927x4LS5bFYnWbZM";
function notifSupport(){return "serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window}
const estIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const estInstalle=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function b64u(b){const p="=".repeat((4-b.length%4)%4);const r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function notifReg(){if(!notifSupport())return null;try{return await navigator.serviceWorker.register("sw.js")}catch(e){return null}}
async function notifEtat(){
  if(DEMO)return S.notif||"inactif";
  if(!notifSupport())return estIOS()&&!estInstalle()?"ios":"non";
  if(Notification.permission==="denied")return "refuse";
  const reg=await notifReg();const sub=reg&&await reg.pushManager.getSubscription();
  return sub?"actif":"inactif";
}
async function notifActiver(){
  if(DEMO){S.notif="actif";toast("Démonstration : notifications activées");return rendu(true)}
  const reg=await notifReg();if(!reg){toast("Notifications indisponibles sur ce navigateur");return}
  const p=await Notification.requestPermission();
  if(p!=="granted"){S.notif="refuse";toast("Notifications refusées");return rendu(true)}
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
  const j=sub.toJSON();const {data:{user}}=await sb.auth.getUser();
  const {error}=await sb.from("push_abonnements").upsert({user_id:user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,appareil:(navigator.userAgent||"").slice(0,120)},{onConflict:"endpoint"});
  if(error){toast("Abonnement non enregistré : "+error.message);return}
  S.notif="actif";toast("🔔 Tu seras prévenu de chaque nouveau message");rendu(true);
}
async function notifCouper(){
  if(!DEMO){const reg=await notifReg();const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await sb.from("push_abonnements").delete().eq("endpoint",sub.endpoint);await sub.unsubscribe()}}
  S.notif="inactif";toast("Notifications coupées sur ce téléphone");rendu(true);
}

  if(!reduit){const cv=d.querySelector("canvas"),k=devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*k;cv.height=H*k;const g=cv.getContext("2d");g.scale(k,k);
    const C=["#D81B3F","#E0324E","#C8A24C","#5B7FA3","#24502A"],P=Array.from({length:110},(_,i)=>({x:W/2,y:H*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6+3,a:Math.random()*6,va:(Math.random()-.5)*.4,c:C[i%C.length]}));
    const t0=performance.now();(function f(t){const e=t-t0;g.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.38;p.vx*=.99;p.a+=p.va;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.globalAlpha=Math.max(0,1-e/2000);g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);g.restore()}if(e<2000)requestAnimationFrame(f)})(t0)}
  setTimeout(()=>d.classList.add("part"),1900);setTimeout(()=>d.remove(),2300);
}

async function pointer(reunion,code){
  S.presence={etat:"en_cours"};aller("presence");

function vuePresence(){
