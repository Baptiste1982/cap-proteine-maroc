<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light">
<script>/* thème posé avant l'affichage : clair par défaut, sombre ou automatique si choisi dans Paramètres */
(function(){try{var t=localStorage.getItem("cap-theme")||"clair";var d=t==="sombre"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);if(d){document.documentElement.classList.add("dark");document.querySelector('meta[name="color-scheme"]').content="dark"}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CAP · Protéine Maroc — CRM Animation</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B0122E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM Protéine">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#B0122E;--crimson-deep:#5C0A18;--crimson-darker:#3E0710;--crimson-tint:#F8E9EC;
  --gold:#C8A24C;--ink:#1B1416;--muted:#8C8085;--paper:#FAF6F4;--card:#FFFFFF;--line:#ECE3E1;
  --ok:#2E7D5B;--ok-tint:#E5F1EB;--info:#3A5DA8;--info-tint:#E7ECF6;--warn:#B8862A;--warn-tint:#FBF0DA;
  --shadow:0 1px 2px rgba(27,20,22,.04),0 6px 18px rgba(92,10,24,.06);
  --shadow-lg:0 12px 40px rgba(92,10,24,.16);--r:16px;--r-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Inter",system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.45}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.01em;margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.hidden{display:none !important}

/* LOGIN */
.auth{min-height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 85% -10%,rgba(200,162,76,.16),transparent 55%),linear-gradient(155deg,var(--crimson-deep),var(--crimson-darker));
  color:#fff;padding:calc(env(safe-area-inset-top) + 34px) 26px 30px}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:auto}
.mono{width:44px;height:44px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;color:var(--crimson-deep);
  background:linear-gradient(160deg,#fff,#F3E7C9);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.auth-brand small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600}
.auth-brand b{font-family:"Bricolage Grotesque";font-weight:700;font-size:16px}
.mono:has(img){background:#fff}
.mono img{width:82%;height:82%;object-fit:contain;display:block;border-radius:8px}
.auth-hero{padding:38px 0 26px}
.auth-hero .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:14px}
.auth-hero h1{font-size:clamp(32px,9vw,44px);font-weight:800;line-height:1.02}
.auth-hero p{color:rgba(255,255,255,.72);font-size:15px;max-width:34ch;margin:14px 0 0}
.auth-card{background:var(--card);color:var(--ink);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow-lg)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 7px 2px}
.field input,.field select,.field textarea{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;transition:border-color .15s}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--crimson)}
.field.half{display:inline-block;width:calc(50% - 5px);vertical-align:top}
.field.half:first-of-type{margin-right:8px}
.frow{display:flex;gap:10px}
.frow>.field{flex:1 1 0;min-width:0}
.btn{width:100%;padding:15px;border-radius:var(--r-sm);font-weight:700;font-size:15.5px;background:var(--crimson);color:#fff;transition:transform .06s,filter .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.985)}.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--crimson);border:1.5px solid var(--line)}
.btn.mini{width:auto;padding:10px 14px;font-size:13px}
.auth-err{color:#FFD5DA;font-size:13px;font-weight:600;margin:0 0 12px;min-height:0}
.demo-note{margin-top:16px;font-size:12px;color:rgba(255,255,255,.66);text-align:center;line-height:1.7}
.demo-note b{color:#fff}
.demo-chip{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:3px 9px;border-radius:20px;margin:3px;font-size:11.5px;font-weight:500}

/* SHELL */
.app{max-width:760px;margin:0 auto;min-height:100dvh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,246,244,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;flex-direction:column;gap:9px}
.tb-row{display:flex;align-items:center;gap:11px}
.tb-row2{gap:8px}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar .mono{width:38px;height:38px;font-size:19px;box-shadow:none;border:1px solid var(--line)}
.topbar .who{flex:1;min-width:0}
.topbar .who b{font-family:"Bricolage Grotesque";font-weight:700;font-size:15px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who span{font-size:11.5px;color:var(--muted)}
.role-pill{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:20px;background:var(--crimson-tint);color:var(--crimson);white-space:nowrap}
.role-pill.sa{background:var(--crimson);color:#fff}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:#fff}
.icon-btn:active{background:var(--crimson-tint)}

.page{padding:18px 18px 8px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.page-head .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--crimson);font-weight:700}
.page-head h2{font-size:27px;font-weight:800;margin-top:3px}
.page-head p{color:var(--muted);font-size:13.5px;margin:4px 0 0}

/* segmented (scope toggle) */
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--crimson);color:#fff}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 12px}
.stat .n{font-family:"Bricolage Grotesque";font-weight:800;font-size:24px;line-height:1;color:var(--crimson)}
.stat .l{font-size:11px;color:var(--muted);margin-top:5px;font-weight:500}
.stat.link{cursor:pointer;transition:border-color .12s,transform .06s}
.stat.link:active{transform:scale(.97)}
.stat.on{border-color:var(--crimson);box-shadow:inset 0 0 0 1px var(--crimson)}

.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;background:#fff;border:1.5px solid var(--line);color:var(--muted);flex:0 0 auto;transition:all .12s}
.chip.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.filter-select{appearance:none;-webkit-appearance:none;width:100%;padding:12px 38px 12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238C8085' stroke-width='2' stroke-linecap='round'><path d='M4 6l4 4 4-4'/></svg>") no-repeat right 13px center;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:14px;cursor:pointer}
.filter-select:focus{outline:none;border-color:var(--crimson)}

.searchbar{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:14px}
.searchbar input{border:none;flex:1;padding:0;background:none}.searchbar input:focus{outline:none}
.searchbar svg{color:var(--muted);flex:0 0 auto}

.month-label{font-family:"Bricolage Grotesque";font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.month-label:first-child{margin-top:4px}
.month-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* meeting card */
.mtg{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 15px 15px 16px;margin-bottom:11px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;overflow:hidden}
.mtg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--crimson)}
.mtg.rl::before{background:var(--gold)}
.mtg.annulee{opacity:.5}
.mtg.annulee .club{text-decoration:line-through}
.mtg.past{opacity:.66}
.mtg-date{flex:0 0 auto;text-align:center;min-width:46px}
.mtg-date .d{font-family:"Bricolage Grotesque";font-weight:800;font-size:24px;line-height:1}
.mtg-date .m{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-top:2px}
.mtg-date .wd{font-size:10px;color:var(--muted);margin-top:4px}
.mtg-body{flex:1;min-width:0}
.mtg-body .club{font-family:"Bricolage Grotesque";font-weight:700;font-size:15.5px;line-height:1.2}
.mtg-meta{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:7px;font-size:12.5px;color:var(--muted)}
.mtg-meta span{display:inline-flex;align-items:center;gap:5px}
.mtg-meta svg{opacity:.7}
.mtg-meta .tbd{color:var(--crimson);font-weight:600}
.mtg-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badges{display:flex;gap:5px;flex:0 0 auto}
.badge{font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.badge.si{background:var(--crimson-tint);color:var(--crimson)}
.badge.rl{background:#F6EED9;color:#8A6A1C}
.st{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.st.planifiee{background:#F0ECEC;color:var(--muted)}
.st.confirmee{background:var(--ok-tint);color:var(--ok)}
.st.realisee{background:var(--info-tint);color:var(--info)}
.st.annulee{background:var(--crimson-tint);color:var(--crimson)}
.guest-count{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--crimson);font-weight:600;margin-top:8px;background:var(--crimson-tint);padding:3px 9px;border-radius:20px}

/* tiles */
.grid{display:grid;gap:11px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.tile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tile h3{font-size:16px;font-weight:700}
.tile .sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block}
.hdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle;flex:0 0 auto}
.hpct{font-family:"Bricolage Grotesque";font-weight:800;font-size:13px;flex:0 0 auto}
.hdot.ok,.hpct.ok{color:var(--ok)}.hdot.ok{background:var(--ok)}
.hdot.warn,.hpct.warn{color:var(--warn)}.hdot.warn{background:var(--warn)}
.hdot.bad,.hpct.bad{color:var(--crimson)}.hdot.bad{background:var(--crimson)}
.health-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);margin-bottom:14px}
.health-banner .hbig{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;flex:0 0 auto}
.health-banner .hna{flex:1;min-width:0;font-size:13px}
.health-banner .hna b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;opacity:.75}
.health-banner.ok{background:var(--ok-tint)}.health-banner.ok .hbig,.health-banner.ok b{color:var(--ok)}
.health-banner.warn{background:var(--warn-tint)}.health-banner.warn .hbig,.health-banner.warn b{color:var(--warn)}
.health-banner.bad{background:var(--crimson-tint)}.health-banner.bad .hbig,.health-banner.bad b{color:var(--crimson)}
.tile-foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tag.crim{background:var(--crimson-tint);color:var(--crimson);border-color:transparent}
.tag.empty{background:var(--warn-tint);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--ok-tint);color:var(--ok);border-color:transparent}
.avatar{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:700;font-size:16px;color:#fff;background:linear-gradient(160deg,var(--crimson),var(--crimson-deep))}

/* club card premium */
.club-card{position:relative;overflow:hidden;padding:15px 15px 14px;border-left:4px solid var(--vc)}
.club-card::before{content:"";position:absolute;top:0;left:0;right:0;height:52px;background:linear-gradient(180deg,var(--vc),transparent);opacity:.07;pointer-events:none}
.cc-head{display:flex;align-items:center;gap:11px;position:relative}
.cc-emblem{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:14px;color:#fff;background:var(--vc);box-shadow:0 4px 12px rgba(0,0,0,.14)}
.cc-title{flex:1;min-width:0}
.cc-title h3{font-size:15.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-health{flex:0 0 auto;font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;padding:3px 9px;border-radius:20px;line-height:1.2}
.cc-health small{font-size:10px;font-weight:700}
.cc-health.ok{background:var(--ok-tint);color:var(--ok)}
.cc-health.warn{background:var(--warn-tint);color:var(--warn)}
.cc-health.bad{background:var(--crimson-tint);color:var(--crimson)}
.cc-progwrap{margin-top:13px}
.cc-prog{height:7px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.cc-prog i{display:block;height:100%;border-radius:6px;background:var(--vc);transition:width .3s}
.cc-proglbl{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:5px}
.cc-stats{display:flex;align-items:center;gap:14px;margin-top:13px;font-size:12.5px;color:var(--muted);font-weight:500;flex-wrap:wrap}
.cc-stats span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.cc-stats svg{opacity:.7;flex:0 0 auto}
.cc-anim{color:var(--crimson);font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
/* ---- Carte club v0.8.0 ---- */
.ck{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px;box-shadow:0 1px 2px rgba(27,20,22,.04),0 8px 24px -16px rgba(27,20,22,.18);cursor:pointer;overflow:hidden;
  animation:rise .42s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*40ms);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s;-webkit-tap-highlight-color:transparent}
.ck::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--vc)}
.ck:active{transform:scale(.985)}
@media (hover:hover){.ck:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--vc) 45%,var(--line));box-shadow:0 14px 30px -16px rgba(27,20,22,.35)}}
.ck-top{display:flex;align-items:center;gap:12px}
.ck-emb{width:44px;height:44px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;font:800 15px "Bricolage Grotesque",sans-serif;color:#fff;background:var(--vc);box-shadow:0 6px 14px -6px var(--vc)}
.ck-id{flex:1;min-width:0}
.ck-id h3{font:700 16px/1.2 "Bricolage Grotesque",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.ck-id .ck-sub{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--muted);min-width:0}
.ck-pill{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:99px}
.ck-pill.actif{background:var(--ok-tint);color:var(--ok)}
.ck-pill.creation{background:#F6EED9;color:#8A6A1E}
.ck-ring{position:relative;width:46px;height:46px;flex:0 0 auto}
.ck-ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ck-ring circle{fill:none;stroke-width:5}
.ck-ring .tr{stroke:var(--paper)}
.ck-ring .fg{stroke-linecap:round;stroke-dasharray:113.1;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ck-ring.ok .fg{stroke:var(--ok)}.ck-ring.warn .fg{stroke:var(--warn)}.ck-ring.bad .fg{stroke:var(--crimson)}
.ck-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 13px "Bricolage Grotesque",sans-serif;color:var(--ink)}
.ck-ring b small{font-size:8px;margin-left:1px}
.ck-who{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;font-weight:600;color:var(--ink);min-width:0}
.ck-who span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-who.none{color:var(--crimson)}
.ck-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.ck-k{background:var(--paper);border-radius:12px;padding:8px 10px;min-width:0}
.ck-k .v{font:800 16px/1.15 "Bricolage Grotesque",sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-k .v small{font:600 11px Inter,sans-serif;color:var(--muted)}
.ck-k .l{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-k.none .v{color:var(--muted);font-size:13px;padding-top:2px}
.ck-av{flex:0 0 auto;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--vc);color:#fff;font:700 9px Inter,sans-serif}
.ck-who.none .ck-av{background:var(--crimson-tint);color:var(--crimson)}
.ck-prog{height:5px;border-radius:5px;background:var(--paper);overflow:hidden;margin-top:10px}
.ck-prog i{display:block;height:100%;background:var(--vc);border-radius:5px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .2s backwards}
.ck-act{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;padding:9px 11px;border-radius:12px;border:0;font:600 13px Inter,sans-serif;text-align:left;cursor:pointer;transition:filter .15s,transform .1s}
.ck-act:active{transform:scale(.98)}
.ck-act .ic{flex:0 0 auto;font-size:14px}.ck-act .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ck-act .go{flex:0 0 auto;font-size:16px;opacity:.6}
.ck-act.todo{background:var(--warn-tint);color:var(--warn)}
.ck-act.urgent{background:var(--crimson-tint);color:var(--crimson)}
.ck-act.ok{background:var(--ok-tint);color:var(--ok);cursor:default}
@media (hover:hover){.ck-act.todo:hover,.ck-act.urgent:hover{filter:brightness(.97)}}
@media (prefers-reduced-motion:reduce){.ck,.ck-prog i{animation:none!important}.ck-ring .fg{transition:none}}
/* ── v0.9 : lignes compactes (mobile) — une ligne par club / réunion / lieu / animateur, détail au toucher ── */
.rl{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.rl-row{animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),14)*30ms)}
.rl-row+.rl-row{border-top:1px solid var(--line)}
.rl-row.past{opacity:.6}.rl-row.annulee .rl-t b{text-decoration:line-through;color:var(--muted)}
.rl-h{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;text-align:left;transition:background .15s}
.rl-h:active{background:var(--crimson-tint)}
@media (hover:hover){.rl-h:hover{background:#FCF7F6}}
.rl-emb{width:36px;height:36px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font:800 12.5px "Bricolage Grotesque",sans-serif;color:#fff;background:var(--vc);box-shadow:0 4px 10px -5px var(--vc)}
.rl-emb.round{border-radius:50%}
.rl-t{flex:1;min-width:0}
.rl-t b{display:block;font:700 14.5px/1.2 "Bricolage Grotesque",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-t small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden}
.rl-no{color:var(--crimson);font-weight:600}
.rl-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}.rl-dot.ok{background:var(--ok)}.rl-dot.warn{background:var(--warn)}
.rl-ind{flex:0 0 auto;display:flex;align-items:center;gap:9px}
.rl-chev{flex:0 0 auto;color:#D9CDCB;font-size:19px;line-height:1;transition:transform .3s cubic-bezier(.2,.8,.2,1),color .2s}
.rl-row.open .rl-chev{transform:rotate(90deg);color:var(--crimson)}
.mg{width:40px;display:block}
.mg .v{display:block;font:700 11.5px "Bricolage Grotesque",sans-serif;text-align:right}
.mg .v small{color:var(--muted);font:600 9.5px Inter,sans-serif}
.mg .b{display:block;height:4px;border-radius:4px;background:var(--paper);overflow:hidden;margin-top:3px}
.mg .b i{display:block;height:100%;background:var(--vc);border-radius:4px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .15s backwards}
.rs{width:28px;height:28px;position:relative;flex:0 0 auto}
.rs svg{width:28px;height:28px;transform:rotate(-90deg)}
.rs circle{fill:none;stroke-width:3.5}.rs .tr{stroke:var(--paper)}
.rs .fg{stroke-linecap:round;stroke-dasharray:69.1;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.rs.ok .fg{stroke:var(--ok)}.rs.warn .fg{stroke:var(--warn)}.rs.bad .fg{stroke:var(--crimson)}
.rs b{position:absolute;inset:0;display:grid;place-items:center;font:800 8.5px "Bricolage Grotesque",sans-serif}
.rl-flag{flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.rl-flag.urgent{background:var(--crimson);animation:pulse 2s infinite}
.rl-flag.todo{background:var(--warn)}
.rl-flag.ok{background:transparent}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(176,18,46,.45)}70%{box-shadow:0 0 0 7px rgba(176,18,46,0)}100%{box-shadow:0 0 0 0 rgba(176,18,46,0)}}
.rl-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}
.rl-row.open .rl-x{grid-template-rows:1fr}
.rl-x>div{overflow:hidden}
.rl-in{padding:0 12px 12px 59px;display:grid;gap:8px;opacity:0;transform:translateY(-4px);transition:opacity .25s .05s,transform .25s .05s}
.rl-row.open .rl-in{opacity:1;transform:none}
.rl-in .ck-act{margin-top:0}
.rl-facts{display:flex;flex-wrap:wrap;gap:6px}
.rl-fact{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--paper);color:var(--ink);white-space:nowrap}
.rl-fact.g{background:var(--ok-tint);color:var(--ok)}.rl-fact.y{background:#F6EED9;color:#8A6A1E}
.rl-fact.link{cursor:pointer}.rl-fact.link:active{background:var(--crimson-tint)}
.rl-links{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;font-weight:600}
.rl-links button,.rl-links a{color:var(--crimson);text-decoration:none;padding:2px 0}
.rl-date{width:40px;flex:0 0 auto;text-align:center;border-radius:11px;background:var(--paper);padding:5px 0;border-top:3px solid var(--vc)}
.rl-date b{display:block;font:800 17px/1 "Bricolage Grotesque",sans-serif}
.rl-date small{font-size:9.5px;font-weight:700;color:var(--crimson);text-transform:uppercase}
.rl-type{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--crimson-tint);color:var(--crimson)}
.rl-type.rl{background:#F6EED9;color:#8A6A1E}
.rl-guests{font-size:11px;font-weight:600;color:var(--muted)}
.rl-ind .st{font-size:10.5px;padding:3px 8px}
.rl-thumb{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--vc),color-mix(in srgb,var(--vc) 45%,#fff));background-size:cover;background-position:center}
.rl-gps{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--paper);color:var(--muted)}
.rl-gps.ok{background:var(--ok-tint);color:var(--ok)}
.chip em{font-style:normal;font-size:11px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--paper);color:var(--muted)}
.chip.on em{background:rgba(255,255,255,.2);color:inherit}
.nav button{position:relative}
.nav-badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--crimson);color:#fff;font:700 9.5px/16px Inter,sans-serif;text-align:center;animation:pop .4s cubic-bezier(.2,.8,.2,1)}
@media(min-width:900px){.nav-badge{position:static;margin-left:auto}}
.seg-sc{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#EFE4E2;border-radius:99px;padding:4px;margin:4px 0 14px}
.seg-sc .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:#fff;box-shadow:0 2px 8px -2px rgba(60,10,20,.25);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.seg-sc button{position:relative;z-index:1;padding:8px 6px;border-radius:99px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.seg-sc button.on{color:var(--ink)}
.dash-todo{margin-bottom:14px}.dash-todo.ok{font-size:13px;font-weight:600;color:var(--ok);background:var(--ok-tint);border-radius:12px;padding:10px 12px}
.dt-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;flex:0 0 auto;background:var(--warn-tint)}
.dt-ic.urgent{background:var(--crimson-tint)}
.funnel{display:flex;align-items:flex-end;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 10px}
.fn-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;border-radius:10px;padding:2px 0}
.fn-col:active{background:var(--crimson-tint)}
.fn-col b{font:800 13px "Bricolage Grotesque",sans-serif}
.fn-col i{display:block;width:100%;max-width:46px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--crimson),var(--crimson-deep));transform-origin:bottom;animation:growy .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms + .1s)}
.fn-col small{font-size:9.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15;min-height:22px}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
/* ── v0.10 : fiches ── */
.fh{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.fh .fh-emb{width:50px;height:50px;border-radius:15px;font-size:16px}
.fh .fh-emb.round{border-radius:50%}
.fh-t{flex:1;min-width:0}
.fh-t h3{margin:0;font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh-sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12.5px;color:var(--muted)}
.fh .fh-date{width:50px;padding:7px 0}.fh .fh-date b{font-size:20px}
.fh .st{flex:0 0 auto}
.fh-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px;animation:rise .4s cubic-bezier(.2,.8,.2,1) .05s backwards}
.fh-k{background:var(--paper);border-radius:12px;padding:8px 10px;min-width:0}
.fh-k b{display:block;font:800 17px/1.15 "Bricolage Grotesque",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh-k b small{display:inline;margin:0;font:600 11px Inter,sans-serif;color:var(--muted)}
.fh-k small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh-k.warn b{color:var(--warn)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sec-h em{font-style:normal;color:var(--crimson)}
.sec-h .btn{text-transform:none;letter-spacing:0}
.fh-empty{color:var(--muted);font-size:13px;text-align:center;padding:12px 0;margin:0}
.fh-note{font-size:12px;color:var(--muted);margin:8px 2px 0}
.fh-funnel{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.fh-link{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;border-radius:14px;background:var(--crimson-tint)}
.fh-link>div{flex:1;min-width:0}
.fh-link b{display:block;font-size:12.5px;color:var(--crimson)}
.fh-link small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh-link .btn{flex:0 0 auto;background:#fff}
.rl-emb.sm{width:30px;height:30px;font-size:11px;border-radius:9px}.rl-emb.sm.round{border-radius:50%}
.sheet .rl{box-shadow:none}
.dots4{display:inline-flex;gap:3px}
.dots4 i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s}
.dots4 i.on{background:var(--ok)}
.stp-bar{height:6px;border-radius:6px;background:var(--paper);overflow:hidden;margin:0 0 10px}
.stp-bar i{display:block;height:100%;border-radius:6px;background:var(--ok);transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .1s backwards}
.stp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.stp{position:relative;display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s,transform .12s;min-width:0}
.stp:active{transform:scale(.97)}
.stp input{position:absolute;opacity:0;pointer-events:none}
.stp-ic{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--paper);font-size:13px;transition:background .2s}
.stp-l{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp.on,.stp:has(input:checked){background:var(--ok-tint);border-color:transparent;color:var(--ok)}
.stp.on .stp-ic,.stp:has(input:checked) .stp-ic{background:#fff}
.stp:has(input:focus-visible){outline:2px solid var(--crimson);outline-offset:2px}
div.stp{cursor:default}
.icon-btn{position:relative}
.cls-dos{border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px;overflow:hidden}
.cls-dos>summary{display:flex;align-items:center;gap:11px;padding:10px 12px;cursor:pointer;list-style:none}
.cls-dos>summary::-webkit-details-marker{display:none}
.cls-dos>summary .btn{flex:0 0 auto}
.cls-dos[open]>summary{border-bottom:1px solid var(--line)}
.cls-dos .rank{border:0;border-radius:0;box-shadow:none}
.cls-mois{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.cls-mois em,.cls-mtitre em{font-style:normal;color:var(--crimson)}
.cls-mtitre{display:flex;align-items:center;gap:8px;font:800 17px "Bricolage Grotesque",sans-serif;color:var(--crimson-deep);margin:16px 2px 6px}
.cls-mtitre em{font:600 12px Inter,sans-serif;flex:1}
.icon-btn.on{color:var(--crimson)}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--crimson);box-shadow:0 0 0 2px var(--card);animation:pulse 2s infinite}
.notif-ios{margin:10px 0 4px;padding-left:20px;font-size:13.5px;line-height:1.5}
.notif-ios li{margin-bottom:6px}
.adh-steps{display:inline-flex;gap:3px}
.adh-steps i{width:12px;height:5px;border-radius:3px;background:var(--line)}
.adh-steps i.on{background:var(--ok)}
.adh-age{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.adh-age.late{color:var(--crimson)}
.adh-legend{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--muted);margin:8px 2px 0}
.adh-legend b{color:var(--crimson)}
.adh-track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 12px}
.adh-track div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.adh-track i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line);font-size:12px;font-weight:700}
.adh-track div.on{color:var(--ok)}.adh-track div.on i{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .4s cubic-bezier(.2,.8,.2,1) backwards}
@media (prefers-reduced-motion:reduce){.fh-kpis,.stp-bar i{animation:none!important}}
@media(max-width:899px){.dash .stats{gap:8px;margin-bottom:10px}.dash .stat{padding:10px 10px 9px}.dash .stat .n{font-size:22px}.dash .stat .l{font-size:11px;line-height:1.25}}
@media (prefers-reduced-motion:reduce){.rl-row,.mg .b i,.fn-col i,.nav-badge{animation:none!important}.rl-flag.urgent{animation:none}.rs .fg,.rl-x,.rl-in,.rl-chev,.seg-sc .knob{transition:none}}

/* lieu card */
.lieu-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;transition:transform .1s,box-shadow .15s}
.lieu-card:active{transform:scale(.99)}
.lieu-photo{position:relative;height:132px;background:linear-gradient(150deg,var(--crimson),var(--crimson-deep) 60%,var(--crimson-darker));background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:13px}
.lieu-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(27,20,22,.62),rgba(27,20,22,.05) 55%,transparent)}
.lieu-photo .lieu-name{position:relative;z-index:1;color:#fff;font-family:"Bricolage Grotesque";font-weight:800;font-size:18px;line-height:1.15;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.lieu-photo .cap-badge{position:absolute;top:11px;right:11px;z-index:1;background:rgba(255,255,255,.92);color:var(--crimson);font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.lieu-photo .pin-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);color:rgba(255,255,255,.28);z-index:0}
.lieu-map{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;z-index:0}
.lieu-info{padding:12px 15px 14px}
.lieu-info .sub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lieu-info .foot{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center}
.map-embed{width:100%;height:150px;border:0;border-radius:12px;margin-top:12px;background:#eee}

/* empty */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{opacity:.32;margin-bottom:12px}
.empty b{display:block;color:var(--ink);font-family:"Bricolage Grotesque";font-weight:700;font-size:16px;margin-bottom:5px}
.empty p{font-size:13.5px;margin:0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + min(env(safe-area-inset-bottom), 8px));max-width:760px;margin:0 auto;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;box-shadow:0 -2px 12px rgba(27,20,22,.05)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10px;font-weight:600;border-radius:12px;transition:color .15s}
.nav button.on{color:var(--crimson)}
.nav button svg{width:22px;height:22px}

.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:18px;background:var(--crimson);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(176,18,46,.4);transition:transform .08s}
.fab:active{transform:scale(.92)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
.sheet-wrap.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(27,20,22,.42);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));max-height:93dvh;overflow-y:auto;animation:slideup .28s cubic-bezier(.16,1,.3,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet-grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 16px}
.sheet h3{font-size:20px;font-weight:800;margin-bottom:4px}
.sheet .sheet-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.sheet-actions{display:flex;gap:10px;margin-top:10px}
.sheet-actions .btn{flex:1}
.del-link{text-align:center;color:var(--crimson);font-weight:600;font-size:13.5px;padding:14px;margin-top:2px}
.divider{height:1px;background:var(--line);margin:18px -20px}

/* detail rows */
.drow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:none}
.drow .ic{width:34px;height:34px;border-radius:9px;background:var(--crimson-tint);color:var(--crimson);display:grid;place-items:center;flex:0 0 auto}
.drow .tx{flex:1;min-width:0}
.drow .tx .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.drow .tx .v{font-size:14.5px;font-weight:500;margin-top:1px}
.drow a{color:var(--crimson);font-weight:600;text-decoration:none;font-size:13px}

/* guests */
.guest{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.guest:last-child{border-bottom:none}
.guest .gav{width:34px;height:34px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);flex:0 0 auto}
.guest .gi{flex:1;min-width:0}
.guest .gi b{font-size:14px;font-weight:600;display:block}
.guest .gi small{font-size:11.5px;color:var(--muted)}
.gstat{border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600;background:#fff;flex:0 0 auto}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1.5px dashed var(--line);border-radius:var(--r-sm);color:var(--muted);font-weight:600;font-size:13.5px;margin-bottom:14px}
.photo-prev{width:100%;height:150px;object-fit:cover;border-radius:var(--r-sm);margin-bottom:12px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow-lg);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}

/* version + maj */
.verpill{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--paper);border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.update-bar{position:fixed;right:12px;left:auto;bottom:calc(92px + env(safe-area-inset-bottom));width:auto;max-width:min(340px,calc(100vw - 24px));z-index:40;background:var(--crimson);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);animation:slideup .3s cubic-bezier(.16,1,.3,1)}
.update-bar .ub-t{font-size:13.5px;font-weight:600;flex:1;line-height:1.3}
.update-bar button{background:#fff;color:var(--crimson);font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;flex:0 0 auto}
/* changelog */
.cl-ver{margin:18px 0 10px;display:flex;align-items:baseline;gap:10px}
.cl-ver b{font-family:"Bricolage Grotesque";font-weight:800;font-size:17px}
.cl-ver span{font-size:12px;color:var(--muted)}
.cl-grp{margin:0 0 12px}
.cl-grp .h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.cl-grp.add .h{color:var(--ok)}.cl-grp.mod .h{color:var(--info)}.cl-grp.fix .h{color:var(--warn)}
.cl-grp ul{margin:0;padding-left:18px}
.cl-grp li{font-size:13.5px;margin-bottom:4px;line-height:1.4}
/* dashboard */
.dash-band{font-family:"Bricolage Grotesque";font-weight:800;font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--crimson);margin:20px 0 12px;display:flex;align-items:center;gap:10px}
.dash-band:first-child{margin-top:2px}
.dash-band::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--crimson-tint),transparent)}
.dash-band.reg{color:var(--gold)}.dash-band.reg::after{background:linear-gradient(90deg,#F6EED9,transparent)}
.rank{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-top:2px}
.rank-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.rank-row:last-child{border-bottom:none}
.rank-row .rn{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .rn small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.rank-row .rv{font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;color:var(--crimson);flex:0 0 auto}
.bar{height:6px;border-radius:6px;background:var(--crimson-tint);overflow:hidden;flex:0 0 90px;max-width:90px}
.bar i{display:block;height:100%;background:var(--crimson)}
/* ---- Synthèse cliquable + micro-animations (v0.7.0) ---- */
.dash .stat.link,.dash .rank-row.link{cursor:pointer;-webkit-tap-highlight-color:transparent}
.dash .stat.link{position:relative;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s}
.dash .stat.link::after{content:"›";position:absolute;top:9px;right:11px;font-size:16px;line-height:1;color:var(--line);transition:color .18s,transform .18s}
.dash .stat.link:active{transform:scale(.96)}
.dash .rank-row.link{position:relative;transition:background .15s}
.dash .rank-row.link::after{content:"›";flex:0 0 auto;margin-left:2px;font-size:18px;line-height:1;color:var(--line);transition:color .15s,transform .15s}
.dash .rank-row.link:active{background:var(--crimson-tint)}
@media (hover:hover){
  .dash .stat.link:hover{transform:translateY(-2px);border-color:var(--crimson);box-shadow:0 8px 20px -10px rgba(176,18,46,.35)}
  .dash .stat.link:hover::after{color:var(--crimson);transform:translateX(2px)}
  .dash .rank-row.link:hover{background:var(--crimson-tint)}
  .dash .rank-row.link:hover::after{color:var(--crimson);transform:translateX(2px)}
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.dash .stat,.dash .rank{animation:rise .42s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.dash .bar i{transform-origin:left center;animation:grow .7s cubic-bezier(.2,.8,.2,1) .15s backwards}
.nav button.on svg{animation:pop .32s ease}
.drill-row{cursor:pointer;transition:background .15s}
.drill-row:active,.drill-row:hover{background:var(--crimson-tint)}
@media (prefers-reduced-motion:reduce){.dash .stat,.dash .rank,.dash .bar i,.nav button.on svg,.page{animation:none!important}.dash .stat.link{transition:none}}

/* ===== DESKTOP / PC (≥ 900px) : barre latérale + contenu large + fiches en panneau droit ===== */
@media(min-width:900px){
  .nav{top:0;bottom:0;left:0;right:auto;width:216px;max-width:none;height:100dvh;margin:0;
    flex-direction:column;justify-content:flex-start;align-items:stretch;gap:5px;
    padding:22px 12px;border-top:none;border-right:1px solid var(--line);box-shadow:none}
  .nav::before{content:"";display:block;height:58px;margin:0 10px 14px;background:url(logo-proteine.png) left center/contain no-repeat}
  .nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:13px;padding:11px 14px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink)}
  .nav button svg{width:20px;height:20px;color:var(--muted)}
  .nav button.on{background:var(--crimson-tint);color:var(--crimson)}
  .nav button.on svg{color:var(--crimson)}
  .app{margin:0 auto 0 216px;max-width:1180px;min-height:100dvh;padding-bottom:24px}
  .topbar{flex-direction:row;align-items:center;gap:16px;padding:14px 26px}
  .tb-row2{margin-left:auto}
  .fab{right:34px;bottom:34px;left:auto}
  .page{padding:22px 26px 10px}
  .grid.two{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:repeat(3,1fr)}
  /* fiches = panneau latéral droit */
  .sheet{top:0;bottom:0;right:0;left:auto;margin:0;width:460px;max-width:90vw;height:100dvh;max-height:none;border-radius:0;padding:22px 24px calc(24px + env(safe-area-inset-bottom));animation:slidein .28s cubic-bezier(.16,1,.3,1)}
  .sheet-grip{display:none}
  .divider{margin-left:-24px;margin-right:-24px}
  /* login centré */
  .auth{align-items:center;justify-content:center}
  .auth-brand,.auth-hero,.auth-card,.demo-note{max-width:440px;margin-left:auto;margin-right:auto;width:100%}
  .auth-brand{margin-bottom:22px}
  .auth-hero{padding:22px 0}
}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}

/* ===== v0.14 — FINITIONS (maquette v3) ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--gold-tint:#F6EED9;--hover:#FCF7F6;--soft:#EFE4E2;--topbar:rgba(250,246,244,.95);color-scheme:light}
/* formulaires : pastilles, aperçu, coche */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:9px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted);transition:background .2s var(--ease),color .2s,border-color .2s,transform .2s var(--ease)}
.pill.on{background:var(--crimson);border-color:var(--crimson);color:#fff;transform:scale(1.03)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--crimson);box-shadow:0 0 0 4px var(--crimson-tint)}
.mprev{border:1.5px dashed var(--line);border-radius:16px;padding:6px;margin-bottom:16px}
.mprev .lab{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:2px 6px 6px}
.mprev .rl-row{animation:none;margin:0}
.btn.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.btn .chk{width:20px;height:20px}.btn .chk path{stroke-dasharray:30;stroke-dashoffset:30;animation:drawk .45s var(--ease) forwards}
@keyframes drawk{to{stroke-dashoffset:0}}
/* transitions entre onglets, chargement, tirer pour rafraîchir */
.page.slide-next{animation:slideNx .35s var(--ease)}.page.slide-prev{animation:slidePv .35s var(--ease)}
@keyframes slideNx{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slidePv{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.sk{border-radius:16px;background:linear-gradient(90deg,var(--line) 0%,var(--paper) 50%,var(--line) 100%);background-size:200% 100%;animation:shine 1.2s linear infinite;height:62px;margin-bottom:8px}
.sk.sm{height:78px}.sk.t{height:28px;width:55%;border-radius:10px;margin-bottom:14px}
.sk-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.sk-row .sk{margin:0}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);z-index:25;transform:translate(-50%,-60px);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);font-size:12.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.ptr.on{opacity:1}
.spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--crimson);border-radius:50%}
.ptr.go .spin{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* messages colorés */
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px 10px 10px;max-width:calc(100vw - 32px);white-space:normal}
.toast i{font-style:normal;flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--ok)}
.toast.w i{background:#B07A12}.toast.e i{background:var(--crimson)}
.toast.show{animation:tin .35s var(--ease)}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(12px) scale(.96)}to{opacity:1;transform:translateX(-50%)}}
/* connexion */
.auth-brand,.auth-hero .eyebrow,.auth-hero h1,.auth-hero p,.auth-card,.demo-note{animation:rise .5s var(--ease) backwards}
.auth-hero .eyebrow{animation-delay:.05s}.auth-hero h1{animation-delay:.1s}.auth-hero p{animation-delay:.15s}.auth-card{animation-delay:.2s}.demo-note{animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pw-wrap{position:relative}.pw-wrap input{padding-right:64px}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:8px;color:var(--muted);font-size:12.5px;font-weight:700}
.auth-card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.auth-err:not(:empty){display:flex;align-items:center;gap:6px;color:var(--crimson);background:var(--crimson-tint);padding:9px 11px;border-radius:10px}
/* agenda : bande de jours, invités en pastilles, repère aujourd'hui */
.week{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 14px;padding:2px 18px}
.week::-webkit-scrollbar{display:none}
.day{flex:0 0 46px;border-radius:14px;padding:7px 0 8px;text-align:center;background:var(--card);border:1px solid var(--line);transition:background .2s var(--ease),border-color .2s,color .2s}
.day small{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day b{display:block;font:800 17px "Bricolage Grotesque",sans-serif;margin-top:1px}
.day .dots{display:flex;justify-content:center;gap:3px;height:6px;margin-top:4px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--crimson)}
.day.today{border-color:var(--crimson)}.day.today small{color:var(--crimson)}
.day.on{background:var(--crimson);border-color:var(--crimson);color:#fff}.day.on small{color:rgba(255,255,255,.78)}.day.on .dots i{background:#fff}
.gp{display:inline-flex;align-items:center}.gp span{width:20px;height:20px;border-radius:50%;border:2px solid var(--card);margin-left:-6px;display:grid;place-items:center;font:700 8.5px Inter,sans-serif;color:#fff}
.gp span:first-child{margin-left:0}.gp span.more{background:var(--soft);color:var(--muted)}
.nowline{display:flex;align-items:center;gap:6px;margin:6px 2px 8px;font-size:11px;font-weight:700;color:var(--crimson)}
.nowline::after{content:"";flex:1;height:2px;background:var(--crimson);border-radius:2px;opacity:.45}
/* synthèse vivante */
.hello{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#B0122E,#5C0A18);color:#fff;margin-bottom:14px;position:relative;overflow:hidden;animation:rise .45s var(--ease) backwards}
.hello::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(200,162,76,.25)}
.hello b{display:block;font:800 17px "Bricolage Grotesque",sans-serif}.hello small{opacity:.85;font-size:12.5px}
.hello .n{font:800 30px "Bricolage Grotesque",sans-serif;color:#F3D88E;position:relative;z-index:1}
.stat .tr{font-size:10.5px;font-weight:700;color:var(--ok);margin-top:3px}
.goal{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:10px 12px;border-radius:14px;background:var(--gold-tint);margin-bottom:12px}
.goal b{font-size:13px}.goal small{display:block;font-size:11.5px;color:var(--muted)}
.spark-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.spark-c .h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted)}
.spark-c svg{width:100%;height:64px;overflow:visible;display:block;margin-top:6px}
.spark-c path.l{fill:none;stroke:var(--crimson);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:drawl 1.2s var(--ease) .2s forwards}
.spark-c path.a{opacity:0;animation:fadein .6s .9s forwards}
@keyframes drawl{to{stroke-dashoffset:0}}@keyframes fadein{to{opacity:1}}
.months{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:600;margin-top:4px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70}
.confetti i{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;animation:fall 1.8s var(--ease) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.2}}
/* rendement, comptes, notes de version */
.rd-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.rd-k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;animation:rise .4s var(--ease) backwards;animation-delay:calc(var(--i,0)*45ms)}
.rd-k .n{font:800 20px "Bricolage Grotesque",sans-serif;color:var(--crimson)}.rd-k small{font-size:11px;color:var(--muted);font-weight:600}
.gauge{height:10px;border-radius:10px;background:var(--paper);overflow:hidden;margin:8px 0 4px;border:1px solid var(--line)}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--crimson));border-radius:10px;transform-origin:left;animation:grow 1s var(--ease) .2s backwards}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rd-obj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:6px}
.rd-obj .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700}
.rd-obj .h b{font:800 22px "Bricolage Grotesque",sans-serif;color:var(--crimson)}
.rd-obj small{font-size:11.5px;color:var(--muted)}
.rd-sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--crimson);margin:4px 2px 8px}
.acc-l{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.acc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-top:1px solid var(--line);animation:rise .35s var(--ease) backwards;animation-delay:calc(var(--i,0)*30ms)}
.acc:first-child{border-top:0}
@media (hover:hover){.acc:hover{background:var(--hover)}}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 11.5px "Bricolage Grotesque",sans-serif;flex:0 0 auto}
.acc .t{flex:1;min-width:0}.acc b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acc small{font-size:11.5px;color:var(--muted)}
.rp{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--crimson-tint);color:var(--crimson);flex:0 0 auto}
.rp.dir{background:var(--warn-tint);color:var(--warn)}.rp.an{background:var(--ok-tint);color:var(--ok)}.rp.vi{background:var(--soft);color:var(--muted)}
.cl{border-left:2px solid var(--line);margin-left:8px;padding:0 0 16px 16px;position:relative;animation:rise .4s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
.cl::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--crimson);box-shadow:0 0 0 4px var(--crimson-tint)}
.cl:not(:first-of-type)::before{background:var(--card);border:2px solid var(--crimson);box-shadow:none;width:8px;height:8px}
.cl .v{font:800 15px "Bricolage Grotesque",sans-serif}.cl .v small{font:600 11.5px Inter,sans-serif;color:var(--muted);margin-left:6px}
.cl ul{margin:6px 0 0;padding-left:16px;font-size:13px;color:var(--ink)}.cl li{margin:3px 0}
.cl .tg{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px}
.cl .tg.add{background:var(--ok-tint);color:var(--ok)}.cl .tg.mod{background:var(--info-tint);color:var(--info)}.cl .tg.fix{background:var(--warn-tint);color:var(--warn)}
@media (prefers-reduced-motion:reduce){.pill,.page.slide-next,.page.slide-prev,.sk,.toast.show,.auth-brand,.auth-hero *,.auth-card,.demo-note,.hello,.spark-c path,.confetti i,.gauge i,.rd-k,.acc,.cl,.btn .chk path{animation:none!important;transition:none!important}.spark-c path.l{stroke-dashoffset:0}.spark-c path.a{opacity:1}.btn .chk path{stroke-dashoffset:0}}
/* mode sombre : suit le réglage du téléphone */
/* Mode sombre : choisi dans Paramètres (html.dark), clair par défaut */
html.dark{--crimson:#E2475F;--crimson-tint:#3A1A20;--ink:#F3ECEA;--muted:#A99A9D;--paper:#1A1214;--card:#241A1D;--line:#3A2D30;
    --ok:#5FC08E;--ok-tint:#1D3229;--info:#8EA9E8;--info-tint:#1E2638;--warn:#E3AE4A;--warn-tint:#352A16;--gold-tint:#3A3020;--hover:#2C2024;--soft:#33262A;--topbar:rgba(26,18,20,.92);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}
html.dark .field input,html.dark .field select,html.dark .field textarea,html.dark .icon-btn,html.dark .seg,html.dark .chip:not(.on),html.dark .searchbar,html.dark .gstat,html.dark .stp,html.dark .fh-link .btn,html.dark .seg-sc .knob{background-color:var(--card)}
html.dark .filter-select{background-color:var(--card)}
html.dark .topbar{background:var(--topbar)}
html.dark .badge.rl,html.dark .ck-pill.creation,html.dark .rl-fact.y,html.dark .rl-type.rl{background:var(--gold-tint);color:#E3C27A}
html.dark .seg-sc{background:var(--soft)}
html.dark .dash-band.reg::after{background:linear-gradient(90deg,var(--gold-tint),transparent)}
html.dark .stp.on .stp-ic,html.dark .stp:has(input:checked) .stp-ic{background:var(--card)}
html.dark .toast{background:#F3ECEA;color:#1B1416}

/* ---- chargement : ce que RLS autorise pour l'utilisateur connecté ---- */
async function loadDB(){
  const [zc,ac,cc,lc,rc,ic,mc]=await Promise.all([
    sb.from("zones").select("*"),
    sb.from("animateurs").select("*"),
    sb.from("clubs").select("*"),
    sb.from("lieux").select("*"),
    sb.from("reunions").select("*"),
    sb.from("invites").select("*"),
    sb.from("membres").select("*")
  ]);
  const bad=[zc,ac,cc,lc,rc,ic,mc].find(x=>x.error);
  if(bad){console.error(bad.error);toast("Erreur de chargement des données")}
  DB={
    zones:(zc.data||[]).map(mapZone),
    animateurs:(ac.data||[]).map(mapAnim),
    clubs:(cc.data||[]).map(mapClub),
    lieux:(lc.data||[]).map(mapLieu),
    reunions:(rc.data||[]).map(mapReunion),
    membres:(mc.data||[]).map(mapMembre)
  };
  const adh=await sb.from("adhesions").select("*").order("created_at",{ascending:false});
  DB.adhesions=adh.error?[]:(adh.data||[]); // table absente ou non autorisée → simplement vide
  const byR={};DB.reunions.forEach(m=>byR[m.id]=m);
  (ic.data||[]).forEach(g=>{const m=byR[g.reunion_id];if(m)m.guests.push(mapGuest(g))});
}

function clubHealth(c){
  const membres=DB.membres.filter(m=>m.clubId===c.id);
  const upcoming=DB.reunions.some(r=>r.clubId===c.id&&!isPast(r.date)&&r.statut!=="annulee");
  let score=0,max=0;
  max+=25; if(c.animId)score+=25;
  max+=25; if(upcoming)score+=25;
  max+=25; if(membres.length){const avg=membres.reduce((a,m)=>a+[m.formulaire,m.contrat,m.facture,m.paiement].filter(Boolean).length,0)/(membres.length*4);score+=Math.round(avg*25);}
  if(c.objectif){max+=25;score+=Math.round(Math.min(1,membres.length/c.objectif)*25);}
  const pct=max?Math.round(score/max*100):0;
  const level=pct>=70?"ok":pct>=40?"warn":"bad";
  return{pct,level,nbM:membres.length,upcoming};
}
function clubNextAction(c){
  const membres=DB.membres.filter(m=>m.clubId===c.id);

  if(!DB.reunions.some(r=>r.clubId===c.id&&!isPast(r.date)&&r.statut!=="annulee"))return{label:"Planifier une réunion",act:`meetingForm('','${c.id}')`};
  const relanceM=membres.find(m=>!m.formulaire||!m.contrat||!m.facture||!m.paiement);
  const relance=membres.filter(m=>!m.formulaire||!m.contrat||!m.facture||!m.paiement).length;
  if(relance)return{label:relance+" membre"+(relance>1?"s":"")+" à relancer",act:`memberSheet('${c.id}','${relanceM.id}')`};
  const aInt=DB.reunions.filter(r=>r.clubId===c.id).flatMap(r=>r.guests||[]).filter(g=>g.statut==="À intégrer").length;
  if(aInt)return{label:aInt+" invité"+(aInt>1?"s":"")+" à intégrer",act:`closeSheet();go('agenda')`};
  if(c.objectif&&membres.length<c.objectif)return{label:"Recruter "+(c.objectif-membres.length)+" membre(s)",act:`memberSheet('${c.id}')`};
