<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Espace membre Protéine</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="icone-180.png?v=2">
<link rel="manifest" href="membre.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protéine">
<meta name="theme-color" content="#B0122E">
<meta name="description" content="Espace membre du Club d'affaires Protéine Maroc : annuaire et messages entre membres">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Espace membre (v0.23.0) — charte Protéine, reprise du CRM */
:root{--crimson:#B0122E;--deep:#5C0A18;--darker:#3E0710;--tint:#F8E9EC;--or:#C8A24C;--ink:#1B1416;--muted:#5E5054;--soft:#7A6A6E;
  --paper:#FAF6F4;--card:#FFFFFF;--line:#EADDE0;--line2:#EFE5E7;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,.bri{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.01em;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--crimson)}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.page{flex:1;padding:calc(16px + var(--safe-t)) 18px calc(96px + var(--safe-b));display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--crimson);text-transform:uppercase}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--soft);text-transform:uppercase}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head h1{font-size:26px;font-weight:800}
.sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.search input{border:0;outline:0;background:transparent;font-size:15px;flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line2);animation:rise .35s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*30ms)}
.row .who{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left}
.row .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .t b{font-size:15px}
.row .t span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{font-size:12px;color:var(--soft)}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px;flex-shrink:0}
.av.img{background:#fff!important;overflow:hidden;padding:0}.av.img img{width:100%;height:100%;object-fit:cover;display:block}
.logo-ent{width:56px;height:56px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line2);flex-shrink:0}
.liens{display:flex;flex-wrap:wrap;gap:8px}.liens a{font-size:13.5px;font-weight:600;color:var(--crimson);background:var(--tint);border-radius:10px;padding:8px 12px;text-decoration:none;overflow-wrap:anywhere}
.up{display:flex;align-items:center;gap:12px}.up .btn{height:40px;font-size:13.5px}
.grp-row{border:1px solid var(--crimson)!important;background:var(--tint)!important}
.bulle .aut{display:block;font-size:11.5px;font-weight:700;color:var(--crimson);margin-bottom:2px}.bulle.moi .aut{display:none}
.gv-tete h1{margin:0}.gv-ry{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.gv-reu{display:flex;flex-direction:column;gap:4px;background:var(--deep);color:var(--tint);border-color:transparent}.gv-reu b{color:#fff}
.gv-reu-b{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}.gv-reu-b span{font-size:13px;color:var(--or);font-weight:600}
.gv-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gv-k{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gv-k b{font-size:22px;font-weight:800}.gv-k span{font-size:11.5px;color:var(--muted)}.gv-k.fort{grid-column:1/-1;background:var(--tint);border-color:transparent}
.gv-k.fort span{color:var(--crimson);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px}.gv-k.fort b{font-size:28px}.gv-k.fort small{font-size:12.5px;color:var(--muted)}
.gv-moi,.gv-reg{font-size:13.5px;color:var(--muted);background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}.gv-moi span{font-weight:700;color:var(--ink)}.gv-moi b,.gv-reg b{color:var(--ink)}.gv-moi em{color:var(--crimson);font-style:normal;font-weight:600}.gv-reg span{font-weight:700;color:var(--ink);margin-right:6px}
.gv-mb{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.gv-m{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:8px 10px;min-width:0;color:inherit;font:inherit}
.gv-m .av{width:38px;height:38px;font-size:13px}.gv-m span{display:flex;flex-direction:column;min-width:0}.gv-m b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gv-m small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gv-m.moi{border-color:var(--crimson)}
.gv-chips{display:flex;flex-wrap:wrap;gap:6px}.gv-chips span{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:10px;border:1px dashed var(--crimson);color:var(--crimson)}
.gv-recos{display:flex;flex-direction:column;gap:8px;padding:12px}.gv-recos div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}.gv-recos em{font-style:normal;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px}
.gv-fil{display:flex;flex-direction:column;gap:6px;text-align:left;color:inherit;font:inherit;width:100%}.gv-fil span{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gv-fil em{font-style:normal;color:var(--crimson);font-weight:700;font-size:13px}
.eq-band{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#E8EEF6;color:#2C4A73;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
@media(max-width:420px){.gv-kpis{grid-template-columns:repeat(2,1fr)}}
.tb{display:flex;flex-direction:column;gap:12px}.tb-seg{margin:0}.tb-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tb-k{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}.tb-k span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tb-k b{font-size:21px;font-weight:800;overflow-wrap:anywhere}.tb-k small{font-size:12px;color:var(--muted)}
.tb-k.out{background:var(--tint)}.tb-k.out span{color:var(--crimson)}.tb-k.in{background:#E8EEF6}.tb-k.in span{color:#2C4A73}
.tb-ligne{font-size:13.5px;color:var(--muted)}.tb-ligne span{font-weight:700;color:var(--ink);margin-right:6px}.tb-ligne b{color:var(--ink)}.tb-ligne.alerte{color:var(--crimson);font-weight:600}
.tb-tete{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.tb-tete b{font-size:18px}.tb-tete span{font-size:12.5px;color:var(--muted)}
.tb-gros{background:var(--deep);color:var(--tint);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}.tb-gros span{font-size:12.5px}.tb-gros b{font-size:28px;color:#fff;font-weight:800}.tb-gros small{color:var(--or);font-size:12.5px;font-weight:600}
.tb-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:84px;align-items:end}.tb-bars span{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.tb-bars i{display:block;width:100%;max-width:18px;background:#E3C9CF;border-radius:4px 4px 2px 2px;transform-origin:bottom;animation:tbMonte .6s ease both}.tb-bars span.cur i{background:var(--crimson)}
.tb-bars em{font-style:normal;font-size:10px;color:var(--soft);text-transform:uppercase}@keyframes tbMonte{from{transform:scaleY(0)}}
.tb-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tb-kpis div{display:flex;flex-direction:column;gap:1px;min-width:0}.tb-kpis b{font-family:"Bricolage Grotesque",sans-serif;font-size:20px}.tb-kpis span{font-size:11.5px;color:var(--muted)}
@media(max-width:420px){.tb-kpis{grid-template-columns:repeat(2,1fr)}}.tb-maj{font-size:11.5px;color:var(--soft)}
@media(prefers-reduced-motion:reduce){.tb-bars i{animation:none}}
.ca-perso{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ca-perso div{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}.ca-perso b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px}.ca-perso span{font-size:12.5px;color:var(--muted)}
.ico{width:44px;height:44px;border-radius:14px;border:0;background:var(--tint);color:var(--crimson);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico:disabled{background:#F2EDEE;color:#B9AAAE;cursor:default}
.btn{height:50px;border-radius:14px;border:0;background:var(--crimson);color:#fff;font-weight:700;font-size:15px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--crimson);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.vide{text-align:center;color:var(--muted);font-size:14px;padding:28px 12px}
nav.bas{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line2);padding:6px 12px calc(8px + var(--safe-b));z-index:5}
nav.bas .in{display:flex;justify-content:space-around;width:100%;max-width:560px}
nav.bas button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
nav.bas button.on{color:var(--crimson);font-weight:700}
nav.bas .badge{position:absolute;top:0;right:12px}
/* connexion */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(24px + var(--safe-t)) 22px calc(24px + var(--safe-b));max-width:440px;margin:0 auto;width:100%}
.login img{height:54px;width:auto;align-self:flex-start}
.login h1{font-size:30px;font-weight:800}
.tel{display:flex;align-items:center;height:56px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);overflow:hidden}
.tel:focus-within,.code:focus{border-color:var(--crimson)}
.code::placeholder{letter-spacing:normal;font-size:16px;font-weight:500}
.tel span{padding:0 12px 0 16px;font-weight:700;color:var(--muted);border-right:1px solid var(--line);height:100%;display:flex;align-items:center}
.tel input{border:0;outline:0;background:none;font-size:18px;padding:0 14px;flex:1;min-width:0;letter-spacing:.04em}
.code{height:60px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:26px;letter-spacing:.5em;text-align:center;outline:0;width:100%;font-weight:700}
.msg{font-size:14px;border-radius:12px;padding:12px 14px;background:var(--tint);color:var(--darker)}
.msg.ok{background:#EAF2EA;color:#24502A}
.note{font-size:12.5px;color:var(--muted)}
.lien{border:0;background:none;color:var(--crimson);font-weight:600;padding:8px 0;align-self:flex-start}
/* fiche */
.fiche-top{background:var(--deep);color:#fff;margin:calc(-16px - var(--safe-t)) -18px 4px;padding:calc(12px + var(--safe-t)) 18px 24px;display:flex;flex-direction:column;gap:16px}
.retour{border:0;background:none;color:var(--tint);display:flex;align-items:center;gap:4px;height:44px;padding:0;font-weight:600;align-self:flex-start}
.fiche-top .av{width:72px;height:72px;font-size:24px;border:3px solid var(--or)}
.fiche-top h2{font-size:24px;font-weight:800}
.pill-or{align-self:flex-start;margin-top:6px;padding:4px 10px;border-radius:10px;background:var(--or);color:var(--darker);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}.kv span:first-child{color:var(--muted)}.kv b{text-align:right}
/* messages */
.conv-top{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--paper);z-index:2;margin:calc(-16px - var(--safe-t)) -18px 0;padding:calc(8px + var(--safe-t)) 12px 8px;border-bottom:1px solid var(--line2)}
.conv-top .who{border:0;background:none;display:flex;align-items:center;gap:10px;padding:0;text-align:left;min-width:0}
.conv-top .av{width:40px;height:40px;font-size:14px}
.fil{display:flex;flex-direction:column;gap:6px;padding-bottom:84px}
.bulle{max-width:80%;padding:10px 13px;border-radius:18px 18px 18px 6px;background:var(--card);border:1px solid var(--line2);font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;align-self:flex-start}
.bulle.moi{align-self:flex-end;background:var(--crimson);color:#fff;border-color:var(--crimson);border-radius:18px 18px 6px 18px}
.heure{font-size:11px;color:var(--soft);align-self:flex-start;margin:-2px 4px 4px}
.heure.moi{align-self:flex-end}
.jour{align-self:center;font-size:11px;font-weight:600;color:var(--soft);padding:4px 10px;border-radius:10px;background:#F1E8EA;margin:6px 0}
.saisie{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line2);padding:10px 12px calc(10px + var(--safe-b));display:flex;justify-content:center;z-index:5}
.saisie form{display:flex;align-items:flex-end;gap:8px;width:100%;max-width:560px}
.saisie textarea{flex:1;min-height:44px;max-height:140px;resize:none;border:0;border-radius:22px;background:#F4EEEF;padding:11px 16px;outline:0;font-size:15px}
.saisie button{width:44px;height:44px;border-radius:22px;border:0;background:var(--crimson);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conv-row .t b.nl{font-weight:800}.conv-row .t span.nl{font-weight:600;color:var(--ink)}
.conv-row .quand{font-size:12px;color:var(--soft);flex-shrink:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--crimson);flex-shrink:0}
input.champ1{height:46px;border-radius:12px;border:1px solid var(--line);padding:0 12px;outline:0;font-size:15px;width:100%}input.champ1:focus{border-color:var(--crimson)}
textarea.champ{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);padding:10px 12px;resize:vertical;outline:0}
textarea.champ:focus{border-color:var(--crimson)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.toast{animation-name:toastIn}@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}}
/* recommandations + présence (v0.26.0) */
.club-tot{display:flex;flex-direction:column;gap:4px;background:var(--deep);color:var(--tint);border-color:transparent;font-size:14px}
.club-tot .gros{font-size:30px;color:#fff;font-weight:800}.club-tot small{color:var(--or);font-size:12.5px;font-weight:600}
.seg{display:flex;background:#EFE6E8;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border:0;border-radius:10px;background:none;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(27,20,22,.12)}
.reco{display:flex;flex-direction:column;gap:10px;animation:rise .35s cubic-bezier(.2,.8,.2,1) backwards}
.reco .t{display:flex;flex-direction:column;gap:2px}.reco .t b{font-size:16px}.reco .t span{font-size:13px;color:var(--muted)}
.besoin{margin:0;font-size:14px;color:var(--ink);white-space:pre-line}
.reco .de{font-size:12.5px;color:var(--soft)}.montant{color:#2F5B33}
.chip-st{flex-shrink:0;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:10px;background:#F1E8EA;color:var(--muted)}
.chip-st.contact,.chip-st.devis{background:#E8EEF6;color:#2C4A73}.chip-st.signee{background:#EAF2EA;color:#24502A}.chip-st.envoyee{background:var(--tint);color:var(--crimson)}
.r-meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;font-weight:600}
.chaleur{color:var(--crimson);letter-spacing:.5px}.chaleur.c1,.chaleur.c2{color:var(--muted)}
.prev{color:var(--muted)}.prev.ok{color:#24502A}
.r-coord{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink);user-select:all}
.note-suivi{margin:0;font-size:13px;color:var(--muted)}.note-suivi b{color:var(--ink);margin-right:4px}
.montant-in{display:flex;flex-direction:column;gap:8px}
.r-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chaleurs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chx{cursor:pointer}.chx input{position:absolute;opacity:0;pointer-events:none}
.chx span{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:10.5px;line-height:1.15;padding:8px 4px;border:1px solid var(--line,#E4D9DB);border-radius:10px;color:var(--muted);min-height:58px}
.chx span b{font-size:16px;color:var(--ink)}
.chx input:checked+span{border-color:var(--crimson);background:var(--tint);color:var(--crimson)}.chx input:checked+span b{color:var(--crimson)}
.chx input:focus-visible+span{outline:2px solid var(--crimson);outline-offset:2px}
.prevenu{display:flex;align-items:center;gap:8px;font-size:14px}.prevenu input{width:18px;height:18px;accent-color:var(--crimson)}
.frise{display:flex;gap:4px}
.frise span{flex:1;display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:600;color:var(--soft);min-width:0}
.frise span i{height:5px;border-radius:3px;background:#EFE6E8;transition:background .4s}
.frise span.ok i{background:var(--crimson)}.frise span.cur{color:var(--crimson)}
.frise .fin{font-size:12px;color:var(--soft)}
.r-acts{display:flex;flex-wrap:wrap;gap:8px}
.btn.mini{height:40px;font-size:13.5px;padding:0 14px;border-radius:12px}.btn.sobre{color:var(--soft)}
.montant-in{display:flex;gap:8px}.montant-in input{flex:1}
.dests{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}

<script>
const SB_URL="https://xsppsqjigdgaybmowzaq.supabase.co",SB_KEY="sb_publishable_2uW0CfYvPRJ8TsJw_aNNhA_l7_UQjL7";
const DEMO=location.hash==="#demo";
/* Clé de session distincte du CRM : se connecter ici ne déconnecte pas le CRM ouvert dans le même navigateur. */
/* v1.3.0 : #equipe=<club> = la direction (CRM) regarde un groupe comme un membre. On reprend la session du CRM
   (même site, clé de stockage par défaut). Lecture du groupe et écriture dans son fil seulement. */
const EQ=(location.hash.match(/^#equipe=([0-9a-f-]{36})$/i)||[])[1]||null;
/* v1.5.0 : #moi=<fiche> = un membre de l'équipe (animateur, directeur) ouvre SON espace membre depuis le CRM, avec la
   session du CRM. Le mode est gardé pour l'onglet (sessionStorage) ; jamais de déconnexion ici : ce serait celle du CRM. */
let MOI=(location.hash.match(/^#moi=([0-9a-f-]{36})$/i)||[])[1]||null;
try{if(MOI)sessionStorage.setItem("cap-moi-crm",MOI);else MOI=sessionStorage.getItem("cap-moi-crm")}catch(e){}
const VIA_CRM=!!MOI&&!EQ;
const sb=(EQ||VIA_CRM)?window.supabase.createClient(SB_URL,SB_KEY):window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:"cap-membre-auth",persistSession:true}});
const S={moi:null,annuaire:[],msgs:[],onglet:"accueil",fiche:null,conv:null,q:"",filtre:"tous",tel:"",etape:"tel",canal:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const COUL=[["#F8E9EC","#8A0E24"],["#F4ECD8","#6B5420"],["#E8EEF6","#2C4A73"],["#EAF2EA","#2F5B33"],["#F1E8F4","#5B2F6B"]];
function coul(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return COUL[h%COUL.length]}
function ini(n){const p=String(n||"").replace(/[^\p{L}\s-]/gu," ").trim().split(/\s+/).filter(Boolean);return ((p[0]||"")[0]||"").toUpperCase()+((p[1]||"")[0]||"").toUpperCase()}
function av(m,cls=""){if(m.photo)return `<span class="av img ${cls}"><img src="${esc(m.photo)}" alt="" loading="lazy"></span>`;const [f,e]=coul(m.id);return `<span class="av ${cls}" style="background:${f};color:${e}">${esc(ini(m.nom))}</span>`}

const ICO={envoi:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>',
  loupe:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6A6E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',

/* ---------- Connexion : mobile + code d'accès donné par l'animateur (fonction membre-acces) ----------
   Le compte est un compte Supabase dont l'e-mail est fabriqué à partir du mobile : 212661234567@membres.cap-proteine.ma. */
const DOMAINE="membres.cap-proteine.ma";
function telE164(v){let d=String(v||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("212"))return /^212[5-7]\d{8}$/.test(d)?d:null;if(d.startsWith("0"))d=d.slice(1);return /^[5-7]\d{8}$/.test(d)?"212"+d:null}
function vueLogin(msg){
  $("nav").hidden=true;
  $("app").innerHTML=`<div class="login">
    <img src="logo-proteine.png" alt="Club d'affaires Protéine Maroc">
    <div><div class="eyebrow">Espace membre</div><h1>Bienvenue dans le réseau</h1>
      <p class="sub">Entre ton mobile et le code d'accès que ton animateur t'a donné.</p></div>
    ${msg?`<div class="msg ${msg.ok?"ok":""}">${esc(msg.t)}</div>`:""}
    <form id="f-login" style="display:flex;flex-direction:column;gap:12px">
      <label class="tel"><span>+212</span><input id="l-tel" type="tel" inputmode="tel" autocomplete="username" placeholder="6 61 23 45 67" aria-label="Numéro de mobile" value="${esc(S.telSaisi||"")}"></label>
      <input class="code" id="l-code" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Code d'accès" aria-label="Code d'accès" style="letter-spacing:.25em;font-size:22px">
      <button class="btn" id="l-go" type="submit">Entrer</button>
    </form>
    <p class="note">Pas encore de code, ou code oublié ? Demande à ton animateur : il t'en crée un nouveau en un clic.</p>
  </div>`;
  $("f-login").onsubmit=e=>{e.preventDefault();seConnecter()};
  (S.telSaisi?$("l-code"):$("l-tel")).focus();
}
async function seConnecter(){
  S.telSaisi=$("l-tel").value;
  const t=telE164(S.telSaisi),code=$("l-code").value.trim();
  if(!t)return vueLogin({t:"Ce numéro ne ressemble pas à un mobile marocain. Exemple : 06 61 23 45 67."});
  if(code.length<6)return vueLogin({t:"Le code d'accès fait au moins 6 caractères."});
  const b=$("l-go");b.disabled=true;b.textContent="Connexion…";
  if(DEMO){if(code!=="123456")return vueLogin({t:"Code incorrect. En démonstration, c'est 123456."});return demarrer()}
  const {error}=await sb.auth.signInWithPassword({email:t+"@"+DOMAINE,password:code});
  if(error)return vueLogin({t:/invalid|credentials/i.test(error.message)?"Mobile ou code incorrect. Vérifie le code, ou demande-en un nouveau à ton animateur."
    :/rate|too many/i.test(error.message)?"Trop d'essais d'un coup. Attends quelques minutes avant de réessayer.":"Connexion impossible pour l'instant ("+error.message+")."});
  demarrer();
}

/* ---------- Démarrage ---------- */
async function demarrer(){
  $("app").innerHTML=`<div class="vide" style="margin-top:40vh">Chargement…</div>`;
  if(DEMO){Object.assign(S,demo());return lancer()}
  const {data:moi,error}=await sb.rpc("cap_membre_lier");
  if(VIA_CRM&&(error||moi.statut!=="ok")){$("app").innerHTML=`<div class="page"><div class="card"><b>Espace membre indisponible</b><p class="sub">${esc(error?error.message:"Ta fiche membre n'est pas reliée.")}</p><a class="btn ghost" href="/">Retour au CRM</a></div></div>`;return}
  if(error){await sb.auth.signOut({scope:"local"});return vueLogin({t:"Connexion impossible pour l'instant ("+error.message+")."})}
  if(moi.statut!=="ok"){
    await sb.auth.signOut({scope:"local"});
    return vueLogin({t:moi.statut==="en_cours"?"Ta demande d'adhésion est bien reçue. Ton espace s'ouvrira dès que ton animateur t'aura intégré à ton club : tu pourras alors te connecter avec ce même numéro."
      :moi.statut==="ambigu"?"Ce numéro est inscrit sur plusieurs fiches. Ton animateur doit corriger la fiche en double avant que tu puisses entrer."
      :"Ce numéro n'est relié à aucune fiche membre. Demande à ton animateur de l'ajouter dans ta fiche (mobile), puis réessaie."});
  }
  S.moi=moi;
  await Promise.all([chargerAnnuaire(),chargerMessages(),chargerRecos()]);
  await chargerGv();await chargerGroupe();
  ecouter();lancer();
}
function lancer(){$("nav").hidden=false;
  setInterval(()=>{if(document.hidden||S.onglet!=="recos"||S.recoForm||DEMO)return;chargerRecosClub().then(()=>{if(S.onglet==="recos"&&!S.recoForm)rendu(true)})},60000);
  if(!lienHash())rendu();
  notifEtat().then(e=>{S.notif=e;if(["annuaire","messages","profil"].includes(S.onglet))rendu(true)});
  if(navigator.serviceWorker)navigator.serviceWorker.addEventListener("message",ev=>{const u=ev.data&&ev.data.url;const h=u&&String(u).match(/#([cpr]=.+|g)$/i);if(h){location.hash=h[0]}});}
// Liens entrants : #c=<membre> (conversation), #r=recues|donnees (recommandations), #p=<réunion>.<code> (QR de présence)
function lienHash(){
  const h=location.hash;let m;
  if((m=h.match(/^#c=([0-9a-z-]+)$/i))&&membre(m[1])){history.replaceState(null,"",location.pathname);ouvrirConv(m[1]);return true}
  if(h==="#g"&&clubId()){history.replaceState(null,"",location.pathname);aller("groupe");return true}
  if((m=h.match(/^#r=(recues|donnees)$/))){history.replaceState(null,"",location.pathname);aller("recos",{recoTab:m[1],recoForm:false});return true}
  if((m=h.match(/^#p=([0-9a-f-]{36})\.([0-9a-z]{4,32})$/i))){history.replaceState(null,"",location.pathname);pointer(m[1],m[2]);return true}
  return false;
}
window.addEventListener("hashchange",()=>{if(S.moi)lienHash()});
async function chargerAnnuaire(){let {data,error}=await sb.rpc("cap_annuaire_fiche");if(error)({data,error}=await sb.rpc("cap_annuaire"));if(!error)S.annuaire=data||[]}
const moiFiche=()=>S.annuaire.find(m=>m.moi)||{};
const clubId=()=>(S.gv&&S.gv.club&&S.gv.club.id)||moiFiche().club_id;
async function chargerMessages(){
  const {data,error}=await sb.from("messages_membres").select("id,de,a,texte,cree_le,lu_le").order("cree_le",{ascending:true}).limit(2000);
  if(!error)S.msgs=data||[];
}
let _canal=null;
function ecouter(){
  if(DEMO||_canal)return;
  _canal=sb.channel("msgs-"+S.moi.id).on("postgres_changes",{event:"*",schema:"public",table:"messages_membres"},p=>{
    const r=p.new;if(!r||!r.id)return;
    const i=S.msgs.findIndex(x=>x.id===r.id);if(i>=0)S.msgs[i]=r;else{S.msgs.push(r);if(r.a===S.moi.id&&!(S.conv===r.de&&S.onglet==="conv"))toast("Nouveau message de "+(membre(r.de)?.nom||"un membre"))}
    if(S.onglet==="conv"&&S.conv&&r.de===S.conv&&!r.lu_le)marquerLus(S.conv);
    rendu(true);
  }).on("postgres_changes",{event:"*",schema:"public",table:"recommandations"},p=>{
    const r=p.new;if(!r||!r.id||(r.de!==S.moi.id&&r.a!==S.moi.id))return;
    const i=(S.recos||[]).findIndex(x=>x.id===r.id);
    if(i>=0)S.recos[i]=r;else{(S.recos=S.recos||[]).unshift(r);if(r.a===S.moi.id)toast("Nouvelle recommandation de "+(membre(r.de)?.nom||"un membre"))}
    S.recosClub=undefined;if(["recos","annuaire","profil","messages"].includes(S.onglet))rendu(true);
  }).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages_groupe"},p=>{
    const r=p.new;if(!r||!r.id||r.club_id!==clubId())return;
    if(!(S.grp||[]).some(x=>x.id===r.id)){(S.grp=S.grp||[]).push(r);if(r.membre_id!==S.moi.id&&S.onglet!=="groupe")toast("Groupe · "+r.auteur_nom+" : "+r.texte.slice(0,60))}
    if(S.onglet==="groupe"){const t=$("g-txt"),v=t?t.value:"",f=document.activeElement===t;rendu(true);const n=$("g-txt");if(n){n.value=v;if(f)n.focus()}}else if(!["profil","conv","inviter","recos","fiche"].includes(S.onglet))rendu(true);else{const bn=$("nav-nl");const nl=S.msgs.filter(m=>m.a===S.moi.id&&!m.lu_le).length+grpNonLus();bn.hidden=!nl;bn.textContent=nl}
  }).subscribe();
}
const membre=id=>S.annuaire.find(m=>m.id===id);

/* ---------- Navigation ---------- */
function aller(o,extra){Object.assign(S,{onglet:o},extra||{});window.scrollTo(0,0);rendu()}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>aller(b.dataset.o));
function rendu(garderDefilement){
  const y=window.scrollY;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.o===S.onglet||((S.onglet==="conv"||S.onglet==="groupe")&&b.dataset.o==="messages")||(S.onglet==="fiche"&&b.dataset.o===(S.ficheDe||"annuaire"))));
  const nl=S.msgs.filter(m=>m.a===S.moi.id&&!m.lu_le).length+(S.onglet==="groupe"?0:grpNonLus());const bn=$("nav-nl");bn.hidden=!nl;bn.textContent=nl;
  $("nav").hidden=S.onglet==="conv"||S.onglet==="groupe"||!!S.eq;
  const rc=(S.recos||[]).filter(r=>r.a===S.moi.id&&r.statut==="envoyee").length;const br=$("nav-rc");br.hidden=!rc;br.textContent=rc;
  const v={annuaire:vueAnnuaire,fiche:vueFiche,messages:vueMessages,conv:vueConv,profil:vueProfil,inviter:vueInviter,recos:vueRecos,presence:vuePresence,groupe:vueGroupe,accueil:vueAccueil}[S.onglet];
  $("app").innerHTML=v();
  brancher();
  if(S.onglet==="conv"||S.onglet==="groupe"){const f=document.querySelector(".fil");window.scrollTo(0,document.body.scrollHeight)}

  const {data,error}=await sb.rpc("cap_groupe_vue",EQ?{p_club:EQ}:{});S.gv=error?{erreur:error.message}:data;
}

  const r=c.rythme_pas==2?"Un "+j+" sur deux":c.rythme_rang>0?["","1er","2e","3e","4e"][c.rythme_rang]+" "+j+" du mois":c.rythme_rang==-1?"Dernier "+j+" du mois":"Chaque "+j;

  return `<div class="page">
    ${S.viaCrm?`<div class="eq-band">🪪 Ton espace membre, ouvert depuis le CRM<a class="btn mini ghost" href="/">↩ CRM</a></div>`:""}
    ${S.eq?`<div class="eq-band">👁 Vue membre de ${esc(nom)} · tu vois ce que voient ses membres<button class="btn mini ghost" onclick="window.close()">Fermer</button></div>`:""}
    <div class="gv-tete"><div class="eyebrow">Protéine · ${S.eq?"Vue membre":"Mon groupe"}</div><h1>${esc(nom)}</h1>

      <b class="bri" style="font-size:20px">${esc(quandR)}</b><span>${esc([p.lieu||"Lieu à confirmer",p.ville].filter(Boolean).join(" · "))}</span>

      :`<div class="card"><b>Pas de réunion planifiée.</b><p class="sub">Elle apparaîtra ici dès que l'animateur l'aura programmée.</p></div>`}
    <div class="gv-kpis">

function lienUrl(u){u=String(u||"").trim();if(!u)return"";return /^https?:\/\//i.test(u)?u:"https://"+u}
function liensHTML(m){const l=[];if(m.site)l.push(`<a href="${esc(lienUrl(m.site))}" target="_blank" rel="noopener">🌐 Site</a>`);if(m.linkedin)l.push(`<a href="${esc(lienUrl(m.linkedin))}" target="_blank" rel="noopener">in LinkedIn</a>`);
  String(m.reseaux||"").split(/[\s,;]+/).filter(x=>/\./.test(x)).slice(0,4).forEach(x=>{const n=/instagram/i.test(x)?"Instagram":/facebook/i.test(x)?"Facebook":/tiktok/i.test(x)?"TikTok":/youtube/i.test(x)?"YouTube":/x\.com|twitter/i.test(x)?"X":"Réseau";l.push(`<a href="${esc(lienUrl(x))}" target="_blank" rel="noopener">${n}</a>`)});
  return l.length?`<div class="liens">${l.join("")}</div>`:""}

async function envoyerGroupe(){
  const t=$("g-txt"),txt=t.value.trim();if(!txt)return;t.value="";

  if(/^#moi=/.test(location.hash)){const {error}=await sb.rpc("cap_lier_mon_espace",{p_membre:MOI});history.replaceState(null,"",location.pathname);
